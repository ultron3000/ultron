<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>मराठी चित्रपट संग्रह</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js" defer></script>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>
<style>
  :root{--bg:#070707;--card:#121214;--accent:#ffc107;--btn-bg:#1f1f1f}
  .light{--bg:#f7f7f8;--card:#ffffff;--btn-bg:#ffffff}
  html,body{height:100%;margin:0;font-family:Poppins,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:#fff}
  .light body{color:#111}

  /* logo */
  .site-logo{position:fixed;top:1rem;left:1rem;z-index:80;height:68px;border-radius:10px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.45)}
  .site-logo img{height:100%;display:block}
  .animate-logo{animation:float-pulse 3s ease-in-out infinite,glow 2s ease-in-out infinite alternate}
  @keyframes float-pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes glow{0%{filter:drop-shadow(0 0 2px #ffe) drop-shadow(0 0 6px #ffb)}50%{filter:drop-shadow(0 0 8px #ffe) drop-shadow(0 0 18px #ffb)}}

  header{padding:3.25rem 1rem 0;text-align:center}
  header h1{margin:0;font-size:1.4rem;color:var(--accent);font-weight:700}

  /* toolbar top-right */
  .toolbar{position:fixed;top:12px;right:12px;z-index:90;display:flex;gap:10px;align-items:center}
  .tool-btn{width:48px;height:48px;border-radius:999px;background:var(--btn-bg);display:inline-flex;align-items:center;justify-content:center;border:none;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.45);transition:transform .12s}
  .tool-btn:active{transform:scale(.96)}
  .tool-btn svg{width:22px;height:22px;display:block}
  .light .tool-btn{box-shadow:0 6px 18px rgba(2,6,23,.06)}

  /* grid modes */
  .movie-grid{display:grid;gap:12px;padding:1rem 1rem 3.5rem;margin-top:0}
  .mode-standard .movie-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  @media(min-width:900px){ .mode-standard .movie-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))} }
  @media(min-width:1200px){ .mode-standard .movie-grid{grid-template-columns:repeat(6,1fr)} }

  .mode-dense .movie-grid{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;padding:.8rem}
  @media(min-width:1200px){ .mode-dense .movie-grid{grid-template-columns:repeat(8,1fr)} }

  .mode-card .movie-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:1rem}
  @media(min-width:1200px){ .mode-card .movie-grid{grid-template-columns:repeat(5,1fr)} }

  /* cards */
  .movie-card{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .28s,box-shadow .28s;display:flex;flex-direction:column;align-items:stretch;perspective:1000px;will-change:transform}
  .movie-card:focus{outline:3px solid rgba(255,193,7,.14);outline-offset:3px}
  .card-inner{transform-style:preserve-3d;transition:transform .15s ease-out;will-change:transform}
  .poster{width:100%;height:300px;object-fit:cover;display:block;transition:transform .15s ease-out,box-shadow .15s ease-out;will-change:transform}
  .title{padding:.7rem .6rem;font-weight:700;color:var(--accent);text-align:center;font-size:.95rem}

  .mode-card .movie-card:hover{transform:translateY(-6px)}

  .mode-dense .title{display:none}
  .mode-dense .movie-card:hover .title{display:block;position:relative;padding:.35rem .4rem;background:linear-gradient(180deg,rgba(0,0,0,.0),rgba(0,0,0,.45));color:#fff;font-size:.85rem;text-align:center}

  .mode-standard .poster{height:260px}
  .mode-dense .poster{height:140px}
  .mode-card .poster{height:340px}

  /* modal */
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;justify-content:center;align-items:center;padding:24px}
  .modal.active{display:flex}
  .modal-box{width:min(900px,96vw);max-height:80vh;border-radius:12px;display:flex;flex-direction:column;align-items:stretch;position:relative}
  .modal video,.modal iframe{width:100%;height:auto;max-height:72vh;border-radius:8px;background:#000;border:none;display:block}
  .modal-close{position:absolute;top:-12px;right:-12px;background:var(--btn-bg);border-radius:999px;padding:.35rem .45rem;border:none;cursor:pointer;font-size:1.05rem;box-shadow:0 8px 20px rgba(0,0,0,.5)}
  .light .modal-close{background:#fff;color:#111}

  @media(max-width:640px){ .poster{height:220px} .site-logo{height:52px} .toolbar{gap:8px} }
  /* ============================
   MOBILE FIX — DOES NOT TOUCH DESKTOP
   ============================ */

@media (max-width: 767px) {
  .player-wrapper {
    padding-bottom: 56.25% !important;   
    height: 0 !important;
    position: relative !important;
  }

  .player-wrapper video,
  .player-wrapper iframe {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
  }

  .player-meta {
    display: flex !important;
    flex-direction: column !important;
    gap: 12px !important;
    padding: 12px !important;
    background: #0b1220 !important;
    z-index: 20 !important;
  }

  .controls-row {
    display: flex !important;
    flex-wrap: wrap !important;
    justify-content: center !important;
    gap: 8px !important;
  }

  .btn {
    padding: 8px !important;
    font-size: 0 !important;      
    min-width: 42px !important;
    height: 40px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }

  .btn i {
    font-size: 1.1rem !important;
    margin: 0 !important;
  }

  #topCloseBtn {
    opacity: 1 !important;
  }
}

/* =========================
   PLAYER CONTROLS
   ========================= */

.player-meta{
  background:#0b1220;
  border-top:1px solid rgba(255,255,255,0.08);
}

.controls-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:12px;
  flex-wrap:wrap;
}

.controls-row .btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-width:40px;
  height:40px;
  padding:0 10px;
  font-size:13px;
  border-radius:999px;
  touch-action:manipulation;
}

.controls-row .btn i{
  font-size:15px;
}

.player-container video,
.player-container iframe{
  max-height:70vh;
}

/* =========================
   MOBILE OPTIMIZATION
   ========================= */
@media (max-width: 768px){
  .player-container video,
  .player-container iframe{
    height:52vh;
  }

  .player-meta{
    padding:6px 8px 10px;
  }

  .meta-left{
    display:none; 
  }

  .controls-row{
    justify-content:center;
    gap:6px;
  }

  .controls-row .btn{
    flex:0 1 auto;
    padding:0 10px;
    height:38px;
  }

  .controls-row .btn span{
    display:inline;
  }

  .controls-row .btn i{
    font-size:16px;
  }
}

@media (max-width: 420px){
  .player-container video,
  .player-container iframe{
    height:48vh;
  }
}

/* =========================
   BUTTON COLORS & STYLING
   ========================= */

.controls-row .btn{
  background:transparent;
  border:2px solid #ffc107;
  color:#ffc107;
}

.controls-row .btn i{
  color:#ffc107;
}

.controls-row .btn:hover{
  background:rgba(255,193,7,0.15);
}

@media (max-width:768px){
  .controls-row .btn{
    background:rgba(255,193,7,0.12);
    border:1px solid #ffc107;
  }
}

/* === SMART FULLSCREEN VIDEO FIX === */
video:fullscreen,
video:-webkit-full-screen,
iframe:fullscreen,
iframe:-webkit-full-screen {
  width: 100vw !important;
  height: 100vh !important;
  max-width: 100vw !important;
  max-height: 100vh !important;
  object-fit: contain !important;
  background-color: black;
}

@media (min-aspect-ratio: 16/9) {
  video:fullscreen,
  video:-webkit-full-screen,
  iframe:fullscreen,
  iframe:-webkit-full-screen {
    object-fit: cover !important;
  }
}

/* Marathi cinema redesign — body.html-inspired visual system */
:root{--bg:#09080d;--card:#15121a;--accent:#e7b66f;--btn-bg:#1b1720;--line:rgba(231,182,111,.18);--muted:#b7a9a0}

.light body{color:#211b16}
.site-logo{position:absolute;top:13px;left:clamp(14px,3vw,38px);height:42px;border-radius:12px;box-shadow:0 7px 24px #0005;animation:none}

header{min-height:70px;padding:0 180px;display:flex;align-items:center;justify-content:center;text-align:center}
header h1{font-family:"Space Grotesk","DM Sans",sans-serif;font-size:clamp(17px,2vw,23px);letter-spacing:-.035em;color:var(--accent);font-weight:800}
.toolbar{position:absolute;top:12px;right:clamp(12px,3vw,38px);z-index:90;display:flex;gap:8px;align-items:center}
.tool-btn{width:42px;height:42px;border:1px solid var(--line);background:rgba(25,21,29,.9);color:#f4d6a8;box-shadow:0 8px 24px #0003;backdrop-filter:blur(12px)}
.light .tool-btn{background:#fff;color:#72512a}
.tool-btn svg{width:19px;height:19px}
.marathi-search{height:42px;width:min(260px,28vw);min-width:130px;padding:0 13px 0 38px;border:1px solid var(--line);border-radius:999px;background:rgba(25,21,29,.9);color:#fff;outline:none;font-size:12px;box-shadow:0 8px 24px #0003}

.marathi-hero{position:relative;isolation:isolate;overflow:hidden;min-height:clamp(330px,35vw,465px);border:1px solid rgba(231,182,111,.2);border-radius:25px;background:#100d12;box-shadow:0 25px 75px #0007;touch-action:pan-y}
.marathi-hero-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center 35%;background-repeat:no-repeat;filter:brightness(.78) saturate(1.08);transform:scale(1.015);opacity:1;pointer-events:none}
.marathi-hero:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(8,7,11,.16),rgba(8,7,11,.34) 48%,rgba(8,7,11,.58)),linear-gradient(0deg,rgba(8,7,11,.28),transparent 70%)}
.marathi-hero-inner{position:relative;z-index:2;min-height:inherit;display:grid;grid-template-columns:minmax(170px,245px) minmax(0,1fr);align-items:center;gap:clamp(22px,4vw,55px);padding:clamp(22px,4vw,46px)}

.marathi-hero-nav{position:absolute;right:18px;bottom:18px;display:flex;gap:7px;z-index:3}

.marathi-hero-count{position:absolute;z-index:3;left:clamp(16px,3vw,32px);bottom:24px;color:#ffffffa8;font-size:9px;font-weight:800;letter-spacing:.14em}

.marathi-overline{color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}

.light .marathi-catalogue-title{color:#211b16}

#videoModal .modal-box{position:relative!important;display:flex!important;flex-direction:column!important;align-items:stretch!important;width:min(100%,1020px)!important;max-height:95vh!important;max-height:95dvh!important;height:auto!important;overflow:auto!important;margin:auto!important;border:1px solid rgba(231,182,111,.22)!important;border-radius:16px!important;background:#0d0b11!important;box-shadow:0 30px 90px rgba(0,0,0,.75)!important}
#videoModal .player-container{position:relative!important;display:block!important;flex:0 0 auto!important;width:100%!important;height:auto!important;aspect-ratio:16/9!important;padding:0!important;overflow:hidden!important;background:#000!important}
#videoModal .player-container video,#videoModal .player-container iframe{position:absolute!important;inset:0!important;display:block!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:none!important;aspect-ratio:auto!important;border:0!important;border-radius:0!important;object-fit:contain!important;background:#000!important}
#videoModal .player-meta{position:relative!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:14px!important;flex:0 0 auto!important;padding:14px 16px!important;background:#131018!important;border-top:1px solid rgba(231,182,111,.16)!important;z-index:2!important}
#videoModal .meta-left{min-width:0!important;flex:1 1 auto!important;padding-right:0!important}
#videoModal .player-meta h3{margin:0!important;color:#f5eee6!important;font-size:16px!important;line-height:1.35!important}
#videoModal .player-meta p{margin:5px 0 0!important;color:#a99da5!important;font-size:10px!important}
#videoModal .controls-row{display:flex!important;flex:0 1 auto!important;flex-wrap:wrap!important;justify-content:flex-end!important;gap:7px!important}
#videoModal .controls-row .btn{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:6px!important;min-width:40px!important;width:auto!important;height:39px!important;min-height:39px!important;padding:0 10px!important;font-size:11px!important;white-space:nowrap!important}
#videoModal .modal-close{top:10px!important;right:10px!important;z-index:10!important;width:38px!important;height:38px!important;padding:0!important;border:1px solid #ffffff44!important;background:#080808bb!important;color:#fff!important;font-size:22px!important;line-height:1!important}
#videoModal .top-close{position:absolute!important;top:10px!important;right:10px!important;z-index:8!important;width:38px!important;height:38px!important;border:1px solid #ffffff44!important;border-radius:50%!important;background:#080808bb!important;color:#fff!important;font-size:16px!important}

/* DOM refs */
const gridWrap = document.getElementById('gridWrap');
const modal = document.getElementById('videoModal');
const playerContainer = document.getElementById('playerContainer');
const modalVideoId = 'modalVideo';
let currentHls = null;
let currentIndex = -1;

/* helper checks */
const isYouTube = u => /youtu/i.test(u);
const isHls = u => u && (u.includes('.m3u8') || u.includes('index-') || /\.txt/i.test(u));
const isMP4 = u => /\.mp4/i.test(u);
const isMega = u => u && u.includes('mega.nz');
const isStreamtape = u => u && u.includes('streamtape.com');
const isIndexer = u => u && u.includes("indexer.eu.org");
const isGDrive = u => u.includes("drive.google.com");

/* Efficient catalogue rendering: preserve original movie objects and player indices. */
function makeCard(m){
  const card=document.createElement('article');
  card.className='movie-card';card.tabIndex=0;card.setAttribute('role','button');
  card.setAttribute('aria-label','Play '+m.title);
  const inner=document.createElement('div');inner.className='card-inner';
  const img=document.createElement('img');img.className='poster';img.src=m.image;img.alt=m.title;
  img.loading='lazy';img.decoding='async';
  const title=document.createElement('div');title.className='title';title.textContent=m.title;
  inner.appendChild(img);inner.appendChild(title);card.appendChild(inner);
  const play=()=>playInModal(m.title,m.url,movies.indexOf(m));
  card.addEventListener('click',play);
  card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play();}});
  return card;
}
let catalogueRenderToken=0;
function renderMovies(list){
  const token=++catalogueRenderToken;
  gridWrap.replaceChildren();
  const count=document.getElementById('marathiResultCount');
  count.textContent=list.length+' चित्रपट';
  if(!list.length){const empty=document.createElement('div');empty.className='marathi-empty';empty.textContent='तुमच्या शोधाशी जुळणारे चित्रपट सापडले नाहीत.';gridWrap.appendChild(empty);return;}
  let offset=0;
  function appendBatch(){
    if(token!==catalogueRenderToken)return;
    const fragment=document.createDocumentFragment();
    const stop=Math.min(offset+30,list.length);
    for(;offset<stop;offset++)fragment.appendChild(makeCard(list[offset]));
    gridWrap.appendChild(fragment);
    if(offset<list.length)requestAnimationFrame(appendBatch);
  }
  appendBatch();
}
renderMovies(movies);
const movieSearch=document.getElementById('movieSearch');
movieSearch.addEventListener('input',function(){
 const q=this.value.trim().toLocaleLowerCase('mr');
 renderMovies(movies.filter(m=>m.title.toLocaleLowerCase('mr').includes(q)));
});
/* Featured hero rotates through the existing catalogue; no extra data or video requests. */
let marathiHeroIndex=0,marathiHeroTimer=null,marathiHeroTouchX=null,marathiHeroImageToken=0;
function showMarathiHero(index){
 if(!movies.length)return;
 marathiHeroIndex=(index+movies.length)%movies.length;
 const movie=movies[marathiHeroIndex],poster=document.getElementById('marathiHeroPoster'),bg=document.getElementById('marathiHeroBg');
 const imageUrl=movie.image||'',token=++marathiHeroImageToken;
 poster.alt=movie.title+' poster';
 document.getElementById('marathiHeroTitle').textContent=movie.title;
 document.getElementById('marathiHeroDescription').textContent='मराठी चित्रपटसृष्टीतील '+movie.title+' हा चित्रपट पाहण्यासाठी सज्ज व्हा. तुमच्या आवडीचा चित्रपट शोधा आणि आनंद घ्या.';
 document.getElementById('marathiHeroCount').textContent='FEATURED '+String(marathiHeroIndex+1).padStart(2,'0')+' / '+movies.length;
 if(!imageUrl){poster.removeAttribute('src');bg.style.backgroundImage='none';return;}
 const preload=new Image();preload.decoding='async';preload.src=imageUrl;
 const apply=()=>{if(token!==marathiHeroImageToken)return;poster.src=imageUrl;bg.style.backgroundImage='url("'+String(imageUrl).replace(/["\\]/g,'')+'")';};
 if(preload.decode)preload.decode().then(apply).catch(()=>{if(preload.complete)apply();});
 else {preload.onload=apply;preload.onerror=apply;}
}
function nextMarathiHero(){showMarathiHero(marathiHeroIndex+1)}
function startMarathiHero(){clearInterval(marathiHeroTimer);marathiHeroTimer=setInterval(nextMarathiHero,9000)}
document.getElementById('marathiHeroPrev').addEventListener('click',()=>{showMarathiHero(marathiHeroIndex-1);startMarathiHero()});
document.getElementById('marathiHeroNext').addEventListener('click',()=>{nextMarathiHero();startMarathiHero()});
document.getElementById('marathiHeroShuffle').addEventListener('click',()=>{let n=marathiHeroIndex;if(movies.length>1)while(n===marathiHeroIndex)n=Math.floor(Math.random()*movies.length);showMarathiHero(n);startMarathiHero()});
document.getElementById('marathiHeroPlay').addEventListener('click',()=>playInModal(movies[marathiHeroIndex].title,movies[marathiHeroIndex].url,marathiHeroIndex));
const marathiHero=document.getElementById('marathiHero');
marathiHero.addEventListener('touchstart',e=>{marathiHeroTouchX=e.touches[0].clientX;},{passive:true});
marathiHero.addEventListener('touchend',e=>{if(marathiHeroTouchX===null)return;const dx=e.changedTouches[0].clientX-marathiHeroTouchX;marathiHeroTouchX=null;if(Math.abs(dx)>45){showMarathiHero(marathiHeroIndex+(dx<0?1:-1));startMarathiHero();}},{passive:true});
showMarathiHero(Math.floor(Math.random()*movies.length));startMarathiHero();

/* Player helpers */
function resetPlayer(){
  if(currentHls){ try{ currentHls.destroy(); }catch(e){} currentHls = null; }
  playerContainer.innerHTML = `<video id="${modalVideoId}" controls playsinline></video>`;
}
function showModal(){ modal.classList.add('active'); modal.setAttribute('aria-hidden','false'); document.body.style.overflow = 'hidden'; }
function hideModal(){ modal.classList.remove('active'); modal.setAttribute('aria-hidden','true'); document.body.style.overflow = ''; }

function playInModal(title, url, index){
  currentIndex = index;
  resetPlayer();

  const videoEl = document.getElementById(modalVideoId);

  // STREAMTAPE
  if (isStreamtape(url)) {
    playerContainer.innerHTML =
      `<iframe src="${url}" allow="autoplay; fullscreen"
        allowfullscreen
        style="width:100%;height:72vh;border:0;border-radius:8px"></iframe>`;
    showModal();
    return;
  }

  // YOUTUBE
  if (isYouTube(url)) {
    const id = url.includes('v=')
      ? new URL(url).searchParams.get('v')
      : url.split('/').pop();

    playerContainer.innerHTML =
      `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0"
        allow="autoplay; encrypted-media; fullscreen"
        style="width:100%;height:72vh;border:0;border-radius:8px"
        allowfullscreen></iframe>`;
    showModal();
    return;
  }

  // MEGA
  if (isMega(url)) {
    playerContainer.innerHTML =
      `<iframe src="${url}" allowfullscreen
        style="width:100%;height:72vh;border:0;border-radius:8px"></iframe>`;
    showModal();
    return;
  }

  // GOOGLE DRIVE
  if (isGDrive(url)) {
    let fileId = "";
    const match = url.match(/\/d\/([^/]+)/);
    if (match) fileId = match[1];
    const qp = new URL(url).searchParams.get("id");
    if (!fileId && qp) fileId = qp;

    if (fileId) {
      playerContainer.innerHTML =
        `<iframe src="https://drive.google.com/file/d/${fileId}/preview"
          allow="autoplay; encrypted-media"
          allowfullscreen
          style="width:100%;height:72vh;border:0;border-radius:8px"></iframe>`;
      showModal();
      return;
    }
  }

  // HLS
  if (isHls(url)) {
    if (Hls.isSupported()) {
      currentHls = new Hls();
      currentHls.loadSource(url);
      currentHls.attachMedia(videoEl);
      currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
        showModal();
        videoEl.play().catch(()=>{});
      });
    } else {
      videoEl.src = url;
      showModal();
      videoEl.play().catch(()=>{});
    }
    return;
  }

  // MP4
  if (isMP4(url) || isIndexer(url)) {
    videoEl.src = url;
    showModal();
    videoEl.play().catch(()=>{});
    return;
  }

    // TURBOEMBED
  if (url.includes("turboembed.com")) {
    playerContainer.innerHTML =
      `<iframe src="${url}"
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen
        style="width:100%;height:72vh;border:0;border-radius:8px"></iframe>`;
    showModal();
    return;
  }

  // FALLBACK
  window.location.href =
    `player.html?title=${encodeURIComponent(title)}&video=${encodeURIComponent(url)}`;
}

function getVideo(){
  return document.getElementById(modalVideoId);
}

/* =========================
   PLAYER CONTROLS
   ========================= */
const playPauseBtn = document.getElementById('playPauseBtn');
const nextBtn = document.getElementById('nextBtn');
const prevBtn = document.getElementById('prevBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const muteBtn = document.getElementById('muteBtn');
const directBtn = document.getElementById('directBtn');
const closeBtn = document.getElementById('closeBtn');
const topCloseBtn = document.getElementById('topCloseBtn');

playPauseBtn.addEventListener('click', () => {
  const v = getVideo();
  if (!v) return;
  v.paused ? v.play() : v.pause();
});

nextBtn && nextBtn.addEventListener('click', () => {
  if (currentIndex < movies.length - 1) {
    const m = movies[currentIndex + 1];
    playInModal(m.title, m.url, currentIndex + 1);
  }
});

prevBtn && prevBtn.addEventListener('click', () => {
  if (currentIndex > 0) {
    const m = movies[currentIndex - 1];
    playInModal(m.title, m.url, currentIndex - 1);
  }
});

fullscreenBtn.addEventListener('click', () => {
  const v = getVideo();
  if (v && v.requestFullscreen) {
    v.requestFullscreen();
  } else {
    const iframe = playerContainer.querySelector('iframe');
    iframe && iframe.requestFullscreen && iframe.requestFullscreen();
  }
});

muteBtn.addEventListener('click', () => {
  const v = getVideo();
  if (!v) return;
  v.muted = !v.muted;
});

/* Direct Link Button Action */
directBtn && directBtn.addEventListener('click', () => {
  if (currentIndex >= 0 && movies[currentIndex]) {
    window.open(movies[currentIndex].url, '_blank');
  }
});

closeBtn && closeBtn.addEventListener('click', () => {
  resetPlayer();
  hideModal();
});

topCloseBtn && topCloseBtn.addEventListener('click', () => {
  resetPlayer();
  hideModal();
});

/* close handlers */
document.getElementById('modalClose').addEventListener('click', ()=>{ resetPlayer(); hideModal(); });
modal.addEventListener('click', e=>{ if(e.target === modal){ resetPlayer(); hideModal(); } });
window.addEventListener('keydown', e=>{ if(e.key==='Escape' && modal.classList.contains('active')){ resetPlayer(); hideModal(); } });

/* Grid mode cycling */
const body = document.body;
const gridBtn = document.getElementById('gridBtn');
const GRID_KEY = 'marathi_grid_mode';
const modes = ['mode-standard','mode-dense','mode-card'];
let idx = 0;
function applyMode(i){
  body.classList.remove(...modes);
  body.classList.add(modes[i]);
  localStorage.setItem(GRID_KEY, modes[i]);
}
function cycleMode(){
  idx = (idx + 1) % modes.length;
  applyMode(idx);
}
gridBtn.addEventListener('click', cycleMode);
const saved = localStorage.getItem(GRID_KEY);
if(saved && modes.includes(saved)){ idx = modes.indexOf(saved); applyMode(idx); } else { idx = 0; applyMode(0); }

/* Theme toggle */
const themeBtn = document.getElementById('themeBtn');
const iconSun = document.getElementById('icon-sun');
const iconMoon = document.getElementById('icon-moon');
const THEME_KEY = 'marathi_theme';
function setTheme(t){
  if(t === 'light'){ document.documentElement.classList.add('light'); themeBtn.setAttribute('aria-pressed','true'); iconSun.style.display = 'block'; iconMoon.style.display = 'none'; }
  else { document.documentElement.classList.remove('light'); themeBtn.setAttribute('aria-pressed','false'); iconSun.style.display = 'none'; iconMoon.style.display = 'block'; }
  localStorage.setItem(THEME_KEY, t);
}
themeBtn.addEventListener('click', ()=> setTheme(document.documentElement.classList.contains('light') ? 'dark' : 'light'));
const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
setTheme(savedTheme);

function updateGridTitle(){
  const names = ['Standard Grid','Dense Posters','Card Mode'];
  gridBtn.title = `Grid mode: ${names[idx]}. Click to change.`;
}
updateGridTitle();
gridBtn.addEventListener('click', () => setTimeout(updateGridTitle, 120));

<!-- Disable DevTools + View Source Protection -->
<script src="https://cdn.jsdelivr.net/npm/disable-devtool@latest"></script>

<script>
/* =========================
   Mobile Detection
========================= */
const isMobile =
    /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);

/* =========================
   Disable DevTools
========================= */
DisableDevtool({
    disable: true,
    disableMenu: true,
    clearLog: true,
    disableSelect: true,
    disableCopy: true,
    disableCut: true,
    disablePaste: true,

    /* FIXED */
    disableMobile: false,

    interval: 100,

    ondevtoolopen: function () {

        /* ONLY DESKTOP */
        if (!isMobile) {
            document.body.innerHTML = "";
            window.location.replace("about:blank");
        }
    }
});

/* =========================
   Block View Source Shortcuts
========================= */
document.addEventListener("keydown", function (e) {

    // F12
    if (e.key === "F12") {
        e.preventDefault();
        return false;
    }

    // Ctrl+U
    if (e.ctrlKey && e.key.toLowerCase() === "u") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "i") {
        e.preventDefault();
        return false;
    }

    // Ctrl+Shift+J
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "j") {
        e.preventDefault();
        return false;
    }

    // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "c") {
        e.preventDefault();
        return false;
    }

    // Ctrl+S
    if (e.ctrlKey && e.key.toLowerCase() === "s") {
        e.preventDefault();
        return false;
    }

    // Ctrl+P
    if (e.ctrlKey && e.key.toLowerCase() === "p") {
        e.preventDefault();
        return false;
    }

    // Ctrl+A
    if (e.ctrlKey && e.key.toLowerCase() === "a") {
        e.preventDefault();
        return false;
    }

    // Ctrl+C
    if (e.ctrlKey && e.key.toLowerCase() === "c") {
        e.preventDefault();
        return false;
    }

    // Ctrl+X
    if (e.ctrlKey && e.key.toLowerCase() === "x") {
        e.preventDefault();
        return false;
    }

    // Ctrl+V
    if (e.ctrlKey && e.key.toLowerCase() === "v") {
        e.preventDefault();
        return false;
    }
});

/* =========================
   Disable Right Click
========================= */
document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Dragging
========================= */
document.addEventListener("dragstart", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Selection
========================= */
document.addEventListener("selectstart", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Copy Actions
========================= */
["copy", "cut", "paste"].forEach(function(evt) {

    document.addEventListener(evt, function(e) {
        e.preventDefault();
    });

});

/* =========================
   Detect DevTools Window
   (Desktop ONLY - FIXED)
========================= */
if (!isMobile) {

    setInterval(function () {

        const widthThreshold =
            window.outerWidth - window.innerWidth > 220;

        const heightThreshold =
            window.outerHeight - window.innerHeight > 220;

        if (widthThreshold || heightThreshold) {

            document.body.innerHTML = "";
            window.location.replace("about:blank");
        }

    }, 1500);

}

/* =========================
   Disable Console
========================= */
(function () {

    console.clear();

    function block() {
        return false;
    }

    console.log = block;
    console.warn = block;
    console.error = block;
    console.info = block;
    console.debug = block;
    console.table = block;

})();

/* =========================
   Block "view-source:"
========================= */
if (window.location.href.startsWith("view-source:")) {

    document.body.innerHTML = "";
    window.location.replace("about:blank");

}

/* =========================
   Prevent iframe inspection
========================= */
if (window.top !== window.self) {

    try {
        window.top.location = window.self.location;
    } catch (e) {}

}
</script>

<style>
html, body {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    overflow-x: hidden;
}

/* Disable image dragging */
img {
    pointer-events: none;
    -webkit-user-drag: none;
}

/* Hide selection */
::selection {
    background: transparent;
}
</style>
