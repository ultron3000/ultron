<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Animation Studios Showcase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    
    :root {
      --primary: #8b5cf6;
      --primary-hover: #a855f7;
      --accent: #06b6d4;
      --bg-dark: #0b0f19;
      --card-bg: rgba(23, 31, 50, 0.7);
    }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b0f19 70%, #05070e 100%);
      background-attachment: fixed;
      color: #f3f4f6;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Ambient Glow Header */
    .glow-header {
      background: linear-gradient(180deg, rgba(139, 92, 246, 0.15) 0%, rgba(11, 15, 25, 0) 100%);
    }

    /* Modern Glass Card */
    .movie-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: center;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
    
    .movie-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(168, 85, 247, 0.5);
      box-shadow: 0 20px 35px -10px rgba(139, 92, 246, 0.3), 0 0 15px rgba(6, 182, 212, 0.2);
    }
    
    .search-input {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(16px);
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .search-input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
    }
    
    .movie-poster {
      aspect-ratio: 2/3;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .movie-card:hover .movie-poster {
      transform: scale(1.08);
    }
    
    .category-tab {
      transition: all 0.3s ease;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .category-tab:hover {
      background-color: rgba(139, 92, 246, 0.2);
      border-color: rgba(139, 92, 246, 0.4);
      transform: translateY(-2px);
    }
    
    .category-tab.active {
      background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
      color: #ffffff;
      font-weight: 600;
      border: none;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }
    
    /* Custom Glow Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 10px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #8b5cf6;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-fade-in {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    .delay-100 { animation-delay: 0.05s; }
    .delay-200 { animation-delay: 0.1s; }
    .delay-300 { animation-delay: 0.15s; }
    .delay-400 { animation-delay: 0.2s; }
    
    /* Modal Theme Styles */
    .modal-backdrop { 
      position: fixed; 
      inset: 0; 
      background: rgba(5, 7, 14, 0.9); 
      display: none; 
      align-items: center; 
      justify-content: center; 
      z-index: 9999; 
      backdrop-filter: blur(16px);
    }
    .modal-backdrop.active { display: flex; }
    
    .modal-card { 
      width: 100%;
      height: 100%;
      max-width: 1000px;
      max-height: 100vh;
      background: #0f172a;
      box-shadow: 0 0 50px rgba(139, 92, 246, 0.25);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 768px) {
      .modal-card {
        max-height: 100vh;
      }
      .player-wrapper {
        padding-bottom: 56.25% !important;
      }
      .player-meta {
        padding: 14px !important;
      }
    }
    
    .player-wrapper { 
      position: relative;
      flex: 1;
      min-height: 0;
      background: #000;
    }
    
    #topCloseBtn { 
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.8);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }
    
    #topCloseBtn:hover {
      background: #ef4444;
      border-color: #ef4444;
      transform: scale(1.1);
    }
    
    .player-wrapper video, 
    .player-wrapper iframe { 
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    
    .player-meta { 
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px 24px;
      color: #cbd5e1;
      background: #0b0f19;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
    
    .player-meta h3 { 
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
    }
    
    .controls-row { 
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }
    
    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    
    .btn:hover { 
      background: var(--primary); 
      color: #ffffff;
      border-color: var(--primary-hover);
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
    }
    
    @media (min-width: 768px) {
      .modal-card {
        width: 90%;
        height: auto;
        border-radius: 20px;
        max-height: 90vh;
        overflow: hidden;
      }
      .player-wrapper {
        padding-bottom: 56.25% !important;
        height: 0;
        flex: none;
      }
      .player-meta {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
      .controls-row {
        flex-wrap: nowrap;
      }
    }
    
    @media (max-width: 480px) {
      .btn span { display: none; }
      .btn { padding: 10px 12px; }
    }
    
    video:fullscreen, video:-webkit-full-screen {
      object-fit: contain !important;
      background-color: black;
    }
  
/* ANIMATION SHOWCASE — cinematic poster-led hero and responsive catalogue */
.glow-header{padding-bottom:0!important;background:linear-gradient(180deg,rgba(91,55,166,.22),rgba(11,15,25,0))!important}
.glow-header>.container{padding-top:clamp(14px,2.2vw,25px)!important;padding-bottom:10px!important}
.glow-header header{margin-bottom:clamp(14px,2vw,22px)!important}
.glow-header header h1{font-size:clamp(22px,3vw,34px)!important;line-height:1.12!important;gap:8px!important}
#searchBar{min-height:48px!important;border-radius:15px!important}
.animation-hero{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(145px,205px) minmax(0,1fr);align-items:center;gap:clamp(20px,4vw,52px);min-height:clamp(320px,34vw,420px);margin:8px auto 24px;padding:clamp(22px,4vw,48px);overflow:hidden;border:1px solid rgba(167,139,250,.25);border-radius:24px;background:#0b0f19;box-shadow:0 24px 65px rgba(0,0,0,.36)}
.animation-hero-backdrop{position:absolute;inset:0;z-index:-2;background-position:center 35%;background-size:cover;opacity:.42;transform:scale(1.03);transition:opacity .35s ease}
.animation-hero-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(7,9,20,.52),rgba(7,9,20,.86) 37%,rgba(7,9,20,.96) 100%),linear-gradient(0deg,rgba(7,9,20,.55),transparent 70%)}
.animation-hero-poster{width:100%;max-width:205px;aspect-ratio:2/3;overflow:hidden;border:1px solid rgba(196,181,253,.6);border-radius:15px;background:#17152a;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.animation-hero-poster img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.animation-hero-content{min-width:0;max-width:700px}
.animation-hero-kicker{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid rgba(167,139,250,.3);border-radius:999px;background:rgba(15,23,42,.62);color:#c4b5fd;font-size:10px;font-weight:800;letter-spacing:.16em}
.animation-hero-dot{width:5px;height:5px;border-radius:50%;background:#22d3ee}
.animation-hero-content h2{margin:14px 0 8px;color:#fff;font-size:clamp(27px,4.2vw,52px);font-weight:800;line-height:1.08;letter-spacing:-.035em;text-wrap:balance}
.animation-hero-meta{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 12px;color:#a5b4fc;font-size:12px;font-weight:700}
.animation-hero-meta span{padding:5px 9px;border:1px solid rgba(255,255,255,.1);border-radius:7px;background:rgba(15,23,42,.55)}
.animation-hero-content p{display:-webkit-box;max-width:600px;margin:0;color:#d1d5db;font-size:14px;line-height:1.65;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.animation-hero-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:19px}
.animation-hero-actions button{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:42px;padding:0 17px;border:1px solid rgba(255,255,255,.16);border-radius:11px;background:rgba(255,255,255,.08);color:#fff;font-size:12px;font-weight:800;transition:transform .2s ease,background .2s ease,border-color .2s ease}
#animationHeroPlay{border-color:transparent;background:linear-gradient(115deg,#8b5cf6,#06b6d4);box-shadow:0 8px 24px rgba(99,102,241,.28)}
.animation-hero-actions button:hover{transform:translateY(-2px);background:rgba(139,92,246,.28);border-color:rgba(167,139,250,.55)}
.animation-hero-navigation{position:absolute;right:clamp(14px,2vw,24px);bottom:16px;display:flex;align-items:center;gap:9px}
.animation-hero-navigation>button{width:32px;height:32px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(15,23,42,.75);color:#fff}
.animation-hero-navigation>span{display:flex;align-items:center;gap:7px;color:#94a3b8;font-size:10px;font-weight:700}
.animation-hero-navigation b{color:#fff;font-size:15px}
.animation-hero-navigation i{width:20px;height:1px;background:rgba(255,255,255,.35)}
#movies{grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:16px!important;margin-bottom:48px!important}
.movie-card{min-width:0;border-radius:14px!important;overflow:hidden;background:linear-gradient(150deg,rgba(30,35,60,.94),rgba(10,14,26,.98))!important;border-color:rgba(167,139,250,.16)!important;box-shadow:0 12px 28px rgba(0,0,0,.3)!important}
.movie-card:hover{transform:translateY(-5px)!important;border-color:rgba(139,92,246,.55)!important}
.movie-poster{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}
.movie-card>div:last-child{padding:11px!important;min-height:64px}
.movie-card h3{font-size:12px!important;line-height:1.4!important;white-space:normal!important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.movie-card p{font-size:10px!important;line-height:1.4!important}
@media(max-width:1024px){#movies{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:14px!important}}
@media(max-width:640px){
 .glow-header>.container{padding:12px 14px 6px!important}
 .glow-header header{margin-bottom:13px!important}
 .glow-header header>a img{height:34px!important}
 .glow-header header h1{font-size:21px!important;gap:5px!important}
 .glow-header header h1 span{font-size:18px}
 #searchBar{min-height:43px!important;padding-top:10px!important;padding-bottom:10px!important;font-size:13px!important}
 .animation-hero{grid-template-columns:minmax(88px,30%) minmax(0,1fr);gap:12px;min-height:250px;margin:5px 12px 17px;padding:14px 12px 40px;border-radius:17px}
 .animation-hero-backdrop{background-position:58% center;opacity:.38}
 .animation-hero-shade{background:linear-gradient(90deg,rgba(7,9,20,.45),rgba(7,9,20,.83) 43%,rgba(7,9,20,.94)),linear-gradient(0deg,rgba(7,9,20,.58),transparent 75%)}
 .animation-hero-poster{max-width:none;border-radius:9px}
 .animation-hero-kicker{gap:5px;padding:5px 7px;font-size:7px;letter-spacing:.08em}
 .animation-hero-content h2{font-size:clamp(18px,5.3vw,27px);line-height:1.15;margin:9px 0 6px}
 .animation-hero-meta{gap:5px;margin-bottom:7px;font-size:9px}
 .animation-hero-meta span{padding:4px 6px}
 .animation-hero-content p{font-size:10px;line-height:1.45;-webkit-line-clamp:3}
 .animation-hero-actions{gap:6px;margin-top:10px}
 .animation-hero-actions button{min-height:32px;padding:0 9px;border-radius:8px;font-size:9px;gap:5px}
 .animation-hero-navigation{right:10px;bottom:8px;gap:6px}
 .animation-hero-navigation>button{width:27px;height:27px;font-size:10px}
 .animation-hero-navigation>span{font-size:8px;gap:5px}
 .animation-hero-navigation b{font-size:12px}
 .animation-hero-navigation i{width:13px}
 #movies{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important;margin-bottom:32px!important}
 .movie-card{border-radius:10px!important}
 .movie-card>div:last-child{padding:8px 7px!important;min-height:51px}
 .movie-card h3{font-size:10px!important}
 .movie-card p{font-size:9px!important}
}
@media(max-width:370px){
 .glow-header header h1{font-size:18px!important}
 .animation-hero{grid-template-columns:82px minmax(0,1fr);gap:9px;min-height:226px;padding:11px 9px 37px}
 .animation-hero-kicker{font-size:6px;letter-spacing:.04em}
 .animation-hero-content h2{font-size:18px}
 .animation-hero-content p{-webkit-line-clamp:2;font-size:9px}
 .animation-hero-actions button{padding:0 7px;font-size:8px}
 #movies{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}
@media(prefers-reduced-motion:reduce){.movie-card,.movie-poster,.animation-hero-backdrop,.animation-hero-actions button{transition:none!important}.movie-card:hover{transform:none!important}}

</style>
</head>

<body>
  <!-- Ambient Glow Header -->
  <div class="glow-header w-full pb-4">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
      <header class="relative flex items-center justify-between mb-8">
        <a href="https://ultron3000.github.io/ultron" class="flex items-center gap-3 group">
          <img src="https://static.readdy.ai/image/0ece273271e400e488b9947cb1e99e9a/a79b6f32c71c4ee2094ead0eb9c84c9b.png" alt="Logo" class="h-9 sm:h-11 drop-shadow-[0_0_10px_rgba(139,92,246,0.5)] group-hover:scale-105 transition-transform"/>
        </a>
        <div class="text-center flex-1">
          <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-purple-400 via-cyan-400 to-indigo-300 inline-flex items-center gap-3">
            <span>🎬</span> Animation Studios
          </h1>
        </div>
        <div class="w-10 sm:w-12"></div><!-- Spacer for centering symmetry -->
      </header>

      <!-- Search Bar -->
      <div class="mb-5 flex justify-center">
        <div class="relative w-full max-w-xl">
          <input type="text" id="searchBar" placeholder="Search animated movies..." class="search-input w-full px-6 py-3.5 pl-12 rounded-2xl text-white placeholder-gray-400 focus:outline-none text-sm sm:text-base"/>
          <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-purple-400"></i>
        </div>
      </div>
    </div>
  </div>

  <section id="animationHero" class="animation-hero container mx-auto max-w-7xl" aria-label="Featured animated movie">
    <div class="animation-hero-backdrop" id="animationHeroBackdrop"></div>
    <div class="animation-hero-shade"></div>
    <div class="animation-hero-poster"><img id="animationHeroPoster" alt="" fetchpriority="high" decoding="async"/></div>
    <div class="animation-hero-content">
      <div class="animation-hero-kicker"><i class="fas fa-sparkles"></i><span>FEATURED ANIMATION</span><span class="animation-hero-dot"></span><span id="animationHeroCategory">ANIMATION</span></div>
      <h2 id="animationHeroTitle">Discover Animation</h2>
      <div class="animation-hero-meta"><span id="animationHeroYear"></span><span id="animationHeroDuration"></span></div>
      <p id="animationHeroDescription"></p>
      <div class="animation-hero-actions">
        <button id="animationHeroPlay" type="button"><i class="fas fa-play"></i> Watch Now</button>
        <button id="animationHeroShuffle" type="button"><i class="fas fa-shuffle"></i> Shuffle</button>
      </div>
    </div>
    <div class="animation-hero-navigation">
      <button id="animationHeroPrev" type="button" aria-label="Previous featured movie"><i class="fas fa-chevron-left"></i></button>
      <span><b id="animationHeroCount">01</b><i></i><span id="animationHeroTotal">00</span></span>
      <button id="animationHeroNext" type="button" aria-label="Next featured movie"><i class="fas fa-chevron-right"></i></button>
    </div>
  </section>

  <div class="container mx-auto px-4 py-4 max-w-7xl">
    <!-- Main Grid -->
    <div id="movies" class="grid grid-cols-2 xs:grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5 mb-16"></div>

    <!-- Footer -->
    <div class="border-t border-gray-800/80 mt-16 pt-8 pb-8 text-center text-gray-500">
      <div class="flex justify-center space-x-6 mb-4">
        <a href="#" class="text-gray-400 hover:text-purple-400 transition-colors text-lg"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="text-gray-400 hover:text-purple-400 transition-colors text-lg"><i class="fab fa-twitter"></i></a>
        <a href="https://www.instagram.com/stark_4152/reels" class="text-gray-400 hover:text-purple-400 transition-colors text-lg"><i class="fab fa-instagram"></i></a>
        <a href="https://www.youtube.com/channel/UCD9dGWVkAjrdm3D_7gkbi2g" class="text-gray-400 hover:text-purple-400 transition-colors text-lg"><i class="fab fa-youtube"></i></a>
      </div>
      <p class="text-xs text-gray-500">© Other Animation Studios Showcase • All Rights Reserved</p>
    </div>
  </div>

  <!-- Playback Modal -->
  <div id="playbackModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="player-wrapper" id="playerWrapper">
        <video id="modalVideo" controls playsinline style="width:100%;height:100%;background:#000"></video>
        <button id="topCloseBtn">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="player-meta">
        <div class="meta-left max-w-[100%] md:max-w-[45%]">
          <h3 id="modalTitle" class="truncate">Title</h3>
          <p id="modalDesc" class="text-xs sm:text-sm text-gray-400 line-clamp-2 mt-1 leading-relaxed"></p>
        </div>
        <div class="controls-row">
          <button id="prevBtn" class="btn"><i class="fas fa-step-backward"></i><span>Prev</span></button>
          <button id="playPauseBtn" class="btn"><i class="fas fa-play"></i><span>Play</span></button>
          <button id="nextBtn" class="btn"><span>Next</span><i class="fas fa-step-forward"></i></button>
          <button id="fullscreenBtn" class="btn"><i class="fas fa-expand"></i></button>
          <button id="muteBtn" class="btn"><i class="fas fa-volume-up"></i></button>
          <button id="closeBtn" class="btn !bg-red-500/20 !border-red-500/30 hover:!bg-red-600 hover:!border-red-600 text-white"><i class="fas fa-times"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Embedded JSON Movies List
    let movies = [
      {
  title: "Astro Boy",
  category: "Animation",
  year: 2009,
  duration: "1h 34m",
  description: "When a young robot with incredible superpowers is created by a brilliant scientist in the futuristic city of Metro City, he embarks on an adventure to find his place in the world and save his friends.",
  image: "https://image.tmdb.org/t/p/w500/6AK3uOHaIbl6EDaytHYe4FinZMu.jpg",
  video: "https://mega.nz/embed/SrRiAZTI#BHQw0on4tQzVF0lwySQVL_OUel97HqoC-tVyQOOmJ7w"
},
{
  title: "Astro Kid",
  category: "Animation",
  year: 2019,
  duration: "1h 30m",

    const playbackModal = document.getElementById('playbackModal');
    const playerWrapper = document.getElementById('playerWrapper');
    const modalVideoId = 'modalVideo';
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const muteBtn = document.getElementById('muteBtn');

    let currentHls = null;
    let currentFiltered = [];
    let currentIndex = null;

    function isMP4(url) { return /\.mp4($|\?)/i.test((url||'')); }
    function isHls(url) {
      if (!url) return false;
      return url.includes('.m3u8') || url.includes('index-') || /index.*\.txt/i.test(url) || url.includes('manifest') || url.includes('master');
    }
    function isYouTube(url) {
      if (!url) return false;
      return url.includes('youtube.com') || url.includes('youtu.be') || url.includes('youtube-nocookie.com') || url.includes('/embed/');
    }

    function resetPlayerContainer() {
      if (currentHls) {
        try { currentHls.destroy(); } catch(e) {}
        currentHls = null;
      }
      if (window.shakaPlayer) {
        try { window.shakaPlayer.destroy(); } catch(e) {}
        window.shakaPlayer = null;
      }
      playerWrapper.innerHTML = `<video id="${modalVideoId}" controls playsinline style="width:100%;height:100%;background:#000"></video>`;
    }

    function triggerExternalFallback(movie, src) {
      console.log("Playback failed. Staying in modal player.");
    }

    function showModal() {
      playbackModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function hideModal() {
      playbackModal.classList.remove('active');
      document.body.style.overflow = '';
    }

    async function openPlayer(list, index) {
      if (!Array.isArray(list) || list.length === 0 || index == null || index < 0 || index >= list.length) return;
      
      currentFiltered = list;
      currentIndex = index;
      const movie = list[index];
      if (!movie) return;

      modalTitle.textContent = movie.title || '';
      modalDesc.textContent = movie.description || (movie.language ? `${movie.language} • Animated Movie` : 'Animated Movie');

      resetPlayerContainer();
      showModal();

      let src = (typeof movie.video === 'object' && movie.video !== null) ? (movie.video.high || Object.values(movie.video)[0]) : movie.video;
      if (!src) return;

      const lc = src.toLowerCase();

      // Native Element Error Hook for global fallback handling
      setTimeout(() => {
        const vEl = document.getElementById(modalVideoId);
        if (vEl) {
          vEl.addEventListener('error', () => triggerExternalFallback(movie, src));
        }
      }, 100);

      // Mega.nz or embedded frame links handler logic block
      if (lc.includes('mega.nz') || lc.includes('waptv.wapka.xyz') || lc.includes('tv4wab.pages.dev') || lc.includes('trend48.st') || lc.includes('24spn-webhost8.blogspot.com') ||
          lc.includes('livesportz.cfd') || lc.includes('tvwap.pages.dev') || lc.includes('sonucdn-v3.pages.dev') || lc.includes('live4wab.pages.dev') ||
          lc.includes('joplay.lrl45.workers.dev') || lc.includes('jiogo.pages.dev') || lc.includes('tvgotk.wapka.site') || 
          lc.includes('dood') || lc.includes('vidcdn') || lc.includes('ok.ru') || lc.includes('livecricketsl.cc.nf')) {
        playerWrapper.innerHTML = `<iframe src="${src}" width="100%" height="100%" frameborder="0" allowfullscreen allow="autoplay; encrypted-media" style="background:#000"></iframe>`;
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        return;
      }

      // DASH / MPD Key setup
      if (typeof movie.video === 'object' && movie.video.mpd) {
        const v = document.getElementById(modalVideoId);
        try {
          window.shakaPlayer = new shaka.Player(v);
          window.shakaPlayer.addEventListener('error', () => triggerExternalFallback(movie, src));
          if (movie.video.key) {
            const [kid, key] = movie.video.key.split(':');
            window.shakaPlayer.configure({ drm: { clearKeys: { [kid]: key } } });
          }
          await window.shakaPlayer.load(movie.video.mpd);
          v.play().catch(()=>{});
          playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
          return;
        } catch (e) { 
          triggerExternalFallback(movie, src);
          return;
        }
      }

      // YouTube player
      if (isYouTube(src)) {
        let embed = src;
        if (src.includes('watch') && src.includes('v=')) {
          const v = new URLSearchParams(src.split('?')[1]).get('v');
          if (v) embed = `https://www.youtube.com/embed/${v}`;
        }
        playerWrapper.innerHTML = `<iframe src="${embed}?autoplay=1&modestbranding=1" width="100%" height="100%" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        return;
      }

      // HLS Stream Engine Implementation
      if (isHls(src)) {
        const v = document.getElementById(modalVideoId);
        if (window.Hls && Hls.isSupported()) {
          currentHls = new Hls({
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            liveSyncDurationCount: 3,
            liveMaxLatencyDurationCount: 6,
            enableWorker: true,
            lowLatencyMode: true,
            abrEwmaDefaultEstimate: 5000000,
            backBufferLength: 30
          });
          currentHls.loadSource(src);
          currentHls.attachMedia(v);
          
          currentHls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  currentHls.startLoad();
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  currentHls.recoverMediaError();
                  break;
                default:
                  triggerExternalFallback(movie, src);
                  break;
              }
            }
          });

          currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
            currentHls.startLoad(-1);
            v.play().catch(() => {});
            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
          });

          currentHls.on(Hls.Events.FRAG_BUFFERED, () => {
            if (v.paused) {
              v.play().catch(() => {});
            }
          });
        } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
          v.src = src;
          v.play().catch(()=>{});
          playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        } else {
          triggerExternalFallback(movie, src);
        }
        return;
      }

      // MP4 streams fallback loop 
      if (isMP4(src)) {
        const v = document.getElementById(modalVideoId);
        v.src = src;
        v.play().catch(()=>{});
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        return;
      }
    }

    function togglePlayPause() {
      const v = document.getElementById(modalVideoId);
      if (!v) return;
      if (v.paused) {
        v.play().catch(()=>{});
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
      } else {
        v.pause();
        playPauseBtn.innerHTML = '<i class="fas fa-play"></i><span>Play</span>';
      }
    }

    function playNext() {
      if (!currentFiltered.length) currentFiltered = movies.slice();
      if (currentIndex != null && currentIndex < currentFiltered.length - 1) openPlayer(currentFiltered, currentIndex + 1);
    }

    function playPrev() {
      if (!currentFiltered.length) currentFiltered = movies.slice();
      if (currentIndex != null && currentIndex > 0) openPlayer(currentFiltered, currentIndex - 1);
    }

    function toggleFullscreen() {
      const el = document.getElementById(modalVideoId) || playerWrapper.querySelector('iframe');
      if (!el) return;
      if (!document.fullscreenElement) (el.requestFullscreen || playerWrapper.requestFullscreen).call(el).catch(()=>{});
      else document.exitFullscreen();
    }

    function toggleMute() {
      const v = document.getElementById(modalVideoId);
      if (!v) return;
      v.muted = !v.muted;
      muteBtn.innerHTML = v.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    }

    function closeModalHandler() {
      if (currentHls) { currentHls.destroy(); currentHls = null; }
      const v = document.getElementById(modalVideoId);
      if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
      resetPlayerContainer();
      hideModal();
      playPauseBtn.innerHTML = '<i class="fas fa-play"></i><span>Play</span>';
    }

    playPauseBtn.addEventListener('click', togglePlayPause);
    nextBtn.addEventListener('click', playNext);
    prevBtn.addEventListener('click', playPrev);
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    muteBtn.addEventListener('click', toggleMute);
    document.getElementById('closeBtn').addEventListener('click', closeModalHandler);
    document.getElementById('topCloseBtn').addEventListener('click', closeModalHandler);
    playbackModal.addEventListener('click', (e) => { if (e.target === playbackModal) closeModalHandler(); });

    const container = document.getElementById('movies');
    
    // Redesigned Showcase Rendering (keeping player triggering intact)
    function renderMovies(moviesToRender) {
      container.innerHTML = '';
      moviesToRender.forEach((movie, index) => {
        const delayClass = `delay-${(index % 5) * 100}`;
        const div = document.createElement('div');
        div.className = `movie-card animate-fade-in ${delayClass} rounded-2xl overflow-hidden cursor-pointer relative group flex flex-col justify-between`;
        div.innerHTML = `
          <div class="relative overflow-hidden w-full">
            <img src="${movie.image}" alt="${movie.title}" class="w-full movie-poster" loading="lazy">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f19] via-transparent to-black/30 opacity-60 group-hover:opacity-90 transition-opacity duration-300"></div>
            
            <!-- Badges -->
            <div class="absolute top-2.5 left-2.5 flex flex-col gap-1">
              ${movie.year ? `<span class="bg-black/60 backdrop-blur-md text-purple-300 text-[10px] font-bold px-2 py-0.5 rounded-md border border-purple-500/30">${movie.year}</span>` : ''}
            </div>
            ${movie.duration ? `<span class="absolute top-2.5 right-2.5 bg-black/60 backdrop-blur-md text-cyan-300 text-[10px] font-medium px-2 py-0.5 rounded-md border border-cyan-500/30">${movie.duration}</span>` : ''}

            <!-- Play Overlay Button -->
            <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300 scale-90 group-hover:scale-100">
              <span class="bg-gradient-to-tr from-purple-600 to-cyan-500 text-white rounded-full p-4 shadow-xl shadow-purple-900/50 flex items-center justify-center">
                <i class="fas fa-play text-base translate-x-0.5"></i>
              </span>
            </div>
          </div>
          
          <div class="p-3.5 bg-slate-900/40 border-t border-white/5 flex flex-col justify-between flex-1">
            <h3 class="font-bold text-sm sm:text-base truncate text-gray-100 group-hover:text-purple-300 transition-colors">${movie.title}</h3>
            <p class="text-xs text-gray-400 mt-1 line-clamp-1 font-light">${movie.description || movie.category}</p>
          </div>
        `;
        div.addEventListener('click', () => openPlayer(moviesToRender, index));
        container.appendChild(div);
      });
    }

    // Featured animation hero: reuses the existing movie records and player.
    const animationHero = document.getElementById('animationHero');
    const animationHeroBackdrop = document.getElementById('animationHeroBackdrop');
    const animationHeroPoster = document.getElementById('animationHeroPoster');
    const animationHeroTitle = document.getElementById('animationHeroTitle');
    const animationHeroDescription = document.getElementById('animationHeroDescription');
    const animationHeroYear = document.getElementById('animationHeroYear');
    const animationHeroDuration = document.getElementById('animationHeroDuration');
    const animationHeroCount = document.getElementById('animationHeroCount');
    const animationHeroTotal = document.getElementById('animationHeroTotal');
    let animationHeroPool = movies.slice();
    let animationHeroIndex = 0;
    let animationHeroTimer = null;

    function showAnimationHero(index) {
      if (!animationHeroPool.length) {
        animationHero.hidden = true;
        return;
      }
      animationHero.hidden = false;
      animationHeroIndex = (index + animationHeroPool.length) % animationHeroPool.length;
      const movie = animationHeroPool[animationHeroIndex];
      const image = movie.image || '';
      animationHeroTitle.textContent = movie.title || 'Animation';
      animationHeroDescription.textContent = movie.description || 'Explore the animation collection.';
      animationHeroYear.textContent = movie.year || 'Animated Feature';
      animationHeroDuration.textContent = movie.duration || 'Feature';
      document.getElementById('animationHeroCategory').textContent = movie.category || 'ANIMATION';
      animationHeroCount.textContent = String(animationHeroIndex + 1).padStart(2,'0');
      animationHeroTotal.textContent = String(animationHeroPool.length).padStart(2,'0');
      animationHeroPoster.alt = (movie.title || 'Animation') + ' poster';
      if (image) {
        animationHeroPoster.src = image;
        animationHeroBackdrop.style.backgroundImage = 'url("' + image.replace(/["\\]/g,'') + '")';
      } else {
        animationHeroPoster.removeAttribute('src');
        animationHeroBackdrop.style.backgroundImage = 'none';
      }
      document.getElementById('animationHeroPlay').onclick = () => openPlayer(animationHeroPool, animationHeroIndex);
    }

    function shuffleAnimationHero() {
      if (animationHeroPool.length < 2) return showAnimationHero(0);
      const options = animationHeroPool.map((_,i)=>i).filter(i=>i!==animationHeroIndex);
      showAnimationHero(options[Math.floor(Math.random()*options.length)]);
    }

    renderMovies(movies);
    shuffleAnimationHero();

    document.getElementById('animationHeroShuffle').addEventListener('click',shuffleAnimationHero);
    document.getElementById('animationHeroPrev').addEventListener('click',()=>showAnimationHero(animationHeroIndex-1));
    document.getElementById('animationHeroNext').addEventListener('click',()=>showAnimationHero(animationHeroIndex+1));

    const stopAnimationHeroTimer = () => {
      if (animationHeroTimer) { clearInterval(animationHeroTimer); animationHeroTimer = null; }
    };
    const startAnimationHeroTimer = () => {
      stopAnimationHeroTimer();
      if (document.hidden || animationHero.matches(':hover') ||
          animationHero.contains(document.activeElement) ||
          playbackModal.classList.contains('active') ||
          window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      animationHeroTimer = window.setInterval(shuffleAnimationHero,10000);
    };
    animationHero.addEventListener('mouseenter',stopAnimationHeroTimer);
    animationHero.addEventListener('mouseleave',startAnimationHeroTimer);
    animationHero.addEventListener('focusin',stopAnimationHeroTimer);
    animationHero.addEventListener('focusout',startAnimationHeroTimer);
    document.addEventListener('visibilitychange',startAnimationHeroTimer);

    document.getElementById('searchBar').addEventListener('input', function() {
      const searchTerm = this.value.toLowerCase().trim();
      const filtered = movies.filter(movie =>
        movie.title.toLowerCase().includes(searchTerm) ||
        (movie.description && movie.description.toLowerCase().includes(searchTerm))
      );
      renderMovies(filtered);
      animationHeroPool = filtered.length ? filtered : movies.slice();
      if (animationHeroPool.length < 2) showAnimationHero(0);
      else shuffleAnimationHero();
    });

    document.querySelectorAll('.category-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        const category = this.dataset.category;
        renderMovies(category === 'all' ? movies : movies.filter(movie => movie.category === category));
      });
    });
  </script>
