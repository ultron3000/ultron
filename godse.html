<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Nathuram Godse Marathi Natak Archive</title>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@300;400;500;600;700&display=swap');
    
    :root {
      --primary: #d97706; 
      --secondary: #18110e; 
      --accent: #f59e0b; 
      --holo-glow: rgba(245, 158, 11, 0.2);
      --natak-glow: rgba(217, 119, 6, 0.2);
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at 50% 0%, #291811 0%, #18110e 70%, #0d0a08 100%);
      color: #f3f4f6;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    
    .natak-heading {
      font-family: 'Cinzel', serif;
      letter-spacing: -0.02em;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    /* Elegant Archive Cards */
    .movie-card {
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
      border: 1px solid rgba(245, 158, 11, 0.15);
      background: rgba(41, 24, 17, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    
    .movie-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.25), inset 0 0 15px rgba(217, 119, 6, 0.1);
      border-color: var(--accent);
    }
    
    .holo-glow-text {
      text-shadow: 0 0 12px rgba(245, 158, 11, 0.6), 0 0 25px rgba(217, 119, 6, 0.4);
    }
    
    .movie-poster {
      aspect-ratio: 2/3;
      transition: transform 0.5s ease;
    }
    
    .movie-card:hover .movie-poster {
      transform: scale(1.04);
    }
    
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #18110e;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-fade-in {
      animation: fadeIn 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
    }
    
    .delay-100 { animation-delay: 0.1s; }
    .delay-200 { animation-delay: 0.2s; }
    .delay-300 { animation-delay: 0.3s; }
    .delay-400 { animation-delay: 0.4s; }
    
    /* Fixed & Upgraded Mobile Responsive Modal */
    .modal-backdrop { 
      position: fixed; 
      inset: 0; 
      background: rgba(13, 10, 8, 0.92); 
      display: none; 
      align-items: center; 
      justify-content: center; 
      z-index: 9999; 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 12px;
    }
    .modal-backdrop.active { display: flex; }
    
    .modal-card { 
      width: 100%;
      max-width: 960px;
      background: rgba(25, 17, 13, 0.9);
      border: 1px solid rgba(245, 158, 11, 0.3);
      box-shadow: 0 0 50px rgba(245, 158, 11, 0.15), inset 0 0 20px rgba(217, 119, 6, 0.1);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 96vh;
    }
    
    .player-wrapper { 
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }

    .player-wrapper video, 
    .player-wrapper iframe { 
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    #topCloseBtn { 
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 50;
      background: rgba(24, 17, 14, 0.8);
      color: var(--primary);
      border: 1px solid rgba(217, 119, 6, 0.4);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }
    #topCloseBtn:hover {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 0 15px var(--primary);
    }

    .player-meta { 
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      background: linear-gradient(to bottom, rgba(41, 24, 17, 0.95), rgba(24, 17, 14, 0.95));
      border-top: 1px solid rgba(245, 158, 11, 0.15);
      overflow-y: auto;
    }

    .player-meta h3 { 
      margin: 0;
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      color: #ffffff;
      font-weight: 800;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }
    .player-meta p { 
      margin: 4px 0 0 0;
      color: #d1d5db;
      font-size: 0.8rem;
      line-height: 1.4;
    }

    .controls-row { 
      display: grid;
      grid-template-cols: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    .btn {
      background: rgba(24, 17, 14, 0.6);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--accent);
      padding: 8px 4px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      text-align: center;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    
    .btn i {
      font-size: 0.8rem;
    }

    .btn:hover { 
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
    }

    @media (min-width: 640px) {
      .controls-row {
        grid-template-cols: repeat(6, 1fr);
      }
      .btn {
        padding: 10px 12px;
        font-size: 0.8rem;
        gap: 6px;
      }
      .player-meta h3 { 
        font-size: 1.25rem;
      }
      .player-meta p { 
        font-size: 0.875rem;
      }
    }

    @media (min-width: 850px) {
      .player-meta {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
      }
      .player-meta .meta-left {
        max-width: 45%;
      }
      .controls-row {
        display: flex;
        flex-wrap: nowrap;
        justify-content: flex-end;
        width: auto;
        gap: 8px;
      }
      .btn {
        flex: unset;
        min-width: 85px;
        padding: 10px 14px;
      }
    }

    @keyframes NodeFloat {
      0% { transform: translateY(0) translateX(0) scale(1); opacity: 0.1; }
      50% { transform: translateY(-40px) translateX(20px) scale(1.4); opacity: 0.3; }
      100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.1; }
    }
    .network-node {
      position: absolute;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.3) 0%, rgba(217, 119, 6, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }
</style>
</head>
<body class="relative">

<div class="fixed inset-0 overflow-hidden -z-10" id="ambient-bg">
  <div class="absolute inset-0 bg-gradient-to-b from-transparent via-[#18110e]/80 to-[#0d0a08]"></div>
</div>

<div class="container mx-auto px-4 py-6 max-w-7xl">

  <!-- Header Banner with User Provided Image URL & Top-Left Logo -->
  <div class="relative w-full h-[220px] sm:h-[300px] md:h-[440px] overflow-hidden rounded-2xl border border-amber-500/30 shadow-[0_0_40px_rgba(0,0,0,0.8)] mb-8 bg-black/50">
    <img 
      src="https://images.loksattaimg.com/2022/06/sharad-ponkshe-me-nathuram-godse-boltoy.jpeg" 
      alt="Mi Nathuram Godse Boltoy Banner" 
      class="absolute top-0 left-0 w-full h-full object-cover scale-105 opacity-60">
    
    <div class="absolute inset-0 bg-gradient-to-t from-[#18110e] via-black/40 to-transparent"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-[#18110e]/95 via-transparent to-transparent"></div>

    <!-- Top-Left Logo Container -->
    <div class="absolute top-4 left-4 z-30 flex items-center gap-3">
      <img
        src="https://images.indianexpress.com/2021/11/nathuram-godse.jpg?w=640"
        alt="Logo"
        class="h-10 sm:h-14 md:h-18 rounded-full object-cover
               border-2 border-amber-400 p-0.5
               bg-black/60 backdrop-blur-md
               shadow-[0_0_8px_rgba(245,158,11,0.8),0_0_20px_rgba(245,158,11,0.6),0_0_35px_rgba(245,158,11,0.35)]
               animate-[glow_2s_ease-in-out_infinite_alternate]"
      />
    </div>

    <style>
      @keyframes glow {
        from {
          box-shadow:
            0 0 6px rgba(245, 158, 11, 0.5),
            0 0 14px rgba(245, 158, 11, 0.4),
            0 0 22px rgba(245, 158, 11, 0.2);
        }
        to {
          box-shadow:
            0 0 10px rgba(245, 158, 11, 1),
            0 0 25px rgba(245, 158, 11, 0.8),
            0 0 45px rgba(245, 158, 11, 0.5);
        }
      }
    </style>

    <!-- Banner Details -->
    <div class="absolute bottom-0 left-0 p-4 sm:p-6 md:p-10 z-20 max-w-2xl">
      <h1 class="natak-heading holo-glow-text text-3xl sm:text-5xl md:text-6xl font-black uppercase mb-1 sm:mb-2 tracking-tighter leading-none text-white">
      </h1>
      <p class="text-gray-300 text-xs sm:text-sm md:text-base line-clamp-2 sm:line-clamp-3 font-light">
        Explore the profound historical Marathi theatrical masterpiece. Featuring legendary performances by Sharad Ponkshe (Part 1 and 2) alongside Krunal Limaye and Sanjay Belosey.
      </p>
    </div>
  </div>

  <div class="flex items-center gap-4 mb-8">
    <div class="h-px bg-gradient-to-r from-amber-500/50 to-transparent flex-1"></div>
    <h2 class="natak-heading text-amber-400 font-bold text-xs sm:text-sm md:text-lg uppercase tracking-widest flex items-center gap-2">
      <i class="fas fa-theater-masks text-amber-500"></i> Performance Index
    </h2>
    <div class="h-px bg-gradient-to-l from-amber-500/50 to-transparent flex-1"></div>
  </div>

  <!-- Restored Original Multi-Column Grid Layout for Mobile & Desktop -->
  <div class="mb-12">
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 sm:gap-5" id="movies"></div>
  </div>

  <div class="border-t border-slate-900/60 mt-12 pt-6 pb-2 text-center">
    <div class="flex justify-center gap-5 mb-4">
      <a href="#" class="text-slate-500 hover:text-amber-500 text-base transition-colors"><i class="fab fa-facebook-f"></i></a>
      <a href="#" class="text-slate-500 hover:text-amber-400 text-base transition-colors"><i class="fab fa-twitter"></i></a>
      <a href="#" class="text-slate-500 hover:text-amber-500 text-base transition-colors"><i class="fab fa-instagram"></i></a>
      <a href="#" class="text-slate-500 hover:text-amber-400 text-base transition-colors"><i class="fab fa-youtube"></i></a>
    </div>
    <p class="text-[9px] sm:text-[10px] text-slate-500 tracking-widest uppercase font-semibold">
      &copy; 2026 Nathuram Godse Natak Archives. All Rights Reserved.
    </p>
  </div>
</div>

<div id="playbackModal" class="modal-backdrop" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="player-wrapper" id="playerWrapper">
      <video id="modalVideo" controls playsinline style="width:100%;height:100%;background:#000"></video>
      <button id="topCloseBtn" aria-label="Dismiss Player">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="player-meta">
      <div class="meta-left mb-1 md:mb-0">
        <h3 id="modalTitle" class="natak-heading text-white">Natak Title</h3>
        <p id="modalDesc" class="line-clamp-2 sm:line-clamp-none"></p>
      </div>
      <div class="controls-row">
        <button id="prevBtn" class="btn"><i class="fas fa-backward"></i><span>Prev</span></button>
        <button id="playPauseBtn" class="btn"><i class="fas fa-play"></i><span>Play</span></button>
        <button id="nextBtn" class="btn"><i class="fas fa-forward"></i><span>Next</span></button>
        <button id="fullscreenBtn" class="btn"><i class="fas fa-expand"></i><span>FS</span></button>
        <button id="muteBtn" class="btn"><i class="fas fa-volume-up"></i><span>Mute</span></button>
        <button id="closeBtn" class="btn !border-amber-500/40 !text-amber-400 hover:!bg-amber-500/20 hover:!text-white"><i class="fas fa-times"></i><span>Close</span></button>
      </div>
    </div>
  </div>
</div>

<script>
    const movies = [
      { 
        title: "नथुराम गोडसे  -  (Part 1)", 
        video: "https://mega.nz/embed/dyphHJSZ#JFQSQLh0nKcwLMU_CpgJz2BHZvHbkWwzrFFvJrbKm_E", 
        image: "https://i.ytimg.com/vi/32GSAOUK67Y/maxresdefault.jpg", 
        category: "Sharad Ponkshe", 
        year: 2026,
        description: "Part 1 of the powerful Marathi stage performance featuring Sharad Ponkshe as Nathuram Godse, detailing the historical perspectives and courtroom declarations."
      },
      { 
        title: "नथुराम गोडसे  - (Part 2)", 
        video: "https://mega.nz/embed/giwiXBbJ#5pyF3RinW-qTtyr3Wjyfc_Z5pC2jozVictZ3RtfIS1U", 
        image: "https://i.ytimg.com/vi/eeanuZiquds/maxresdefault.jpg", 
        category: "Sharad Ponkshe", 
        year: 2026,
        description: "Part 2 continuing the gripping dramatic enactment of Nathuram Godse's viewpoints by veteran actor Sharad Ponkshe."
      },
      { 
        title: "मी नथुराम गोडसे बोलतोय - Krunal Limaye & Sanjay Belosey", 
        video: "https://mega.nz/embed/QqpDVQjD#woQc0msa-8UcKWVyYVf-L0vmXvwVQ5ZNYPcZjbBlvXk", 
        image: "https://i.ytimg.com/vi/Wew_hkqWUg0/maxresdefault.jpg", 
        category: "Krunal Limaye", 
        year: 2026,
        description: "An alternate stellar theatrical presentation of 'Mi Nathuram Godse Boltoy' starring Krunal Limaye and Sanjay Belosey."
      }
    ];

    const playbackModal = document.getElementById('playbackModal');
    const playerWrapper = document.getElementById('playerWrapper');
    const modalVideoId = 'modalVideo';
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const muteBtn = document.getElementById('muteBtn');

    let currentHls = null;
    let currentFiltered = [];
    let currentIndex = null;

    function isMP4(url) { return /\.mp4($|\?)/i.test((url||'')); }
    function isHls(url) {
      if (!url) return false;
      return url.includes('.m3u8') || url.includes('index-') || /index.*\.txt/i.test(url) || url.includes('manifest') || url.includes('master');
    }
    function isYouTube(url) {
      if (!url) return false;
      return url.includes('youtube.com') || url.includes('youtu.be') || url.includes('youtube-nocookie.com') || url.includes('/embed/');
    }

    function resetPlayerContainer() {
      if (currentHls) {
        try { currentHls.destroy(); } catch(e) {}
        currentHls = null;
      }
      playerWrapper.innerHTML = `<video id="${modalVideoId}" controls playsinline style="width:100%;height:100%;background:#000"></video>
      <button id="topCloseBtn" aria-label="Dismiss Player"><i class="fas fa-times"></i></button>`;
      document.getElementById('topCloseBtn').addEventListener('click', closeModalHandler);
    }

    function showModal() {
      playbackModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function hideModal() {
      playbackModal.classList.remove('active');
      document.body.style.overflow = '';
    }

    function openPlayer(list, index) {
      if (!Array.isArray(list) || list.length === 0 || index == null || index < 0 || index >= list.length) return;
      
      currentFiltered = list;
      currentIndex = index;
      const movie = list[index];
      if (!movie) return;

      modalTitle.textContent = movie.title || '';
      modalDesc.textContent = movie.description || '';

      resetPlayerContainer();
      showModal();

      let src = '';
      if (typeof movie.video === 'object' && movie.video !== null) {
        src = movie.video.high || movie.video.medium || movie.video.low || Object.values(movie.video)[0];
      } else {
        src = movie.video;
      }

      if (!src || src === '00') {
        playerWrapper.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-center p-6 bg-stone-950 text-amber-400">
          <i class="fas fa-film text-4xl mb-3 opacity-60"></i>
          <h4 class="font-bold text-lg mb-1">Source Asset Unavailable</h4>
          <p class="text-xs text-gray-400 max-w-md">This performance video link is currently designated as "00" or pending update.</p>
        </div>
        <button id="topCloseBtn" aria-label="Dismiss Player"><i class="fas fa-times"></i></button>`;
        document.getElementById('topCloseBtn').addEventListener('click', closeModalHandler);
        playPauseBtn.innerHTML = '<i class="fas fa-play"></i><span>Play</span>';
        return;
      }

      const lc = src.toLowerCase();

      if (lc.includes('streamtape.com') || lc.includes('dood') || lc.includes('vidcdn') || lc.includes('ok.ru') || lc.includes('mega.nz') || lc.includes('openload') || lc.includes('drive.google.com')) {
        playerWrapper.innerHTML = `<iframe src="${src}" width="100%" height="100%" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        <button id="topCloseBtn" aria-label="Dismiss Player"><i class="fas fa-times"></i></button>`;
        document.getElementById('topCloseBtn').addEventListener('click', closeModalHandler);
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        return;
      }

      if (isYouTube(src)) {
        let embed = src;
        try {
          if (src.includes('watch') && src.includes('v=')) {
            const v = new URLSearchParams(src.split('?')[1]).get('v');
            if (v) embed = `https://www.youtube.com/embed/${v}`;
          } else if (src.includes('youtu.be/')) {
            const p = src.split('youtu.be/')[1].split(/[?&]/)[0];
            if (p) embed = `https://www.youtube.com/embed/${p}`;
          }
        } catch (e) {}
        playerWrapper.innerHTML = `<iframe src="${embed}?autoplay=1&modestbranding=1&rel=0" width="100%" height="100%" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        <button id="topCloseBtn" aria-label="Dismiss Player"><i class="fas fa-times"></i></button>`;
        document.getElementById('topCloseBtn').addEventListener('click', closeModalHandler);
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        return;
      }

      if (isHls(src)) {
        const v = document.getElementById(modalVideoId);
        if (!v) return;
        if (window.Hls && Hls.isSupported()) {
          currentHls = new Hls();
          currentHls.loadSource(src);
          currentHls.attachMedia(v);
          currentHls.on(Hls.Events.MANIFEST_PARSED, function() {
            v.play().catch(()=>{});
            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
          });
          currentHls.on(Hls.Events.ERROR, function(event, data) {
            if (data && data.fatal) {
              try { currentHls.destroy(); } catch(e){}
              currentHls = null;
            }
          });
        } else if (v.canPlayType && v.canPlayType('application/vnd.apple.mpegurl')) {
          v.src = src;
          v.play().catch(()=>{});
          playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        }
        return;
      }

      if (isMP4(src)) {
        const v = document.getElementById(modalVideoId);
        if (!v) return;
        v.src = src;
        v.play().catch(()=>{});
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        return;
      }
    }

    function togglePlayPause() {
      const v = document.getElementById(modalVideoId);
      if (!v) return;
      if (v.paused) {
        v.play().catch(()=>{});
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
      } else {
        v.pause();
        playPauseBtn.innerHTML = '<i class="fas fa-play"></i><span>Play</span>';
      }
    }
    function playNext() {
      if (!currentFiltered || currentFiltered.length === 0) currentFiltered = movies.slice();
      if (currentIndex == null) return;
      if (currentIndex < currentFiltered.length - 1) openPlayer(currentFiltered, currentIndex + 1);
    }
    function playPrev() {
      if (!currentFiltered || currentFiltered.length === 0) currentFiltered = movies.slice();
      if (currentIndex == null) return;
      if (currentIndex > 0) openPlayer(currentFiltered, currentIndex - 1);
    }
    function toggleFullscreen() {
      const el = document.getElementById(modalVideoId) || playerWrapper.querySelector('iframe');
      if (!el) return;
      if (!document.fullscreenElement) {
        (el.requestFullscreen || playerWrapper.requestFullscreen).call(el).catch(()=>{});
      } else {
        document.exitFullscreen();
      }
    }
    function toggleMute() {
      const v = document.getElementById(modalVideoId);
      if (!v) return;
      v.muted = !v.muted;
      muteBtn.innerHTML = v.muted ? '<i class="fas fa-volume-mute"></i><span>Unmute</span>' : '<i class="fas fa-volume-up"></i><span>Mute</span>';
    }

    function closeModalHandler() {
      if (currentHls) {
        try { currentHls.destroy(); } catch(e) {}
        currentHls = null;
      }
      const v = document.getElementById(modalVideoId);
      if (v) {
        try { v.pause(); } catch(e){}
        try { v.removeAttribute('src'); v.load(); } catch(e){}
      }
      resetPlayerContainer();
      hideModal();
      currentIndex = null;
      currentFiltered = [];
      playPauseBtn.innerHTML = '<i class="fas fa-play"></i><span>Play</span>';
    }

    playPauseBtn.addEventListener('click', togglePlayPause);
    nextBtn.addEventListener('click', playNext);
    prevBtn.addEventListener('click', playPrev);
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    muteBtn.addEventListener('click', toggleMute);
    document.getElementById('closeBtn').addEventListener('click', closeModalHandler);

    playbackModal.addEventListener('click', function(e){
      if (e.target === playbackModal) closeModalHandler();
    });

    document.addEventListener('keydown', (e) => {
      if (!playbackModal.classList.contains('active')) return;
      switch (e.key.toLowerCase()) {
        case 'escape': closeModalHandler(); break;
        case ' ': e.preventDefault(); togglePlayPause(); break;
        case 'arrowright': { const v = document.getElementById(modalVideoId); if (v) v.currentTime = Math.min(v.duration, v.currentTime + 10); break; }
        case 'arrowleft': { const v = document.getElementById(modalVideoId); if (v) v.currentTime = Math.max(0, v.currentTime - 10); break; }
        case 'f': toggleFullscreen(); break;
        case 'm': toggleMute(); break;
      }
    });

    const container = document.getElementById('movies');

    function renderMovies(moviesToRender) {
      container.innerHTML = '';
      moviesToRender.forEach((movie, index) => {
        const delayClass = `delay-${(index % 5) * 100}`;

        const div = document.createElement('div');
        div.className = `movie-card animate-fade-in ${delayClass} rounded-xl overflow-hidden cursor-pointer relative group`;
        div.innerHTML = `
          <div class="relative overflow-hidden aspect-[2/3]">
            <img src="${movie.image}" alt="${movie.title}" class="w-full h-full object-cover movie-poster">
            <div class="absolute inset-0 bg-gradient-to-t from-[#18110e] via-[#18110e]/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end justify-center p-3">
              <button class="bg-amber-500 hover:bg-amber-400 text-black font-bold py-2 px-4 rounded-full transition transform hover:scale-105 shadow-lg flex items-center gap-2 text-xs uppercase tracking-wider">
                <i class="fas fa-play"></i> Watch
              </button>
            </div>
          </div>
          <div class="p-3 bg-gradient-to-b from-transparent to-black/40">
            <h3 class="font-bold text-slate-200 group-hover:text-amber-400 transition-colors text-xs sm:text-sm truncate natak-heading">${movie.title}</h3>
            <div class="flex justify-between items-center mt-2 text-[10px] font-semibold">
              <span class="bg-amber-950/60 text-amber-400 px-2.5 py-1 rounded border border-amber-800/30 truncate max-w-[110px]" title="${movie.category}">${movie.category}</span>
              <span class="uppercase tracking-widest text-[9px] text-amber-500"><i class="fas fa-star mr-1"></i>Natak</span>
            </div>
          </div>
        `;

        div.addEventListener('click', () => {
          openPlayer(moviesToRender, index);
        });

        container.appendChild(div);
      });
    }

    renderMovies(movies);

    function createNodes() {
      const ambientContainer = document.getElementById('ambient-bg');
      if (!ambientContainer) return;
      
      for (let i = 0; i < 15; i++) {
        const node = document.createElement('div');
        node.className = 'network-node';
        const size = Math.random() * 5 + 2;
        node.style.width = `${size}px`;
        node.style.height = `${size}px`;
        node.style.left = `${Math.random() * 100}%`;
        node.style.top = `${Math.random() * 100}%`;
        
        const duration = Math.random() * 8 + 6;
        node.style.animation = `NodeFloat ${duration}s infinite ease-in-out alternate`;
        node.style.animationDelay = `${Math.random() * 3}s`;
        
        ambientContainer.appendChild(node);
      }
    }
    createNodes();
</script>

<script src="https://cdn.jsdelivr.net/npm/disable-devtool@latest"></script>
<script>
const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);

DisableDevtool({
    disable: true,
    disableMenu: true,
    clearLog: true,
    disableSelect: true,
    disableCopy: true,
    disableCut: true,
    disablePaste: true,
    disableMobile: false,
    interval: 100,
    ondevtoolopen: function () {
        if (!isMobile) {
            document.body.innerHTML = "";
            window.location.replace("about:blank");
        }
    }
});

document.addEventListener("keydown", function (e) {
    if (e.key === "F12") { e.preventDefault(); return false; }
    if (e.ctrlKey && e.key.toLowerCase() === "u") { e.preventDefault(); e.stopPropagation(); return false; }
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "i") { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "j") { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "c") { e.preventDefault(); return false; }
    if (e.ctrlKey && e.key.toLowerCase() === "s") { e.preventDefault(); return false; }
    if (e.ctrlKey && e.key.toLowerCase() === "p") { e.preventDefault(); return false; }
    if (e.ctrlKey && e.key.toLowerCase() === "a") { e.preventDefault(); return false; }
    if (e.ctrlKey && e.key.toLowerCase() === "c") { e.preventDefault(); return false; }
    if (e.ctrlKey && e.key.toLowerCase() === "x") { e.preventDefault(); return false; }
    if (e.ctrlKey && e.key.toLowerCase() === "v") { e.preventDefault(); return false; }
});

document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
document.addEventListener("dragstart", function (e) { e.preventDefault(); });
document.addEventListener("selectstart", function (e) { e.preventDefault(); });
["copy", "cut", "paste"].forEach(function(evt) {
    document.addEventListener(evt, function(e) { e.preventDefault(); });
});

if (!isMobile) {
    setInterval(function () {
        const widthThreshold = window.outerWidth - window.innerWidth > 220;
        const heightThreshold = window.outerHeight - window.innerHeight > 220;
        if (widthThreshold || heightThreshold) {
            document.body.innerHTML = "";
            window.location.replace("about:blank");
        }
    }, 1500);
}

(function () {
    console.clear();
    function block() { return false; }
    console.log = block; console.warn = block; console.error = block;
    console.info = block; console.debug = block; console.table = block;
})();

if (window.location.href.startsWith("view-source:")) {
    document.body.innerHTML = "";
    window.location.replace("about:blank");
}
if (window.top !== window.self) {
    try { window.top.location = window.self.location; } catch (e) {}
}
</script>
