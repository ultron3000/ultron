
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>जकेरियाचा विघ्नहर्ता</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Yatra+One&family=Poppins:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #800c1b 0%, #380209 100%);
            min-height: 100vh;
        }

        /* Premium Golden Festive Border Style */
        .premium-card {
            background: linear-gradient(145deg, rgba(40, 3, 7, 0.85) 0%, rgba(20, 1, 3, 0.95) 100%);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        0 0 40px rgba(212, 163, 89, 0.15);
        }

        /* Traditional Ornamental Frame Accents */
        .corner-accent {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 2px solid #d4a359;
            opacity: 0.6;
        }
        .top-left     { top: 12px; left: 12px; border-right: 0; border-bottom: 0; }
        .top-right    { top: 12px; right: 12px; border-left: 0; border-bottom: 0; }
        .bottom-left  { bottom: 12px; left: 12px; border-right: 0; border-top: 0; }
        .bottom-right { bottom: 12px; right: 12px; border-left: 0; border-top: 0; }

        /* Elegant Typography */
        .marathi-title {
            font-family: 'Yatra One', serif;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5), 0 0 20px rgba(245, 158, 11, 0.3);
        }

        /* Floating Shadow Effect for Logo */
        .logo-frame {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(212, 163, 89, 0.3);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6">

    <!-- Container -->
    <div class="w-full max-w-md premium-card rounded-3xl p-6 sm:p-8 overflow-hidden relative border border-amber-500/30 my-auto">
        
        <!-- Frame Corner Details -->
        <div class="corner-accent top-left"></div>
        <div class="corner-accent top-right"></div>
        <div class="corner-accent bottom-left"></div>
        <div class="corner-accent bottom-right"></div>

        <!-- Decorative Subtle Background Mandala Overlay -->
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(212,163,89,0.04)_0%,transparent_70%)] pointer-events-none"></div>

        <!-- Header Content / Logo Presentation -->
        <div class="text-center pt-4 pb-6 relative z-10">
            <!-- Custom Logo Embedded elegantly in a traditional layout -->
            <div class="flex justify-center mb-5">
                <div class="bg-gradient-to-b from-amber-300 via-amber-500 to-yellow-600 p-[2px] rounded-full logo-frame shadow-2xl">
                    <div class="bg-[#1f0205] p-1.5 rounded-full">
                        <img src="https://ultron3000.github.io/jakeriachavighnaharta/assets/logo.jpeg" 
                             alt="जकेरियाचा विघ्नहर्ता Logo" 
                             class="w-24 h-24 rounded-full object-cover">
                    </div>
                </div>
            </div>
            
            <!-- Upgraded Traditional Marathi Calligraphy Style Typography -->
            <h1 class="marathi-title text-3xl sm:text-4xl font-normal text-transparent bg-clip-text bg-gradient-to-b from-amber-200 via-amber-400 to-yellow-600 tracking-wider">
                जकेरियाचा विघ्नहर्ता
            </h1>
            <div class="flex items-center justify-center space-x-2 mt-2">
                <span class="h-[1px] w-6 bg-gradient-to-r from-transparent to-amber-500/60"></span>
                <p class="text-[10px] text-amber-400/80 uppercase tracking-[0.2em] font-medium">|| स्थापना १९६४ ||</p>
                <span class="h-[1px] w-6 bg-gradient-to-l from-transparent to-amber-500/60"></span>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="relative z-10">
            
            <!-- QR Code Frame Display with Dual Metallic Gradient Border -->
            <div class="bg-gradient-to-br from-amber-300 via-yellow-500 to-amber-600 p-[3px] rounded-2xl shadow-2xl max-w-[260px] mx-auto mb-4">
                <div class="bg-white p-3.5 rounded-[13px]">
                    <img id="qrImage" src="https://ultron3000.github.io/jakeriachavighnaharta/assets/UPI_New_Logo.png" alt="UPI QR Code" class="w-full h-auto rounded-md">
                </div>
            </div>

            <!-- Download Button Element -->
            <div class="flex justify-center mb-6">
                <button onclick="downloadQR()" class="inline-flex items-center space-x-2 text-xs font-semibold text-amber-300/90 hover:text-amber-200 transition-colors bg-amber-500/5 hover:bg-amber-500/10 px-5 py-2.5 rounded-full border border-amber-500/30 shadow-sm backdrop-blur-sm">
                    <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span>Download QR Image</span>
                </button>
            </div>

            <!-- UPI Details Information Block -->
            <div class="bg-black/40 rounded-xl p-3 border border-amber-500/10 text-center mb-6">
                <p class="text-[10px] text-amber-500/60 uppercase tracking-widest mb-1 font-semibold">Official UPI ID</p>
                <a href="upi://pay?pa=qr919820689840-6263@unionbankofindia&pn=जकेरियाचा विघ्नहर्ता&mc=0000&tid=TXNID123&cu=INR" 
                   class="text-amber-200 font-medium text-xs sm:text-sm hover:underline break-all transition-colors block px-2 tracking-wide font-mono">
                    qr919820689840-6263@unionbankofindia
                </a>
            </div>

            <!-- Modern Form Inputs & Actions -->
            <div class="space-y-4">
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-amber-400 font-medium text-lg">₹</span>
                    <input type="number" id="amountInput" placeholder="Enter custom amount" 
                           class="w-full bg-black/30 border border-amber-500/20 rounded-xl pl-9 pr-4 py-3.5 text-white placeholder-amber-900/40 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all text-base">
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <button onclick="payNowFixed()" class="w-full bg-gradient-to-r from-amber-400 via-amber-500 to-yellow-600 hover:from-amber-500 hover:to-yellow-700 text-stone-950 font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-200 text-sm transform active:scale-[0.99]">
                        Pay Minimum
                    </button>
                    <button onclick="payNowAmount()" class="w-full bg-transparent hover:bg-amber-500/5 text-amber-400 hover:text-amber-300 font-semibold py-3.5 px-4 rounded-xl border border-amber-500/40 hover:border-amber-400/60 transition duration-200 text-sm transform active:scale-[0.99]">
                        Pay Custom Amount
                    </button>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Handlers Logic Script -->
    <script>
        const upiId = "qr919820689840-6263@unionbankofindia";
        const merchantName = "जकेरियाचा विघ्नहर्ता";
        const donationMessage = "Donation to जकेरियाचा विघ्नहर्ता";

        function payNowFixed() {
            const uri = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(merchantName)}&mc=0000&tid=TXN0001&cu=INR&tn=${encodeURIComponent(donationMessage)}`;
            window.location.href = uri;
        }

        function payNowAmount() {
            const amount = document.getElementById('amountInput').value;
            if (!amount || amount <= 0) {
                alert("Please enter a valid amount to proceed.");
                return;
            }
            const uri = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(merchantName)}&mc=0000&tid=TXN0002&am=${amount}&cu=INR&tn=${encodeURIComponent(donationMessage)}`;
            window.location.href = uri;
        }

        function downloadQR() {
            const qrImageUrl = document.getElementById('qrImage').src;
            
            fetch(qrImageUrl)
                .then(response => response.blob())
                .then(blob => {
                    const blobURL = URL.createObjectURL(blob);
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.href = blobURL;
                    downloadAnchor.download = 'Zakeriacha_Vighnaharta_UPI_QR.png';
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    document.body.removeChild(downloadAnchor);
                    URL.revokeObjectURL(blobURL);
                })
                .catch(() => {
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.href = qrImageUrl;
                    downloadAnchor.target = '_blank';
                    downloadAnchor.download = 'Zakeriacha_Vighnaharta_UPI_QR.png';
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    document.body.removeChild(downloadAnchor);
                });
        }
    </script>
</body>
</html>
