<!DOCTYPE html>
<html lang="en">
<head>
<!-- No artificial page-hide gate: render the document as soon as its HTML and critical CSS are available. -->
  <meta charset="utf-8" />
  <title>Hindi Movies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <!-- hls.js for playing .m3u8 in browsers that support MediaSource -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js" defer></script>

  <style>

    
    :root {
      --primary: #ffcc00;
      --secondary: #111827;
      --accent: #f59e0b;
      --muted: #9CA3AF;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    .movie-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    
    .movie-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    
    .search-input {
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    .search-input:focus {
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.5);
    }
    
    .header-glow {
      text-shadow: 0 0 10px rgba(255, 204, 0, 0.7);
    }
    
    .movie-poster {
      aspect-ratio: 2/3;
      transition: transform 0.5s ease;
    }
    
    .movie-card:hover .movie-poster {
      transform: scale(1.05);
    }
    
    .category-tab {
      transition: all 0.3s ease;
    }
    
    .category-tab:hover {
      transform: translateY(-2px);
    }
    
    .category-tab.active {
      background-color: var(--primary);
      color: var(--secondary);
      font-weight: 600;
    }
    
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #ffcc00;
      border-radius: 10px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #f59e0b;
    }
    
    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-fade-in {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    
    .delay-100 { animation-delay: 0.1s; }
    .delay-200 { animation-delay: 0.2s; }
    .delay-300 { animation-delay: 0.3s; }
    .delay-400 { animation-delay: 0.4s; }
    
    /* Illumination modal styles (responsive) */
    .modal-backdrop { 
      position:fixed; 
      inset:0; 
      background: rgba(0,0,0,0.9); 
      display:none; 
      align-items:center; 
      justify-content:center; 
      z-index:9999; 
      padding: 0;
    }
    .modal-backdrop.active { display:flex; }
    .modal-card { 
      width: 100%;
      height: 100%;
      max-width: 980px;
      max-height: 90vh;
      border-radius: 0;
      overflow: hidden;
      background: #0b1220;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
    }
    .player-wrapper { 
      position: relative;
      flex: 1;
      min-height: 0;
      background: #000;
    }
    #topCloseBtn { 
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: all 0.2s ease;
    }
    #topCloseBtn:hover {
      background: rgba(0,0,0,0.9);
      transform: scale(1.1);
    }
    .player-wrapper video, 
    .player-wrapper iframe { 
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .player-meta { 
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      color: #ddd;
      background: #0b1220;
    }
    .player-meta .meta-left { 
      width: 100%;
    }
    .player-meta h3 { 
      margin: 0;
      font-size: 1.125rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-meta p { 
      margin: 6px 0 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .controls-row { 
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      min-width: 60px;
      flex: 1;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { 
      background: rgba(254,209,65,0.06); 
    }
    .btn i {
      font-size: 1rem;
    }

    /* Responsive adjustments */
    @media (min-width: 768px) {
      .modal-card {
        width: 92%;
        height: auto;
        border-radius: 12px;
        max-height: 80vh;
      }
      .player-wrapper {
        padding-bottom: 56.25%;
        height: 0;
      }
      .player-meta {
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
      }
      .player-meta .meta-left {
        max-width: 65%;
      }
      .controls-row {
        flex-wrap: nowrap;
        justify-content: flex-end;
      }
      .btn {
        flex: 0;
        min-width: auto;
        padding: 8px 12px;
      }
      #topCloseBtn {
        opacity: 0;
      }
      .player-wrapper:hover #topCloseBtn {
        opacity: 1;
      }
    }

    @media (max-width: 480px) {
      .btn {
        padding: 8px;
        font-size: 0;
      }
      .btn i {
        font-size: 1rem;
        margin: 0 !important;
      }
    }

    

    /* Modal legacy styles (unused) */
    .modal-overlay { display:none; }
    /* ============================
   DESKTOP FIX — DOES NOT TOUCH MOBILE
   ============================ */

@media (min-width: 768px) {

  /* Fix video height so it doesn't cover controls */
  .player-wrapper {
    padding-bottom: 0 !important;     /* remove forced 16:9 only on desktop */
    height: auto !important;
    max-height: 60vh !important;       /* safe video height */
    position: relative !important;
  }

  /* Ensure iframe/video stays inside wrapper */
  .player-wrapper video,
  .player-wrapper iframe {
    height: 100% !important;
    max-height: 60vh !important;
    position: relative !important;
  }

  /* Make sure controls are ALWAYS visible above video */
  .player-meta {
    position: relative !important;
    z-index: 100 !important;
    background: #0b1220 !important;      /* solid background for visibility */
    padding-top: 10px !important;
  }

  /* Controls row layout */
  .controls-row {
    display: flex !important;
    flex-wrap: wrap !important;
    justify-content: center !important;
    gap: 12px !important;
  }

  /* Buttons behave normally */
  .btn {
    min-width: 95px !important;
    padding: 10px 16px !important;
    flex: unset !important;
  }

  /* Modal height adjustment to fit everything */
  .modal-card {
    max-height: 85vh !important;
    overflow: visible !important;
  }
}

/* ===== GRID VIEW TOGGLE ===== */

/* Compact grid */
.compact-grid {
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important;
  gap: 14px !important;
}

/* List view */
.list-grid {
  grid-template-columns: 1fr !important;
}

.list-grid .movie-card {
  display: flex;
  gap: 16px;
  align-items: center;
}

.list-grid .movie-poster {
  width: 120px;
  aspect-ratio: 2/3;
  flex-shrink: 0;
}

/* ===== FORCE COMPACT VIEW ON MOBILE ===== */
@media (max-width: 640px) {

  /* Override Tailwind grid-cols-2 */
  #movies.compact-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    gap: 10px !important;
  }

  #movies.compact-grid .movie-card {
    transform: none !important;
  }

  #movies.compact-grid .movie-poster {
    aspect-ratio: 2 / 3;
  }
}




  /* === SMART FULLSCREEN VIDEO FIX (NO CROPPING, NO GAPS WHEN POSSIBLE) === */
video:fullscreen,
video:-webkit-full-screen,
iframe:fullscreen,
iframe:-webkit-full-screen {
  width: 100vw !important;
  height: 100vh !important;
  max-width: 100vw !important;
  max-height: 100vh !important;

  object-fit: contain !important;
  background-color: black;
}

/* Only cover when video aspect is cinematic */
@media (min-aspect-ratio: 16/9) {
  video:fullscreen,
  video:-webkit-full-screen,
  iframe:fullscreen,
  iframe:-webkit-full-screen {
    object-fit: cover !important;
  }
}

<!-- Floating stars background -->
<div class="fixed inset-0 overflow-hidden -z-10">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-black/80"></div>
<div class="stars"></div>
<div class="stars2"></div>
</div>
<div class="container mx-auto px-4 py-8 max-w-7xl">

<!-- Cloud TV brand header; search and display tools live above the catalogue -->
<header class="hm-site-header hm-header-controls">
 <a class="hm-header-brand" href="index.html" aria-label="Cloud TV home">
  <span class="hm-brand-logo-wrap"><img src="https://static.readdy.ai/image/0ece273271e400e488b9947cb1e99e9a/a79b6f32c71c4ee2094ead0eb9c84c9b.png" alt="Cloud TV Logo" class="hm-brand-logo" width="32" height="32" loading="eager" decoding="async" fetchpriority="high"></span>
 </a>
 <section class="hm-catalogue-tools" aria-label="Movie search and display controls">

/* Featured carousel reads existing movie data and opens the original player */
let hmIndex=0,hmOrder=[],hmPos=0,hmTimer=null,hmTouchX=null,hmImageToken=0;
function hmShuffle(except){const a=movies.map((_,i)=>i).filter(i=>i!==except);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hmShow(i){
  if(!movies.length)return;
  hmIndex=(i+movies.length)%movies.length;
  const m=movies[hmIndex];
  const poster=document.getElementById('hmHeroPoster');
  const bg=document.getElementById('hmHeroBg');
  const imageUrl=m.image||'';
  const imageToken=++hmImageToken;
  poster.alt=(m.title||'Hindi movie')+' poster';
  document.getElementById('hmHeroTitle').textContent=m.title||'Hindi Cinema';
  document.getElementById('hmHeroDescription').textContent=m.description||'Discover '+(m.title||'this film')+' from the Hindi movie collection.';
  const meta=document.getElementById('hmHeroMeta');
  meta.textContent=[m.year,m.category||'Hindi'].filter(Boolean).join(' · ');
  document.getElementById('hmHeroCount').textContent=(hmIndex+1)+' / '+movies.length;
  document.querySelectorAll('#hmHeroDots button').forEach((b,n)=>b.classList.toggle('active',n===hmIndex%5));
  if(!imageUrl){poster.removeAttribute('src');bg.style.backgroundImage='none';return;}
  const preloader=new Image();
  preloader.decoding='async';
  preloader.src=imageUrl;
  const applyImage=()=>{
    if(imageToken!==hmImageToken)return;
    poster.src=imageUrl;
    bg.style.backgroundImage='url("'+String(imageUrl).replace(/["\\]/g,'')+'")';
  };
  if(typeof preloader.decode==='function'){
    preloader.decode().then(applyImage).catch(()=>{if(preloader.complete&&preloader.naturalWidth)applyImage();});
  }else{
    preloader.onload=applyImage;
  }
 }
function hmNext(){if(!hmOrder.length||hmPos>=hmOrder.length){hmOrder=hmShuffle(hmIndex);hmPos=0}hmShow(hmOrder[hmPos++])}
function hmStop(){if(hmTimer){clearInterval(hmTimer);hmTimer=null}}
function hmStart(){hmStop();if(!document.hidden&&movies.length>1)hmTimer=setInterval(hmNext,8500)}
function hmChoose(i){hmShow(i);hmOrder=hmShuffle(i);hmPos=0;hmStart()}
function initHindiHero(){
 const root=document.getElementById('hmHero');if(!root||!movies.length)return;
 const dots=document.getElementById('hmHeroDots');
 for(let i=0;i<Math.min(5,movies.length);i++){const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Featured movie '+(i+1));b.addEventListener('click',()=>hmChoose((hmIndex+i+1)%movies.length));dots.appendChild(b)}
 document.getElementById('hmHeroWatch').addEventListener('click',()=>openPlayer(movies,hmIndex));
 document.getElementById('hmHeroSurprise').addEventListener('click',()=>{hmNext();hmStart()});
 document.getElementById('hmHeroPrev').addEventListener('click',()=>hmChoose(hmIndex-1));
 document.getElementById('hmHeroNext').addEventListener('click',()=>{hmNext();hmStart()});
 root.addEventListener('touchstart',e=>{if(!e.target.closest('button,a'))hmTouchX=e.changedTouches[0].clientX},{passive:true});
 root.addEventListener('touchend',e=>{if(hmTouchX===null)return;const dx=e.changedTouches[0].clientX-hmTouchX;hmTouchX=null;if(Math.abs(dx)>45){if(dx<0){hmNext();hmStart()}else hmChoose(hmIndex-1)}},{passive:true});
 root.addEventListener('mouseenter',hmStop);root.addEventListener('mouseleave',hmStart);
 document.addEventListener('visibilitychange',()=>document.hidden?hmStop():hmStart());
 hmOrder=hmShuffle(-1);hmPos=0;hmShow(hmOrder[hmPos++]);hmStart();
}
