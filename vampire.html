<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vampire Cinematic Universe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- hls.js for HLS playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@500;600;700&family=Montserrat:wght@300;400;600;700&display=swap');
    
    :root {
      --primary: #dc2626;
      --primary-glow: rgba(220, 38, 38, 0.4);
      --crimson-dark: #800020;
      --dark-bg: #050203;
      --card-bg: rgba(18, 10, 12, 0.85);
      --light: #f8fafc;
      --accent: #f59e0b;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--dark-bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(128, 0, 32, 0.25) 0%, transparent 70%),
        radial-gradient(circle at 100% 100%, rgba(220, 38, 38, 0.08) 0%, transparent 50%),
        linear-gradient(to bottom, rgba(5, 2, 3, 0.9), rgba(5, 2, 3, 0.98));
      color: var(--light);
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    .title-font { font-family: 'Cinzel Decorative', cursive; }
    .font-rajdhani { font-family: 'Rajdhani', sans-serif; }

    /* Animated Blood Drop Elements */
    .blood-drop {
      position: absolute;
      width: 6px;
      height: 12px;
      background: linear-gradient(to bottom, #ef4444, #7f1d1d);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      opacity: 0.6;
      pointer-events: none;
      animation: drip 4s infinite ease-in;
    }

    @keyframes drip {
      0% { transform: translateY(-20px) scaleY(1); opacity: 0; }
      30% { opacity: 0.7; }
      80% { opacity: 0.8; transform: translateY(80vh) scaleY(1.5); }
      100% { opacity: 0; transform: translateY(90vh) scaleY(0.5); }
    }

    /* Movie Cards with Crimson Glow */
    .movie-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(220, 38, 38, 0.2);
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.9);
      background: var(--card-bg);
      backdrop-filter: blur(8px);
    }

    .movie-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--primary);
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.4);
    }

    .movie-poster {
      aspect-ratio: 2/3;
      transition: transform 0.5s ease;
    }

    .movie-card:hover .movie-poster {
      transform: scale(1.04);
    }

    /* Vampire Filters */
    .filter-btn {
      background: rgba(20, 10, 12, 0.8);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #94a3b8;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .filter-btn:hover {
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.4);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
      border-color: var(--primary);
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #050203; }
    ::-webkit-scrollbar-thumb { background: #7f1d1d; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #dc2626; }

    /* Hawkeye Modal Tweaks */
    .modal-overlay { 
      position: fixed; 
      inset: 0; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background: rgba(3, 0, 1, 0.92); 
      z-index: 9999; 
      opacity: 0; 
      visibility: hidden; 
      transition: all 0.25s ease; 
      backdrop-filter: blur(10px);
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-card { 
      width: 95%; 
      max-width: 980px; 
      border-radius: 12px; 
      overflow: hidden; 
      background: #0d0608; 
      border: 1px solid rgba(220, 38, 38, 0.35);
      box-shadow: 0 0 50px rgba(220, 38, 38, 0.25); 
    }
    .player-area { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
    .player-area video, .player-area iframe { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
    .progress-bar { height: 4px; background: rgba(255,255,255,0.08); position: relative; width: 100%; }
    .progress-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: var(--primary); transition: width .2s linear; }
    .controls { display: flex; gap: 8px; align-items: center; }
    .btn { background: rgba(220, 38, 38, 0.1); border: 1px solid var(--primary); color: #fff; padding: 8px 14px; border-radius: 6px; font-family: 'Rajdhani', sans-serif; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 12px rgba(220, 38, 38, 0.5); }
    .btn.primary { background: var(--primary); color: #fff; }
    .btn.primary:hover { background: #b91c1c; }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(220, 38, 38, 0.2);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

    /* --- DOM Refs --- */
    const moviesContainer = document.getElementById('movies');

    const clearSearch = document.getElementById('clearSearch');

    /* Modal & player refs */
    const playbackModal = document.getElementById('playback-modal');
    const closeModalBtn = document.getElementById('close-modal');
    const playerArea = document.getElementById('player-area');
    const progressFill = document.getElementById('progress-fill');
    const modalTitle = document.getElementById('modal-title');
    const modalSub = document.getElementById('modal-sub');
    const modalDesc = document.getElementById('modal-desc');

    const nextBtn = document.getElementById('nextBtn');

    const fullscreenBtn = document.getElementById('fullscreenBtn');

    let currentList = [];
    let currentIndex = null;
    let currentHls = null;
    let searchDebounceTimeout = null;

    /* Helper detection */
    function isHls(u){ return u && (u.includes('.m3u8') || u.includes('index-') || /index.*\.txt/i.test(u) || u.toLowerCase().includes('master.m3u8')); }
    function isMP4(u){ return /\.mp4($|\?)/i.test(u||''); }
    function isYouTube(u){ return !!(u && (u.includes('youtube.com') || u.includes('youtu.be') || u.includes('/embed/'))); }

    function resetPlayerContainer(){
      if(currentHls){ try{ currentHls.destroy(); }catch(e){} currentHls = null; }
      playerArea.innerHTML = `<video id="modal-video" controls playsinline preload="metadata"></video>`;
    }
    function getModalVideo(){ return document.getElementById('modal-video'); }

    function attachVideoListeners(){
      const v = getModalVideo();
      if(!v || v.dataset.listenersAttached) return;
      v.dataset.listenersAttached = '1';

      v.addEventListener('timeupdate', () => {
        if(!v.duration || !isFinite(v.duration)) return;
        progressFill.style.width = ((v.currentTime / v.duration) * 100) + '%';
      });

      v.addEventListener('play', () => {
        modalPlayBtn.innerHTML = '<i class="fas fa-pause mr-2"></i><span id="playText">Pause</span>';
      });
      v.addEventListener('pause', () => {
        modalPlayBtn.innerHTML = '<i class="fas fa-play mr-2"></i><span id="playText">Play</span>';
      });
      v.addEventListener('ended', () => {
        modalPlayBtn.innerHTML = '<i class="fas fa-redo mr-2"></i><span id="playText">Replay</span>';
      });
    }

    function showModal(){ playbackModal.classList.add('active'); document.body.style.overflow='hidden'; }
    function hideModal(){ playbackModal.classList.remove('active'); document.body.style.overflow=''; }

    function closeAndCleanup(){
      if(currentHls){ try{ currentHls.destroy(); }catch(e){} currentHls = null; }
      const v = getModalVideo();
      if(v){ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} }
      resetPlayerContainer();
      progressFill.style.width = '0%';
      currentIndex = null;
      hideModal();
      modalPlayBtn.innerHTML = '<i class="fas fa-play mr-2"></i><span id="playText">Play</span>';
    }

    function playInModalByIndex(list, index){
      if(!list || typeof index !== 'number' || index < 0 || index >= list.length) return;
      const movie = list[index];
      currentIndex = index;
      modalTitle.textContent = movie.title || 'Untitled';
      modalSub.textContent = (movie.year ? movie.year + ' • ' : '') + (movie.series ? movie.series : '');
      modalDesc.textContent = movie.description || '';
      progressFill.style.width = '0%';

      resetPlayerContainer();

      const url = movie.video;
      if(!url || url === "00"){
        showModal();
        modalDesc.textContent = 'Operational video link is missing or inactive.';
        return;
      }

      const iframeHosts = ['streamtape.com','openload.co','vidcdn.','dood.', 'mega.nz','drive.google.com'];
      if(iframeHosts.some(h => url.includes(h))){
        playerArea.innerHTML = `<iframe src="${url}" width="100%" height="100%" allowfullscreen allow="autoplay; encrypted-media" frameborder="0"></iframe>`;
        showModal();
        return;
      }

      if(isYouTube(url)){
        let embedUrl = url;
        if(url.includes('watch') && url.includes('v=')){
          const vid = new URLSearchParams(url.split('?')[1]).get('v');
          if(vid) embedUrl = `https://www.youtube.com/embed/${vid}`;
        }
        playerArea.innerHTML = `<iframe src="${embedUrl}?autoplay=1&modestbranding=1&rel=0" width="100%" height="100%" allowfullscreen allow="autoplay; encrypted-media" frameborder="0"></iframe>`;
        showModal();
        return;
      }

      const v = getModalVideo();
      if(isHls(url)){
        if(window.Hls && Hls.isSupported()){
          currentHls = new Hls();
          currentHls.loadSource(url);
          currentHls.attachMedia(v);
          currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
            showModal();
            attachVideoListeners();
            v.play().catch(()=>{});
          });
        } else {
          v.src = url;
          showModal();
          attachVideoListeners();
          v.play().catch(()=>{});
        }
        return;
      }

      if(isMP4(url)){
        v.src = url;
        showModal();
        attachVideoListeners();
        v.play().catch(()=>{});
        return;
      }

      window.location.href = `player.html?title=${encodeURIComponent(movie.title)}&video=${encodeURIComponent(url)}`;
    }

    modalPlayBtn.addEventListener('click', () => {
      if(playerArea.querySelector('iframe')) return;
      const v = getModalVideo();
      if(!v) return;
      if(v.paused) v.play().catch(()=>{});
      else v.pause();
    });

    prevBtn.addEventListener('click', () => {
      if(currentIndex !== null && currentIndex > 0) playInModalByIndex(currentList, currentIndex - 1);
    });
    nextBtn.addEventListener('click', () => {
      if(currentIndex !== null && currentIndex < currentList.length - 1) playInModalByIndex(currentList, currentIndex + 1);
    });

    muteBtn.addEventListener('click', () => {
      const v = getModalVideo();
      if(!v) return;
      v.muted = !v.muted;
      muteBtn.innerHTML = v.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    });
    fullscreenBtn.addEventListener('click', () => {
      const elem = playerArea.querySelector('video') || playerArea.querySelector('iframe');
      if(!elem) return;
      if(!document.fullscreenElement) elem.requestFullscreen().catch(()=>{});
      else document.exitFullscreen().catch(()=>{});
    });

    closeModalBtn.addEventListener('click', closeAndCleanup);
    playbackModal.addEventListener('click', (e) => { if(e.target === playbackModal) closeAndCleanup(); });

    document.addEventListener('keydown', (e) => {
      if(!playbackModal.classList.contains('active')) return;
      if(e.key === 'Escape') closeAndCleanup();
      if(e.key === ' '){ e.preventDefault(); const v = getModalVideo(); if(v) v.paused ? v.play() : v.pause(); }
    });

    /* Optimized Render Logic with DocumentFragment */
    function renderMovies(){
      let list = [...movies];
      const activeFilterBtn = Array.from(filterButtons).find(b => b.classList.contains('active'));
      const filter = activeFilterBtn ? activeFilterBtn.dataset.filter : 'all';
      if(filter && filter !== 'all') list = list.filter(m => m.series === filter);

      const q = (searchBar.value || '').trim().toLowerCase();
      if(q) list = list.filter(m => (m.title||'').toLowerCase().includes(q) || (m.description||'').toLowerCase().includes(q));

      currentList = list;
      moviesContainer.innerHTML = '';

      if(!list.length){
        noResults.classList.remove('hidden');
        moviesContainer.classList.add('hidden');
        return;
      }
      noResults.classList.add('hidden');
      moviesContainer.classList.remove('hidden');

      const fragment = document.createDocumentFragment();

      list.forEach((m, idx) => {
        const card = document.createElement('div');
        card.className = 'movie-card rounded-xl overflow-hidden cursor-pointer relative group flex flex-col justify-between';
        card.innerHTML = `
          <div class="movie-poster relative overflow-hidden">
            <img src="${m.image || ''}" class="w-full h-full object-cover transition duration-500 group-hover:scale-105" alt="${m.title || 'Untitled'}" loading="lazy">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex items-center justify-center p-4">
              <button class="bg-red-600 hover:bg-red-700 text-white font-rajdhani font-bold py-2 px-4 rounded transition transform hover:scale-105 shadow-[0_0_15px_rgba(220,38,38,0.8)] text-xs flex items-center gap-2 uppercase">
                <i class="fas fa-play"></i> Watch Stream
              </button>
            </div>
            <span class="absolute top-2 left-2 bg-black/80 border border-red-600/40 text-red-400 text-[10px] font-rajdhani px-2 py-0.5 rounded uppercase">${m.rating || '-'}/10</span>
          </div>
          <div class="p-3.5 flex flex-col justify-between flex-1">
            <div>
              <h3 class="font-rajdhani font-bold text-base text-red-500 truncate tracking-wide">${m.title || 'Untitled'}</h3>
              <p class="text-xs text-gray-400 mt-1 line-clamp-2">${m.description || ''}</p>
            </div>
            <div class="flex justify-between items-center mt-3 pt-2 border-t border-red-900/30 text-xs font-rajdhani text-gray-400">
              <span><i class="far fa-calendar-alt mr-1 text-red-500"></i>${m.year || ''}</span>
              <span class="uppercase">${m.series || 'Movie'}</span>
            </div>
          </div>
        `;
        card.addEventListener('click', () => playInModalByIndex(currentList, idx));
        fragment.appendChild(card);
      });

      moviesContainer.appendChild(fragment);
    }

    /* Debounce Filter & Search Inputs */
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMovies();
      });
    });

    searchBar.addEventListener('input', () => {
      clearTimeout(searchDebounceTimeout);
      searchDebounceTimeout = setTimeout(renderMovies, 150);
    });

    clearSearch.addEventListener('click', () => { searchBar.value = ''; renderMovies(); });

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        loading.classList.add('hidden');
        moviesContainer.classList.remove('hidden');
        renderMovies();
      }, 300);
    });
  </script>

<!-- Disable DevTools + View Source Protection -->
<script src="https://cdn.jsdelivr.net/npm/disable-devtool@latest"></script>

<script>
/* =========================
   Mobile Detection
========================= */
const isMobile =
    /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);

/* =========================
   Disable DevTools
========================= */
DisableDevtool({
    disable: true,
    disableMenu: true,
    clearLog: true,
    disableSelect: true,
    disableCopy: true,
    disableCut: true,
    disablePaste: true,

    /* FIXED */
    disableMobile: false,

    interval: 100,

    ondevtoolopen: function () {

        /* ONLY DESKTOP */
        if (!isMobile) {
            document.body.innerHTML = "";
            window.location.replace("about:blank");
        }
    }
});

/* =========================
   Block View Source Shortcuts
========================= */
document.addEventListener("keydown", function (e) {

    // F12
    if (e.key === "F12") {
        e.preventDefault();
        return false;
    }

    // Ctrl+U
    if (e.ctrlKey && e.key.toLowerCase() === "u") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "i") {
        e.preventDefault();
        return false;
    }

    // Ctrl+Shift+J
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "j") {
        e.preventDefault();
        return false;
    }

    // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "c") {
        e.preventDefault();
        return false;
    }

    // Ctrl+S
    if (e.ctrlKey && e.key.toLowerCase() === "s") {
        e.preventDefault();
        return false;
    }

    // Ctrl+P
    if (e.ctrlKey && e.key.toLowerCase() === "p") {
        e.preventDefault();
        return false;
    }

    // Ctrl+A
    if (e.ctrlKey && e.key.toLowerCase() === "a") {
        e.preventDefault();
        return false;
    }

    // Ctrl+C
    if (e.ctrlKey && e.key.toLowerCase() === "c") {
        e.preventDefault();
        return false;
    }

    // Ctrl+X
    if (e.ctrlKey && e.key.toLowerCase() === "x") {
        e.preventDefault();
        return false;
    }

    // Ctrl+V
    if (e.ctrlKey && e.key.toLowerCase() === "v") {
        e.preventDefault();
        return false;
    }
});

/* =========================
   Disable Right Click
========================= */
document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Dragging
========================= */
document.addEventListener("dragstart", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Selection
========================= */
document.addEventListener("selectstart", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Copy Actions
========================= */
["copy", "cut", "paste"].forEach(function(evt) {

    document.addEventListener(evt, function(e) {
        e.preventDefault();
    });

});

/* =========================
   Detect DevTools Window
   (Desktop ONLY - FIXED)
========================= */
if (!isMobile) {

    setInterval(function () {

        const widthThreshold =
            window.outerWidth - window.innerWidth > 220;

        const heightThreshold =
            window.outerHeight - window.innerHeight > 220;

        if (widthThreshold || heightThreshold) {

            document.body.innerHTML = "";
            window.location.replace("about:blank");
        }

    }, 1500);

}

/* =========================
   Disable Console
========================= */
(function () {

    console.clear();

    function block() {
        return false;
    }

    console.log = block;
    console.warn = block;
    console.error = block;
    console.info = block;
    console.debug = block;
    console.table = block;

})();

/* =========================
   Block "view-source:"
========================= */
if (window.location.href.startsWith("view-source:")) {

    document.body.innerHTML = "";
    window.location.replace("about:blank");

}

/* =========================
   Prevent iframe inspection
========================= */
if (window.top !== window.self) {

    try {
        window.top.location = window.self.location;
    } catch (e) {}

}
