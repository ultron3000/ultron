<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Jumanji Franchise Universe</title>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<!-- HLS.js for HLS playback -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    
    :root {
      --primary: #10b981;
      --secondary: #064e3b;
      --accent: #fbbf24;
      --accent-glow: rgba(251, 191, 36, 0.4);
      --muted: #9ca3af;
      --bg-dark: #020b08;
    }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(251, 191, 36, 0.08) 0%, transparent 50%);
      color: #f3f4f6;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }
    
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    .movie-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center;
      border: 1px solid rgba(16, 185, 129, 0.2);
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5);
    }
    
    .movie-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(251, 191, 36, 0.6);
      box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.25), 0 0 15px rgba(251, 191, 36, 0.2);
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #ffffff 0%, #fef08a 35%, #fbbf24 70%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .movie-poster {
      aspect-ratio: 2/3;
      transition: transform 0.5s ease;
    }
    
    .movie-card:hover .movie-poster {
      transform: scale(1.05);
    }
    
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #020b08; }
    ::-webkit-scrollbar-thumb { background: #059669; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #fbbf24; }
    
    /* Fade Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-fade-in { animation: fadeIn 0.6s ease forwards; }
    .delay-100 { animation-delay: 0.1s; }
    .delay-200 { animation-delay: 0.2s; }
    .delay-300 { animation-delay: 0.3s; }
    .delay-400 { animation-delay: 0.4s; }
    
    /* Responsive Illumination Modal Styles */
    .modal-backdrop { 
      position: fixed; 
      inset: 0; 
      background: rgba(2, 11, 8, 0.95); 
      display: none; 
      align-items: center; 
      justify-content: center; 
      z-index: 9999; 
      padding: 0;
      backdrop-filter: blur(8px);
    }
    .modal-backdrop.active { display: flex; }
    .modal-card { 
      width: 100%;
      height: 100%;
      max-width: 980px;
      max-height: 90vh;
      border-radius: 0;
      overflow: hidden;
      background: #041410;
      border: 1px solid rgba(251, 191, 36, 0.3);
      box-shadow: 0 0 50px rgba(16, 185, 129, 0.2);
      display: flex;
      flex-direction: column;
    }
    .player-wrapper { 
      position: relative;
      flex: 1;
      min-height: 0;
      background: #000;
    }
    #topCloseBtn { 
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      background: rgba(0,0,0,0.7);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.4);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: all 0.2s ease;
    }
    #topCloseBtn:hover {
      background: #fbbf24;
      color: #000;
      transform: scale(1.1);
    }
    .player-wrapper video, 
    .player-wrapper iframe { 
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .player-meta { 
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      color: #ddd;
      background: #041410;
      border-top: 1px solid rgba(16, 185, 129, 0.2);
    }
    .player-meta .meta-left { 
      width: 100%;
    }
    .player-meta h3 { 
      margin: 0;
      font-size: 1.125rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Cinzel', serif;
      color: #fbbf24;
    }
    .player-meta p { 
      margin: 6px 0 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .controls-row { 
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    .btn {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.5);
      color: #fbbf24;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      min-width: 60px;
      flex: 1;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn:hover { 
      background: #fbbf24;
      color: #000;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
    }
    .btn i { font-size: 1rem; }

    /* Responsive Controls Alignment */
    @media (min-width: 768px) {
      .modal-card {
        width: 92%;
        height: auto;
        border-radius: 12px;
        max-height: 85vh !important;
        overflow: visible !important;
      }
      .player-wrapper {
        padding-bottom: 0 !important;
        height: auto !important;
        max-height: 60vh !important;
        position: relative !important;
      }
      .player-wrapper video,
      .player-wrapper iframe {
        height: 100% !important;
        max-height: 60vh !important;
        position: relative !important;
      }
      .player-meta {
        position: relative !important;
        z-index: 100 !important;
        background: #041410 !important;
        padding-top: 12px !important;
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
      }
      .player-meta .meta-left { max-width: 55%; }
      .controls-row {
        display: flex !important;
        flex-wrap: wrap !important;
        justify-content: flex-end !important;
        gap: 10px !important;
      }
      .btn {
        min-width: 90px !important;
        padding: 8px 14px !important;
        flex: unset !important;
      }
      #topCloseBtn { opacity: 0; }
      .player-wrapper:hover #topCloseBtn { opacity: 1; }
    }

    @media (max-width: 480px) {
      .btn {
        padding: 8px;
        font-size: 0;
      }
      .btn i {
        font-size: 1rem;
        margin: 0 !important;
      }
    }
</style>
</head>
<body class="relative">

<!-- Floating jungle atmosphere background -->
<div class="fixed inset-0 overflow-hidden -z-10">
  <div class="stars"></div>
  <div class="stars2"></div>
</div>

<div class="container mx-auto px-4 py-6 max-w-7xl">

  <!-- Full-Width Video Header -->
  <div class="relative w-full h-[350px] md:h-[450px] rounded-2xl overflow-hidden border border-emerald-500/30 shadow-[0_0_30px_rgba(16,185,129,0.2)] mb-10">
    <iframe 
      src="https://www.youtube.com/embed/rFm8jnvSy7Q?autoplay=1&mute=1&loop=1&playlist=rFm8jnvSy7Q&controls=0&modestbranding=1"
      frameborder="0" 
      allow="autoplay; fullscreen" 
      class="absolute top-0 left-0 w-full h-full pointer-events-none scale-125">
    </iframe>
    <div class="absolute inset-0 bg-gradient-to-t from-[#020b08] via-transparent to-black/60"></div>

    <!-- Header Overlay Title -->
    <div class="absolute bottom-6 left-6 right-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4 z-10">
      <div>
        <span class="px-3 py-1 rounded-full bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 text-xs font-semibold tracking-widest uppercase">
          Jumanji Cinematic Collection
        </span>
        <h1 class="font-cinzel text-3xl md:text-5xl font-black gold-gradient-text mt-2 drop-shadow-lg">
          WELCOME TO THE JUNGLE
        </h1>
      </div>
    </div>
  </div>

  <!-- Movies Grid Header -->
  <div class="flex items-center justify-between mb-6 border-b border-emerald-500/20 pb-4">
    <h2 class="font-cinzel text-xl md:text-2xl font-bold text-emerald-400 tracking-wide flex items-center gap-2">
      <i class="fas fa-compass text-amber-400"></i> Complete Franchise Movies
    </h2>
    <span class="text-xs text-amber-300/80 bg-amber-400/10 px-3 py-1 rounded-full border border-amber-400/20">
      Select a movie to launch
    </span>
  </div>

  <!-- Movies Grid -->
  <div class="mb-12">
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6" id="movies"></div>
  </div>

  <!-- Footer / Social -->
  <div class="border-t border-emerald-900/40 mt-8 pt-6 text-center text-gray-400 text-sm">
    <p class="mb-3 font-cinzel text-amber-400/80">Roll the dice... if you dare.</p>
    <div class="flex justify-center gap-4">
      <a href="#" class="hover:text-amber-400 transition"><i class="fab fa-facebook-f"></i></a>
      <a href="#" class="hover:text-amber-400 transition"><i class="fab fa-twitter"></i></a>
      <a href="https://www.instagram.com/stark_4152/reels" class="hover:text-amber-400 transition"><i class="fab fa-instagram"></i></a>
      <a href="https://www.youtube.com/channel/UCD9dGWVkAjrdm3D_7gkbi2g" class="hover:text-amber-400 transition"><i class="fab fa-youtube"></i></a>
    </div>
  </div>
</div>

<!-- Modal Player -->
<div id="playbackModal" class="modal-backdrop" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="player-wrapper" id="playerWrapper">
      <video id="modalVideo" controls playsinline style="width:100%;height:100%;background:#000"></video>
      <button id="topCloseBtn" title="Close Player">
        <i class="fas fa-times text-lg"></i>
      </button>
    </div>

    <div class="player-meta">
      <div class="meta-left">
        <h3 id="modalTitle">Title</h3>
        <p id="modalDesc" class="text-sm"></p>
      </div>
      <div class="controls-row">
        <button id="prevBtn" class="btn"><i class="fas fa-step-backward"></i><span>Prev</span></button>
        <button id="playPauseBtn" class="btn"><i class="fas fa-play"></i><span>Play</span></button>
        <button id="nextBtn" class="btn"><span>Next</span><i class="fas fa-step-forward"></i></button>
        <button id="fullscreenBtn" class="btn"><i class="fas fa-expand"></i></button>
        <button id="muteBtn" class="btn"><i class="fas fa-volume-up"></i></button>
        <button id="closeBtn" class="btn"><i class="fas fa-times"></i></button>
      </div>
    </div>
  </div>
</div>

<script>
    /******************************
     * Updated Movies Array with Descriptions & Open World Title[cite: 6]
     ******************************/
    const movies = [
      { 
        title: "Jumanji", 
        video: "https://mega.nz/embed/0BgAkCjb#Cj8AsamGI4nfK0uqGWMLiPV4JwqrhwFD_e_An5lEhVs", 
        image: "https://images.justwatch.com/poster/306541019/s718/jumanji.jpg", 
        category: "classic", 
        year: 1995,
        duration: "1h 44m",
        description: "When two siblings discover a magical board game, they release a man trapped in it for decades and unleash a jungle full of wild dangers that can only be stopped by finishing the game."
      },
      { 
        title: "Zathura: A Space Adventure", 
        video: "https://mega.nz/embed/7XIC2bhC#Am9hL0FtWjlbY4z2i6gOrC9mOVGgSaTzvE18-NH51rs", 
        image: "https://image.tmdb.org/t/p/original/jigrJSYI7NzKVh9m2Sfs0zDIxS0.jpg", 
        category: "spin-off", 
        year: 2005,
        duration: "1h 41m",
        description: "Two feuding brothers are propelled into deep space when playing a mysterious board game found in their basement, where every move forces them to face cosmic hazards."
      },
      { 
        title: "Jumanji: Welcome to the Jungle", 
        video: "https://mega.nz/embed/4I4EXCJQ#bIIvCQ8wqgtHed0tSaAVRMtJYdMhQmkm-BZTO2PVWlI", 
        image: "https://i.ebayimg.com/images/g/af4AAOSw3HZbGPCH/s-l400.jpg", 
        category: "modern", 
        year: 2017,
        duration: "1h 59m",
        description: "Four high school teenagers are sucked into a magical video game, transformed into unique adult avatars, and forced to complete a jungle quest to return home."
      },
      { 
        title: "Jumanji: The Next Level", 
        video: "https://mega.nz/embed/HgRGjYLZ#uFoC0qQ0lm7Z2uCB-v4TPegAf7w1ubZCOkAlI0wKS4U", 
        image: "https://image.tmdb.org/t/p/w500/4kh9dxAiClS2GMUpkRyzGwpNWWX.jpg", 
        category: "modern", 
        year: 2019,
        duration: "2h 03m",
        description: "The gang returns to Jumanji to rescue Spencer, but discover the rules have changed, leading them through uncharted arid deserts and snowy mountains."
      },
      { 
        title: "Jumanji: Open World", 
        video: "https://www.youtube.com/watch?v=zhApeaHMvfs", 
        image: "https://image.tmdb.org/t/p/w500/wlzAdBQw2XnmVW05YEJLNdAbizA.jpg", 
        category: "new", 
        year: 2026,
        duration: "2h 10m",
        description: "The game expands beyond its digital borders into a massive open-world dimension where multi-biome environments and unprecedented boss challenges test the ultimate team."
      }
    ];

    /******************************
     * DOM Refs & Modal Logic
     ******************************/
    const playbackModal = document.getElementById('playbackModal');
    const playerWrapper = document.getElementById('playerWrapper');
    const modalVideoId = 'modalVideo';
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const muteBtn = document.getElementById('muteBtn');

    let currentHls = null;
    let currentFiltered = [];
    let currentIndex = null;

    function isMP4(url) { return /\.mp4($|\?)/i.test((url||'')); }
    function isHls(url) {
      if (!url) return false;
      return url.includes('.m3u8') || url.includes('index-') || /index.*\.txt/i.test(url) || url.includes('manifest') || url.includes('master');
    }
    function isYouTube(url) {
      if (!url) return false;
      return url.includes('youtube.com') || url.includes('youtu.be') || url.includes('youtube-nocookie.com') || url.includes('/embed/');
    }

    function resetPlayerContainer() {
      if (currentHls) {
        try { currentHls.destroy(); } catch(e) {}
        currentHls = null;
      }
      playerWrapper.innerHTML = `<video id="${modalVideoId}" controls playsinline style="width:100%;height:100%;background:#000"></video>`;
    }

    function showModal() {
      playbackModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function hideModal() {
      playbackModal.classList.remove('active');
      document.body.style.overflow = '';
    }

    function openPlayer(list, index) {
      if (!Array.isArray(list) || list.length === 0 || index == null || index < 0 || index >= list.length) return;
      currentFiltered = list;
      currentIndex = index;
      const movie = list[index];
      if (!movie) return;

      modalTitle.textContent = movie.title || '';
      modalDesc.textContent = movie.description || (movie.title || '');

      resetPlayerContainer();
      showModal();

      let src = typeof movie.video === 'object' && movie.video !== null ? (movie.video.high || Object.values(movie.video)[0]) : movie.video;
      if (!src) return;

      const lc = (src || '').toLowerCase();

      if (lc.includes('streamtape.com') || lc.includes('dood') || lc.includes('vidcdn') || lc.includes('ok.ru') || lc.includes('mega.nz') || lc.includes('drive.google.com')) {
        playerWrapper.innerHTML = `<iframe src="${src}" width="100%" height="100%" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        return;
      }

      if (isYouTube(src)) {
        let embed = src;
        if (src.includes('watch') && src.includes('v=')) {
          const v = new URLSearchParams(src.split('?')[1]).get('v');
          if (v) embed = `https://www.youtube.com/embed/${v}`;
        }
        playerWrapper.innerHTML = `<iframe src="${embed}?autoplay=1&modestbranding=1" width="100%" height="100%" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        return;
      }

      if (isHls(src)) {
        const v = document.getElementById(modalVideoId);
        if (window.Hls && Hls.isSupported()) {
          currentHls = new Hls();
          currentHls.loadSource(src);
          currentHls.attachMedia(v);
          currentHls.on(Hls.Events.MANIFEST_PARSED, function() {
            v.play().catch(()=>{});
            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
          });
        } else if (v.canPlayType && v.canPlayType('application/vnd.apple.mpegurl')) {
          v.src = src;
          v.play().catch(()=>{});
          playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        }
        return;
      }

      if (isMP4(src)) {
        const v = document.getElementById(modalVideoId);
        if (v) {
          v.src = src;
          v.play().catch(()=>{});
          playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        }
      }
    }

    function togglePlayPause() {
      const v = document.getElementById(modalVideoId);
      if (!v) return;
      if (v.paused) {
        v.play().catch(()=>{});
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
      } else {
        v.pause();
        playPauseBtn.innerHTML = '<i class="fas fa-play"></i><span>Play</span>';
      }
    }

    function playNext() {
      if (!currentFiltered.length) currentFiltered = movies.slice();
      if (currentIndex != null && currentIndex < currentFiltered.length - 1) openPlayer(currentFiltered, currentIndex + 1);
    }

    function playPrev() {
      if (!currentFiltered.length) currentFiltered = movies.slice();
      if (currentIndex != null && currentIndex > 0) openPlayer(currentFiltered, currentIndex - 1);
    }

    function toggleFullscreen() {
      const el = document.getElementById(modalVideoId) || playerWrapper.querySelector('iframe');
      if (!el) return;
      if (!document.fullscreenElement) {
        (el.requestFullscreen || playerWrapper.requestFullscreen).call(el).catch(()=>{});
      } else {
        document.exitFullscreen();
      }
    }

    function toggleMute() {
      const v = document.getElementById(modalVideoId);
      if (!v) return;
      v.muted = !v.muted;
      muteBtn.innerHTML = v.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    }

    function closeModalHandler() {
      if (currentHls) {
        try { currentHls.destroy(); } catch(e) {}
        currentHls = null;
      }
      const v = document.getElementById(modalVideoId);
      if (v) {
        try { v.pause(); } catch(e){}
      }
      resetPlayerContainer();
      hideModal();
      currentIndex = null;
      currentFiltered = [];
      playPauseBtn.innerHTML = '<i class="fas fa-play"></i><span>Play</span>';
    }

    playPauseBtn.addEventListener('click', togglePlayPause);
    nextBtn.addEventListener('click', playNext);
    prevBtn.addEventListener('click', playPrev);
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    muteBtn.addEventListener('click', toggleMute);
    document.getElementById('closeBtn').addEventListener('click', closeModalHandler);
    document.getElementById('topCloseBtn').addEventListener('click', closeModalHandler);

    playbackModal.addEventListener('click', function(e){
      if (e.target === playbackModal) closeModalHandler();
    });

    document.addEventListener('keydown', (e) => {
      if (!playbackModal.classList.contains('active')) return;
      if (e.key === 'Escape') closeModalHandler();
      if (e.key === ' ') { e.preventDefault(); togglePlayPause(); }
      if (e.key === 'ArrowRight') playNext();
      if (e.key === 'ArrowLeft') playPrev();
    });

    /******************************
     * Render Movies
     ******************************/
    const container = document.getElementById('movies');

    function renderMovies(moviesToRender) {
      container.innerHTML = '';
      moviesToRender.forEach((movie, index) => {
        const div = document.createElement('div');
        div.className = `movie-card animate-fade-in rounded-xl overflow-hidden bg-slate-900/80 hover:bg-slate-800/80 cursor-pointer relative group flex flex-col justify-between`;
        div.innerHTML = `
          <div class="relative overflow-hidden rounded-t-lg">
            <img src="${movie.image}" alt="${movie.title}" class="w-full h-full object-cover movie-poster">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center p-4">
              <button class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold py-2.5 px-5 rounded-full transition transform hover:scale-105 shadow-[0_0_15px_rgba(251,191,36,0.6)] flex items-center gap-2">
                <i class="fas fa-play text-xs"></i> Play
              </button>
            </div>
          </div>
          <div class="p-4 flex flex-col justify-between flex-1">
            <div>
              <h3 class="font-cinzel font-semibold text-base text-amber-300 truncate">${movie.title}</h3>
              <p class="text-xs text-gray-400 mt-1 line-clamp-2">${movie.description}</p>
            </div>
            <div class="flex justify-between items-center mt-3 pt-2 border-t border-emerald-900/30 text-xs font-medium text-emerald-400">
              <span><i class="far fa-calendar-alt mr-1"></i>${movie.year}</span>
              <span><i class="far fa-clock mr-1"></i>${movie.duration}</span>
            </div>
          </div>
        `;

        div.addEventListener('click', () => {
          openPlayer(moviesToRender, index);
        });

        container.appendChild(div);
      });
    }

    renderMovies(movies);

    /******************************
     * Jungle Particles Background
     ******************************/
    function createStars(container, count) {

        star.style.animation = `float ${5 + Math.random() * 10}s infinite ease-in-out alternate`;

    if (starsContainer) createStars(starsContainer, 40);

<!-- Disable DevTools + View Source Protection -->
<script src="https://cdn.jsdelivr.net/npm/disable-devtool@latest"></script>

<script>
/* =========================
   Mobile Detection
========================= */
const isMobile =
    /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);

/* =========================
   Disable DevTools
========================= */
DisableDevtool({
    disable: true,
    disableMenu: true,
    clearLog: true,
    disableSelect: true,
    disableCopy: true,
    disableCut: true,
    disablePaste: true,

    /* FIXED */
    disableMobile: false,

    interval: 100,

    ondevtoolopen: function () {

        /* ONLY DESKTOP */
        if (!isMobile) {
            document.body.innerHTML = "";
            window.location.replace("about:blank");
        }
    }
});

/* =========================
   Block View Source Shortcuts
========================= */
document.addEventListener("keydown", function (e) {

    // F12
    if (e.key === "F12") {
        e.preventDefault();
        return false;
    }

    // Ctrl+U
    if (e.ctrlKey && e.key.toLowerCase() === "u") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "i") {
        e.preventDefault();
        return false;
    }

    // Ctrl+Shift+J
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "j") {
        e.preventDefault();
        return false;
    }

    // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "c") {
        e.preventDefault();
        return false;
    }

    // Ctrl+S
    if (e.ctrlKey && e.key.toLowerCase() === "s") {
        e.preventDefault();
        return false;
    }

    // Ctrl+P
    if (e.ctrlKey && e.key.toLowerCase() === "p") {
        e.preventDefault();
        return false;
    }

    // Ctrl+A
    if (e.ctrlKey && e.key.toLowerCase() === "a") {
        e.preventDefault();
        return false;
    }

    // Ctrl+C
    if (e.ctrlKey && e.key.toLowerCase() === "c") {
        e.preventDefault();
        return false;
    }

    // Ctrl+X
    if (e.ctrlKey && e.key.toLowerCase() === "x") {
        e.preventDefault();
        return false;
    }

    // Ctrl+V
    if (e.ctrlKey && e.key.toLowerCase() === "v") {
        e.preventDefault();
        return false;
    }
});

/* =========================
   Disable Right Click
========================= */
document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Dragging
========================= */
document.addEventListener("dragstart", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Selection
========================= */
document.addEventListener("selectstart", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Copy Actions
========================= */
["copy", "cut", "paste"].forEach(function(evt) {

    document.addEventListener(evt, function(e) {
        e.preventDefault();
    });

});

/* =========================
   Detect DevTools Window
   (Desktop ONLY - FIXED)
========================= */
if (!isMobile) {

    setInterval(function () {

        const widthThreshold =
            window.outerWidth - window.innerWidth > 220;

        const heightThreshold =
            window.outerHeight - window.innerHeight > 220;

        if (widthThreshold || heightThreshold) {

            document.body.innerHTML = "";
            window.location.replace("about:blank");
        }

    }, 1500);

}

/* =========================
   Disable Console
========================= */
(function () {

    console.clear();

    function block() {
        return false;
    }

    console.log = block;
    console.warn = block;
    console.error = block;
    console.info = block;
    console.debug = block;
    console.table = block;

})();

/* =========================
   Block "view-source:"
========================= */
if (window.location.href.startsWith("view-source:")) {

    document.body.innerHTML = "";
    window.location.replace("about:blank");

}

/* =========================
   Prevent iframe inspection
========================= */
if (window.top !== window.self) {

    try {
        window.top.location = window.self.location;
    } catch (e) {}

}
</script>
