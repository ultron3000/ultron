<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Live Channels & Media Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    
    :root {
      --primary: #ffcc00;
      --secondary: #111827;
      --accent: #f59e0b;
      --muted: #9CA3AF;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    
    .movie-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    
    .movie-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
    }
    
    .search-input {
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    .search-input:focus {
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.5);
    }
    
    .movie-poster {
      aspect-ratio: 16/9;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    
    .movie-card:hover .movie-poster {
      transform: scale(1.05);
    }
    
    .category-tab {
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    
    .category-tab:hover {
      transform: translateY(-2px);
      background-color: rgba(255, 204, 0, 0.1);
    }
    
    .category-tab.active {
      background-color: var(--primary);
      color: var(--secondary);
      font-weight: 600;
    }
    
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #ffcc00;
      border-radius: 10px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #f59e0b;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-fade-in {
      animation: fadeIn 0.4s ease forwards;
    }
    
    .delay-100 { animation-delay: 0.05s; }
    .delay-200 { animation-delay: 0.1s; }
    .delay-300 { animation-delay: 0.15s; }
    .delay-400 { animation-delay: 0.2s; }
    
    .modal-backdrop { 
      position:fixed; 
      inset:0; 
      background: rgba(0,0,0,0.85); 
      display:none; 
      align-items:center; 
      justify-content:center; 
      z-index:9999; 
      backdrop-filter: blur(8px);
    }
    .modal-backdrop.active { display:flex; }
    
    .modal-card { 
      width: 100%;
      height: 100%;
      max-width: 980px;
      max-height: 100vh;
      background: #0b1220;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 768px) {
      .modal-card {
        max-height: 100vh;
      }
      .player-wrapper {
        padding-bottom: 56.25% !important;
      }
      .player-meta {
        padding: 12px !important;
      }
    }
    
    .player-wrapper { 
      position: relative;
      flex: 1;
      min-height: 0;
      background: #000;
    }
    
    #topCloseBtn { 
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    
    #topCloseBtn:hover {
      background: #ef4444;
      transform: scale(1.1);
    }
    
    .player-wrapper video, 
    .player-wrapper iframe { 
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    
    .player-meta { 
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      color: #ddd;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      flex-shrink: 0;
    }
    
    .player-meta h3 { 
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
    }
    
    .controls-row { 
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }
    
    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    
    .btn:hover { 
      background: var(--primary); 
      color: var(--secondary);
      border-color: var(--primary);
    }
    
    @media (min-width: 768px) {
      .modal-card {
        width: 90%;
        height: auto;
        border-radius: 16px;
        max-height: 90vh;
        overflow: hidden;
      }
      .player-wrapper {
        padding-bottom: 56.25% !important;
        height: 0;
        flex: none;
      }
      .player-meta {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
      .controls-row {
        flex-wrap: nowrap;
      }
    }
    
    @media (max-width: 480px) {
      .btn span { display: none; }
      .btn { padding: 10px 12px; }
    }
    
    video:fullscreen, video:-webkit-full-screen {
      object-fit: contain !important;
      background-color: black;
    }
  </style>
</head>

<body>
  <div class="container mx-auto px-4 py-6 max-w-7xl">
    <header class="relative flex items-center justify-center mb-6 sm:mb-8">
      <a href="https://ultron3000.github.io/ultron" class="absolute left-0">
        <img src="https://static.readdy.ai/image/0ece273271e400e488b9947cb1e99e9a/a79b6f32c71c4ee2094ead0eb9c84c9b.png" alt="Logo" class="h-8 sm:h-10 md:h-12 drop-shadow-lg"/>
      </a>
      <h1 class="text-2xl sm:text-3xl font-bold text-yellow-400 tracking-wide flex items-center gap-2">
        <span>📡</span> Media Hub
      </h1>
    </header>

    <!-- Search Bar -->
    <div class="mb-6 flex justify-center">
      <div class="relative w-full max-w-md">
        <input type="text" id="searchBar" placeholder="Search channels, movies, series..." class="search-input w-full px-5 py-3 pl-12 rounded-full bg-gray-800/60 backdrop-blur-md border border-gray-700 focus:border-yellow-400 text-white placeholder-gray-400 focus:outline-none"/>
        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-yellow-400"></i>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="flex flex-wrap gap-2 mb-8 justify-center px-1">
      <button class="category-tab active px-4 py-2 rounded-full border border-gray-700 text-gray-300" data-category="all">All</button>
      <button class="category-tab px-4 py-2 rounded-full border border-gray-700 text-gray-300" data-category="channel">Channels</button>
      <button class="category-tab px-4 py-2 rounded-full border border-gray-700 text-gray-300" data-category="english">English Movies</button>
      <button class="category-tab px-4 py-2 rounded-full border border-gray-700 text-gray-300" data-category="hindi">Hindi Movies</button>
      <button class="category-tab px-4 py-2 rounded-full border border-gray-700 text-gray-300" data-category="marathi">Marathi Movies</button>
      <button class="category-tab px-4 py-2 rounded-full border border-gray-700 text-gray-300" data-category="series">Series</button>
    </div>

    <!-- Main Grid -->
    <div id="movies" class="grid grid-cols-2 xs:grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-4 mb-12"></div>
  </div>

  <!-- Playback Modal -->
  <div id="playbackModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="player-wrapper" id="playerWrapper">
        <video id="modalVideo" controls playsinline style="width:100%;height:100%;background:#000"></video>
        <button id="topCloseBtn"><i class="fas fa-times"></i></button>
      </div>

      <div class="player-meta">
        <div class="meta-left max-w-[100%] md:max-w-[40%]">
          <h3 id="modalTitle" class="truncate">Title</h3>
          <p id="modalDesc" class="text-sm text-gray-400 truncate mt-1"></p>
        </div>
        <div class="controls-row">
          <button id="prevBtn" class="btn"><i class="fas fa-step-backward"></i><span>Prev</span></button>
          <button id="playPauseBtn" class="btn"><i class="fas fa-play"></i><span>Play</span></button>
          <button id="nextBtn" class="btn"><span>Next</span><i class="fas fa-step-forward"></i></button>
          <button id="fullscreenBtn" class="btn"><i class="fas fa-expand"></i></button>
          <button id="muteBtn" class="btn"><i class="fas fa-volume-up"></i></button>
          <button id="closeBtn" class="btn !bg-red-600/20 !border-red-500/40 hover:!bg-red-600 text-white"><i class="fas fa-times"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let movies = [];
    let currentHls = null;
    let currentFiltered = [];
    let currentIndex = null;

    const playbackModal = document.getElementById('playbackModal');
    const playerWrapper = document.getElementById('playerWrapper');
    const modalVideoId = 'modalVideo';
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const muteBtn = document.getElementById('muteBtn');

    function isMP4(url) { return /\.mp4($|\?)/i.test((url||'')); }
    function isHls(url) {
      if (!url) return false;
      return url.includes('.m3u8') || url.includes('index-') || /index.*\.txt/i.test(url) || url.includes('manifest') || url.includes('master');
    }
    function isYouTube(url) {
      if (!url) return false;
      return url.includes('youtube.com') || url.includes('youtu.be') || url.includes('youtube-nocookie.com') || url.includes('/embed/');
    }

    function resetPlayerContainer() {
      if (currentHls) {
        try { currentHls.destroy(); } catch(e) {}
        currentHls = null;
      }
      if (window.shakaPlayer) {
        try { window.shakaPlayer.destroy(); } catch(e) {}
        window.shakaPlayer = null;
      }
      playerWrapper.innerHTML = `<video id="${modalVideoId}" controls playsinline style="width:100%;height:100%;background:#000"></video>`;
    }

    function showModal() {
      playbackModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function hideModal() {
      playbackModal.classList.remove('active');
      document.body.style.overflow = '';
    }

    async function openPlayer(list, index) {
      if (!Array.isArray(list) || list.length === 0 || index == null || index < 0 || index >= list.length) return;
      
      currentFiltered = list;
      currentIndex = index;
      const movie = list[index];
      if (!movie) return;

      modalTitle.textContent = movie.title || '';
      modalDesc.textContent = movie.subtitle || movie.language || movie.category?.toUpperCase() || '';

      resetPlayerContainer();
      showModal();

      let src = movie.video || movie.url;
      if (typeof src === 'object' && src !== null) {
        src = src.high || Object.values(src)[0];
      }
      if (!src) return;

      const lc = src.toLowerCase();

      // DASH / MPD Key setup
      if (typeof movie.video === 'object' && movie.video.mpd) {
        const v = document.getElementById(modalVideoId);
        try {
          window.shakaPlayer = new shaka.Player(v);
          if (movie.video.key) {
            const [kid, key] = movie.video.key.split(':');
            window.shakaPlayer.configure({ drm: { clearKeys: { [kid]: key } } });
          }
          await window.shakaPlayer.load(movie.video.mpd);
          v.play().catch(()=>{});
          playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
          return;
        } catch (e) { return; }
      }

      // Iframes / Web Players
      if (lc.includes('mega.nz') || lc.includes('turboembed') || lc.includes('cloudtv.store') || lc.includes('waptv.wapka.xyz') || lc.includes('tv4wab.pages.dev') || lc.includes('trend48.st') || lc.includes('dood') || lc.includes('vidcdn') || lc.includes('ok.ru')) {
        playerWrapper.innerHTML = `<iframe src="${src}" width="100%" height="100%" frameborder="0" allowfullscreen allow="autoplay; encrypted-media" style="background:#000"></iframe>`;
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        return;
      }

      // YouTube player
      if (isYouTube(src)) {
        let embed = src;
        if (src.includes('watch') && src.includes('v=')) {
          const v = new URLSearchParams(src.split('?')[1]).get('v');
          if (v) embed = `https://www.youtube.com/embed/${v}`;
        }
        playerWrapper.innerHTML = `<iframe src="${embed}?autoplay=1&modestbranding=1" width="100%" height="100%" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        return;
      }

      // HLS Engine
      if (isHls(src)) {
        const v = document.getElementById(modalVideoId);
        if (window.Hls && Hls.isSupported()) {
          currentHls = new Hls({ maxBufferLength: 30, enableWorker: true, lowLatencyMode: true });
          currentHls.loadSource(src);
          currentHls.attachMedia(v);
          currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
            currentHls.startLoad(-1);
            v.play().catch(() => {});
            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
          });
        } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
          v.src = src;
          v.play().catch(()=>{});
          playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        }
        return;
      }

      // MP4 fallback
      if (isMP4(src)) {
        const v = document.getElementById(modalVideoId);
        v.src = src;
        v.play().catch(()=>{});
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
        return;
      }
    }

    function togglePlayPause() {
      const v = document.getElementById(modalVideoId);
      if (!v) return;
      if (v.paused) {
        v.play().catch(()=>{});
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span>Pause</span>';
      } else {
        v.pause();
        playPauseBtn.innerHTML = '<i class="fas fa-play"></i><span>Play</span>';
      }
    }

    function playNext() {
      if (!currentFiltered.length) currentFiltered = movies;
      if (currentIndex != null && currentIndex < currentFiltered.length - 1) openPlayer(currentFiltered, currentIndex + 1);
    }

    function playPrev() {
      if (!currentFiltered.length) currentFiltered = movies;
      if (currentIndex != null && currentIndex > 0) openPlayer(currentFiltered, currentIndex - 1);
    }

    function toggleFullscreen() {
      const el = document.getElementById(modalVideoId) || playerWrapper.querySelector('iframe');
      if (!el) return;
      if (!document.fullscreenElement) (el.requestFullscreen || playerWrapper.requestFullscreen).call(el).catch(()=>{});
      else document.exitFullscreen();
    }

    function toggleMute() {
      const v = document.getElementById(modalVideoId);
      if (!v) return;
      v.muted = !v.muted;
      muteBtn.innerHTML = v.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    }

    function closeModalHandler() {
      if (currentHls) { currentHls.destroy(); currentHls = null; }
      const v = document.getElementById(modalVideoId);
      if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
      resetPlayerContainer();
      hideModal();
      playPauseBtn.innerHTML = '<i class="fas fa-play"></i><span>Play</span>';
    }

    playPauseBtn.addEventListener('click', togglePlayPause);
    nextBtn.addEventListener('click', playNext);
    prevBtn.addEventListener('click', playPrev);
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    muteBtn.addEventListener('click', toggleMute);
    document.getElementById('closeBtn')?.addEventListener('click', closeModalHandler);
    document.getElementById('topCloseBtn')?.addEventListener('click', closeModalHandler);
    playbackModal.addEventListener('click', (e) => { if (e.target === playbackModal) closeModalHandler(); });

    const container = document.getElementById('movies');
    function renderMovies(moviesToRender) {
      container.innerHTML = '';
      if (moviesToRender.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">No media found matching your query.</div>`;
        return;
      }
      moviesToRender.forEach((movie, index) => {
        const div = document.createElement('div');
        div.className = `movie-card animate-fade-in rounded-xl overflow-hidden bg-gray-800/80 border border-gray-700/50 hover:border-yellow-400/60 cursor-pointer relative group`;
        const badgeHtml = movie.badge ? `<span class="absolute top-2 left-2 bg-blue-600 text-[10px] font-bold px-2 py-0.5 rounded text-white z-10">${movie.badge}</span>` : '';
        const imgUrl = movie.image || movie.img || 'https://via.placeholder.com/500';
        div.innerHTML = `
          <div class="relative overflow-hidden">
            ${badgeHtml}
            <img src="${imgUrl}" alt="${movie.title}" class="w-full movie-poster" loading="lazy">
            <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
              <span class="bg-yellow-400 text-gray-900 rounded-full p-3 transform scale-90 group-hover:scale-100 transition-all shadow-lg"><i class="fas fa-play"></i></span>
            </div>
          </div>
          <div class="p-3 bg-gray-900/40">
            <h3 class="font-medium text-sm sm:text-base truncate text-gray-100 group-hover:text-yellow-400 transition-colors">${movie.title}</h3>
          </div>
        `;
        div.addEventListener('click', () => openPlayer(moviesToRender, index));
        container.appendChild(div);
      });
    }

    // Load search-index.json as text, execute it safely so your exact arrays (tvChannels, englishMovies, hindiMovies, marathiMovies, seriesList) are loaded into memory without changing your format, and merge them automatically.
    async function fetchSearchIndex() {
      try {
        const response = await fetch('search-index.json');
        if (!response.ok) throw new Error('Failed to load search-index.json');
        const textData = await response.text();
        
        // Execute the text code block safely to define your original variables in scope
        const scriptCode = `
          ${textData}
          // Normalize and bundle all your individual arrays into one unified list automatically
          window._parsedMovies = [
            ...(typeof tvChannels !== 'undefined' ? tvChannels.map(i => ({ ...i, category: i.category || 'channel' })) : []),
            ...(typeof englishMovies !== 'undefined' ? englishMovies.map(i => ({ ...i, category: 'english' })) : []),
            ...(typeof hindiMovies !== 'undefined' ? hindiMovies.map(i => ({ ...i, category: 'hindi' })) : []),
            ...(typeof marathiMovies !== 'undefined' ? marathiMovies.map(i => ({ ...i, category: 'marathi' })) : []),
            ...(typeof seriesList !== 'undefined' ? seriesList : [])
          ];
        `;
        
        // Evaluate the script code in the current context
        (new Function(scriptCode))();
        
        movies = window._parsedMovies || [];
        renderMovies(movies);
      } catch (error) {
        console.error("Error loading search-index.json:", error);
        container.innerHTML = `<div class="col-span-full text-center py-12 text-red-400">Failed to load or parse search-index.json.</div>`;
      }
    }

    fetchSearchIndex();

    document.getElementById('searchBar').addEventListener('input', function() {
      const searchTerm = this.value.toLowerCase();
      renderMovies(movies.filter(movie => movie.title && movie.title.toLowerCase().includes(searchTerm)));
    });

    document.querySelectorAll('.category-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        const category = this.dataset.category;
        renderMovies(category === 'all' ? movies : movies.filter(movie => movie.category && movie.category.toLowerCase() === category.toLowerCase()));
      });
    });
  </script>
</body>
</html>
