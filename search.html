<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud TV - Search Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-dark-900 text-slate-100 min-h-screen font-sans antialiased">
    <header class="sticky top-0 z-50 bg-dark-800/90 backdrop-blur-md border-b border-slate-700/50 px-4 lg:px-8 py-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <a href="index.html" class="flex items-center space-x-2 text-xl font-bold text-red-500">
                <i class="fa-solid fa-cloud"></i>
                <span>Cloud TV Search</span>
            </a>
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="searchInput" placeholder="Search channels, movies, series..." 
                    class="w-full pl-10 pr-4 py-2 bg-dark-900 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:border-red-500">
            </div>
            <div class="flex items-center space-x-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
                <button onclick="filterType('all')" class="filter-btn px-4 py-2 text-sm font-medium rounded-lg bg-red-600 text-white transition-colors">All</button>
                <button onclick="filterType('channel')" class="filter-btn px-4 py-2 text-sm font-medium rounded-lg bg-dark-700 text-slate-300 hover:bg-slate-700 transition-colors">Channels</button>
                <button onclick="filterType('movie')" class="filter-btn px-4 py-2 text-sm font-medium rounded-lg bg-dark-700 text-slate-300 hover:bg-slate-700 transition-colors">Movies</button>
                <button onclick="filterType('series')" class="filter-btn px-4 py-2 text-sm font-medium rounded-lg bg-dark-700 text-slate-300 hover:bg-slate-700 transition-colors">Series</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 lg:px-8 py-8">
        <div id="loading" class="text-center py-20 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
            <p>Loading master catalog...</p>
        </div>
        <div id="resultsCount" class="text-sm text-slate-400 mb-6 hidden"></div>
        <div id="catalogGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 lg:gap-6"></div>
        <div id="emptyState" class="hidden text-center py-20">
            <i class="fa-solid fa-film text-5xl text-slate-600 mb-4"></i>
            <h3 class="text-lg font-semibold text-slate-300">No results found</h3>
        </div>
    </main>

    <div id="playerModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="relative w-full max-w-4xl bg-dark-800 rounded-xl overflow-hidden shadow-2xl border border-slate-700 flex flex-col">
            <div class="flex items-center justify-between px-4 py-3 bg-dark-900 border-b border-slate-700">
                <h3 id="modalTitle" class="font-semibold text-slate-200 truncate"></h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="relative aspect-video bg-black flex items-center justify-center">
                <video id="nativeVideo" controls autoplay class="w-full h-full object-contain hidden"></video>
                <iframe id="modalIframe" src="" class="w-full h-full border-0 hidden" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        let masterCatalog = [];
        let currentFilter = 'all';
        let hlsInstance = null;

        async function loadCatalog() {
            let items = [];

            // 1. Load channels.json
            try {
                let res = await fetch('channels.json');
                if (res.ok) {
                    let data = await res.json();
                    let list = Array.isArray(data) ? data : (data.channels || []);
                    list.forEach(ch => {
                        items.push({
                            title: ch.title || ch.name || 'Channel',
                            image: ch.image || 'https://via.placeholder.com/300x450?text=Channel',
                            video: ch.video || ch.url || '',
                            category: ch.category || 'Live TV',
                            type: 'channel'
                        });
                    });
                }
            } catch(e) { console.log("Channels load note:", e); }

            // 2. Load movies.html
            try {
                let res = await fetch('movies.html');
                if (res.ok) {
                    let html = await res.text();
                    items.push(...extractItemsFromHtml(html, 'movie'));
                }
            } catch(e) { console.log("Movies load note:", e); }

            // 3. Load series.html
            try {
                let res = await fetch('series.html');
                if (res.ok) {
                    let html = await res.text();
                    items.push(...extractItemsFromHtml(html, 'series'));
                }
            } catch(e) { console.log("Series load note:", e); }

            // Fallback / default embedded sample items if empty
            if (items.length === 0) {
                items = [
                    {title: "Star Sports 1 Hindi", image: "https://5.imimg.com/data5/SELLER/Default/2024/7/432813201/YT/VH/RF/184162459/star-sports-1-hindi-250x250.webp", video: "https://sonucdn-v3.pages.dev/star?id=H1HD", type: "channel", category: "cricket"},
                    {title: "Whalefall", image: "https://image.tmdb.org/t/p/w500/vjTYUTgh9nO88i6HZ4YPRhiFL05.jpg", video: "https://mega.nz/embed/0AQkQAiK#Y7k8LF8nR9vaDp7QIwkIoBVmktBGBO0H-PE_lKDumcg", type: "movie", category: "English"},
                    {title: "Ted Lasso", image: "https://image.tmdb.org/t/p/w500/8cKgDJggjKAotruZ1gBv4R0R2gE.jpg", video: "", type: "series", category: "Comedy"}
                ];
            }

            masterCatalog = items;
            document.getElementById('loading').classList.add('hidden');
            renderCatalog(masterCatalog);
        }

        function extractItemsFromHtml(htmlText, typeDefault) {
            let results = [];
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                // Extract any JavaScript variable arrays defined in script tags
                doc.querySelectorAll('script').forEach(script => {
                    let text = script.textContent;
                    let matches = text.match(/\[\s*\{[\s\S]*?\}\s*\]/g);
                    if (matches) {
                        matches.forEach(match => {
                            try {
                                let jsonStr = match
                                    .replace(/([a-zA-Z0-9_]+)\s*:/g, '"$1":')
                                    .replace(/'/g, '"')
                                    .replace(/,\s*([\]}])/g, '$1');
                                let arr = JSON.parse(jsonStr);
                                if (Array.isArray(arr)) {
                                    arr.forEach(obj => {
                                        if (obj.title || obj.name) {
                                            results.push({
                                                title: obj.title || obj.name,
                                                image: obj.image || obj.poster || 'https://via.placeholder.com/300x450?text=No+Image',
                                                video: obj.video || obj.url || '',
                                                category: obj.category || typeDefault,
                                                type: typeDefault,
                                                year: obj.year || ''
                                            });
                                        }
                                    });
                                }
                            } catch(err) {}
                        });
                    }
                });

                // Also parse DOM cards if present
                doc.querySelectorAll('.movie-card, .card, article, [data-title]').forEach(card => {
                    let title = card.getAttribute('data-title') || card.querySelector('h3, h4, .title')?.textContent?.trim();
                    let image = card.querySelector('img')?.src;
                    let video = card.getAttribute('data-video') || card.querySelector('a')?.href;
                    if (title) {
                        results.push({
                            title: title,
                            image: image || 'https://via.placeholder.com/300x450?text=No+Image',
                            video: video || '',
                            category: typeDefault,
                            type: typeDefault
                        });
                    }
                });
            } catch(e) {}
            return results;
        }

        function renderCatalog(items) {
            const grid = document.getElementById('catalogGrid');
            const emptyState = document.getElementById('emptyState');
            const countDiv = document.getElementById('resultsCount');

            grid.innerHTML = '';
            countDiv.textContent = `Showing ${items.length} items`;
            countDiv.classList.remove('hidden');

            if (items.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-dark-800 rounded-xl overflow-hidden border border-slate-700/50 hover:border-slate-500 transition-all duration-300 flex flex-col group cursor-pointer shadow-lg';
                card.onclick = () => openPlayer(item);

                card.innerHTML = `
                    <div class="relative aspect-[2/3] overflow-hidden bg-dark-900">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'">
                        <span class="absolute top-2 left-2 px-2 py-0.5 text-xs font-semibold rounded bg-black/60 backdrop-blur-md text-white uppercase tracking-wider">${item.type}</span>
                        ${item.category ? `<span class="absolute bottom-2 right-2 px-2 py-0.5 text-xs font-medium rounded bg-red-600/80 text-white">${item.category}</span>` : ''}
                    </div>
                    <div class="p-3 flex flex-col flex-grow justify-between">
                        <h4 class="font-semibold text-sm text-slate-100 group-hover:text-red-400 transition-colors line-clamp-1">${item.title}</h4>
                        ${item.year ? `<p class="text-xs text-slate-400 mt-1">${item.year}</p>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterType(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-red-600', 'text-white');
                btn.classList.add('bg-dark-700', 'text-slate-300');
            });
            event.target.classList.remove('bg-dark-700', 'text-slate-300');
            event.target.classList.add('bg-red-600', 'text-white');
            applySearchAndFilter();
        }

        function applySearchAndFilter() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = masterCatalog.filter(item => {
                let matchesType = currentFilter === 'all' || item.type === currentFilter;
                let matchesQuery = item.title.toLowerCase().includes(query) || (item.category && item.category.toLowerCase().includes(query));
                return matchesType && matchesQuery;
            });
            renderCatalog(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', applySearchAndFilter);

        function openPlayer(item) {
            const modal = document.getElementById('playerModal');
            const title = document.getElementById('modalTitle');
            const nativeVideo = document.getElementById('nativeVideo');
            const iframe = document.getElementById('modalIframe');

            title.textContent = item.title;
            modal.classList.remove('hidden');

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            nativeVideo.pause();
            nativeVideo.src = '';
            iframe.src = '';

            let streamUrl = item.video;
            if (!streamUrl) {
                nativeVideo.classList.add('hidden');
                iframe.classList.remove('hidden');
                iframe.srcdoc = `<div style="background:#000;color:#fff;display:flex;height:100vh;align-items:center;justify-content:center;font-family:sans-serif;">No stream link available for ${item.title}</div>`;
                return;
            }

            if (streamUrl.includes('mega.nz') || streamUrl.includes('trend48') || streamUrl.includes('workers.dev')) {
                nativeVideo.classList.add('hidden');
                iframe.classList.remove('hidden');
                iframe.src = streamUrl;
            } else {
                iframe.classList.add('hidden');
                nativeVideo.classList.remove('hidden');

                if (streamUrl.endsWith('.m3u8') || streamUrl.includes('m3u8')) {
                    if (Hls.isSupported()) {
                        hlsInstance = new Hls();
                        hlsInstance.loadSource(streamUrl);
                        hlsInstance.attachMedia(nativeVideo);
                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                            nativeVideo.play().catch(e => console.log(e));
                        });
                    } else if (nativeVideo.canPlayType('application/vnd.apple.mpegurl')) {
                        nativeVideo.src = streamUrl;
                        nativeVideo.play().catch(e => console.log(e));
                    }
                } else {
                    nativeVideo.src = streamUrl;
                    nativeVideo.play().catch(e => console.log(e));
                }
            }
        }

        function closeModal() {
            const modal = document.getElementById('playerModal');
            const nativeVideo = document.getElementById('nativeVideo');
            const iframe = document.getElementById('modalIframe');

            modal.classList.add('hidden');
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            nativeVideo.pause();
            nativeVideo.src = '';
            iframe.src = '';
        }

        window.addEventListener('DOMContentLoaded', loadCatalog);
    </script>
</body>
</html>
