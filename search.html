<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Search - Cloud TV</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#0f172a',
            cardbg: '#1e293b',
            accent: '#3b82f6'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-accent selection:text-white">

  <!-- Header / Navigation Bar -->
  <header class="sticky top-0 z-40 bg-darkbg/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="flex items-center space-x-2 text-xl font-bold tracking-wider text-accent">
          <i class="fa-solid fa-cloud"></i>
          <span>CLOUD TV</span>
        </a>
      </div>
      <nav class="flex items-center space-x-4">
        <a href="index.html" class="text-sm font-medium text-slate-300 hover:text-white transition">Home</a>
        <a href="movies.html" class="text-sm font-medium text-slate-300 hover:text-white transition">Catalog</a>
      </nav>
    </div>
  </header>

  <!-- Main Search Container -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-2">Repository Master Search</h1>
      <p class="text-slate-400 text-sm sm:text-base">Instantly filter across all movies, web series, live channels, and site content.</p>
    </div>

    <!-- Search Bar Input Wrapper -->
    <div class="relative max-w-3xl mx-auto mb-6">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
        <i class="fa-solid fa-magnifying-glass text-lg"></i>
      </div>
      <input 
        type="text" 
        id="searchInput" 
        autocomplete="off"
        placeholder="Type to search titles, actors, tags, or descriptions..." 
        class="w-full pl-12 pr-12 py-4 bg-cardbg border border-slate-700 rounded-2xl text-slate-100 placeholder-slate-500 shadow-xl focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent text-base transition"
      >
      <button id="clearSearchBtn" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-white hidden">
        <i class="fa-solid fa-circle-xmark text-lg"></i>
      </button>
    </div>

    <!-- Filter Pills / Categories -->
    <div id="filterChips" class="flex flex-wrap justify-center gap-2 mb-8">
      <button data-type="all" class="filter-chip px-4 py-2 rounded-full text-xs font-semibold bg-accent text-white transition shadow-sm">All Content</button>
      <button data-type="movie" class="filter-chip px-4 py-2 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Movies</button>
      <button data-type="series" class="filter-chip px-4 py-2 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Web Series</button>
      <button data-type="live" class="filter-chip px-4 py-2 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Live TV</button>
    </div>

    <!-- Results Status Info -->
    <div class="flex justify-between items-center mb-4 px-2 text-xs text-slate-400">
      <span id="resultsCount">Loading index database...</span>
      <span id="searchTime"></span>
    </div>

    <!-- Results Grid -->
    <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
      <!-- Dynamic cards will be injected here -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-20">
      <div class="text-slate-600 text-5xl mb-4">
        <i class="fa-solid fa-face-sad-tear"></i>
      </div>
      <h3 class="text-lg font-medium text-slate-300">No matching entries found</h3>
      <p class="text-slate-500 text-sm mt-1">Try checking your spelling or using different keywords.</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-darkbg border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>Cloud TV Repository Index &bull; Managed via Automated Actions</p>
  </footer>

  <!-- Search Logic Script -->
  <script>
    let searchIndex = [];
    let activeTypeFilter = 'all';

    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const resultsGrid = document.getElementById('resultsGrid');
    const resultsCount = document.getElementById('resultsCount');
    const searchTime = document.getElementById('searchTime');
    const emptyState = document.getElementById('emptyState');
    const filterChips = document.querySelectorAll('.filter-chip');

    // 1. Fetch JSON Search Index generated by Python workflow
    async function loadSearchIndex() {
      const startTime = performance.now();
      try {
        const response = await fetch('search-index.json');
        if (!response.ok) throw new Error('Failed to load search index');
        searchIndex = await response.json();
        
        const endTime = performance.now();
        searchTime.textContent = `Indexed loaded in ${(endTime - startTime).toFixed(0)}ms`;
        
        // Render initial full set
        filterAndRender();
      } catch (error) {
        console.error('Error fetching search index:', error);
        resultsCount.textContent = 'Error loading repository items. Make sure search-index.json exists.';
      }
    }

    // 2. Core Search & Filter Logic
    function filterAndRender() {
      const query = searchInput.value.toLowerCase().trim();
      const startTime = performance.now();

      // Toggle clear button visibility
      if (query.length > 0) {
        clearSearchBtn.classList.remove('hidden');
      } else {
        clearSearchBtn.classList.add('hidden');
      }

      // Filter items based on type and keyword query
      const filtered = searchIndex.filter(item => {
        const matchesType = activeTypeFilter === 'all' || item.type === activeTypeFilter;
        if (!matchesType) return false;

        if (!query) return true;

        const titleMatch = item.title && item.title.toLowerCase().includes(query);
        const descMatch = item.description && item.description.toLowerCase().includes(query);
        const categoryMatch = item.category && item.category.toLowerCase().includes(query);
        
        return titleMatch || descMatch || categoryMatch;
      });

      const endTime = performance.now();
      
      resultsCount.textContent = `Showing ${filtered.length} of ${searchIndex.length} items`;
      
      renderResults(filtered);
    }

    // 3. Render Cards to Grid
    function renderResults(items) {
      resultsGrid.innerHTML = '';

      if (items.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      const fragment = document.createDocumentFragment();

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-cardbg rounded-xl overflow-hidden border border-slate-800 hover:border-slate-600 transition flex flex-col group cursor-pointer shadow-lg';
        
        card.innerHTML = `
          <div class="relative aspect-[2/3] bg-slate-900 overflow-hidden">
            <img src="${item.poster || 'assets/placeholder.jpg'}" alt="${item.title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            <div class="absolute top-2 right-2 bg-black/70 backdrop-blur-md px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider text-slate-300">
              ${item.type || 'media'}
            </div>
          </div>
          <div class="p-3 flex flex-col flex-grow justify-between">
            <div>
              <h4 class="text-sm font-bold text-slate-200 line-clamp-1 group-hover:text-accent transition">${item.title}</h4>
              <p class="text-xs text-slate-400 line-clamp-1 mt-0.5">${item.category || ''}</p>
            </div>
            <div class="mt-3 pt-2 border-t border-slate-800/60 flex items-center justify-between">
              <span class="text-[10px] text-slate-500 uppercase">${item.source || 'Cloud TV'}</span>
              <span class="text-xs text-accent font-semibold flex items-center space-x-1 group-hover:translate-x-1 transition">
                <span>Play</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
              </span>
            </div>
          </div>
        `;

        // Click handler to launch media item (links to movies.html or triggers player)
        card.addEventListener('click', () => {
          if (item.url) {
            window.location.href = item.url;
          } else {
            // Fallback action if direct URL is present
            window.location.href = `movies.html?play=${encodeURIComponent(item.title)}`
          }
        });

        fragment.appendChild(card);
      });

      resultsGrid.appendChild(fragment);
    }

    // Event Listeners
    searchInput.addEventListener('input', filterAndRender);
    
    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      filterAndRender();
      searchInput.focus();
    });

    // Chip click handler
    filterChips.forEach(button => {
      button.addEventListener('click', (e) => {
        filterChips.forEach(btn => {
          btn.classList.remove('bg-accent', 'text-white');
          btn.classList.add('bg-slate-800', 'text-slate-300');
        });
        e.target.classList.remove('bg-slate-800', 'text-slate-300');
        e.target.classList.add('bg-accent', 'text-white');

        activeTypeFilter = e.target.getAttribute('data-type');
        filterAndRender();
      });
    });

    // Initialize on load
    loadSearchIndex();
  </script>
</body>
</html>
