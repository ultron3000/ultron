<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>X-Men Cinematic Universe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Explore the complete X-Men cinematic universe with all movies across all timelines in one place.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #f0131e;
      --secondary: #ffcc00;
      --dark-bg: #0a0c10;
      --card-bg: #121620;
      --light: #f5f7fa;
      --accent-blue: #0066cc;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark-bg);
      color: var(--light);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

    header {
      background: linear-gradient(180deg, rgba(20, 24, 36, 0.95) 0%, rgba(10, 12, 16, 1) 100%);
      padding: 40px 0 20px 0;
      border-bottom: 2px solid rgba(255, 204, 0, 0.15);
      position: relative;
      z-index: 10;
      text-align: center;
    }

    .x-logo {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: clamp(2.2rem, 6vw, 4rem);
      color: #fff;
      letter-spacing: 4px;
      line-height: 1;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    
    .x-logo span {
      color: var(--secondary);
      text-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
    }

    .subtitle { 
      font-size: clamp(0.9rem, 3vw, 1.1rem); 
      color: #a0aec0; 
      font-weight: 400;
      max-width: 700px;
      margin: 0 auto;
      line-height: 1.5;
    }

    .timeline-badge {
      display: inline-block;
      background: rgba(240, 19, 30, 0.15);
      border: 1px solid var(--primary);
      color: #ff888c;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* TIMELINE QUICK NAV FILTER BUTTONS */
    .timeline-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0 10px 0;
      justify-content: center;
    }

    .filter-tab {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #a0aec0;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-tab:hover, .filter-tab.active {
      background: var(--secondary);
      color: #000;
      border-color: var(--secondary);
      box-shadow: 0 4px 12px rgba(255, 204, 0, 0.2);
    }

    .controls { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 15px; 
      margin: 20px 0; 
      align-items: center; 
      justify-content: space-between; 
    }

    .search-container { 
      position: relative; 
      flex-grow: 1; 
      max-width: 500px; 
    }
    
    #searchBar { 
      width: 100%; 
      padding: 14px 15px 14px 45px; 
      font-size: 1rem; 
      border-radius: 8px; 
      border: 1px solid rgba(255,255,255,0.15); 
      background: var(--card-bg); 
      color: var(--light); 
      transition: var(--transition); 
    }
    
    #searchBar:focus { 
      outline: none; 
      border-color: var(--secondary); 
      box-shadow: 0 0 10px rgba(255,204,0,0.2); 
    }
    
    .search-icon { 
      position: absolute; 
      left: 15px; 
      top: 50%; 
      transform: translateY(-50%); 
      color: #718096; 
    }

    .stats-counter {
      font-size: 0.95rem;
      color: #a0aec0;
      font-weight: 600;
    }

    /* UNIFIED GLANCE GRID VIEW */
    .movies {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 10px 0;
    }

    .movie {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
    }
    
    .movie:hover { 
      transform: translateY(-5px); 
      border-color: var(--secondary);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
    }
    
    .poster-container {
      position: relative;
      width: 100%;
      padding-top: 145%;
      overflow: hidden;
      background: #1a202c;
    }

    .movie img { 
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%; 
      object-fit: cover; 
      transition: var(--transition); 
    }
    
    .movie:hover img {
      transform: scale(1.05);
    }

    .movie-info {
      padding: 12px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .movie-title { 
      font-weight: 700; 
      color: var(--light); 
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 5px;
    }

    .movie-meta {
      font-size: 0.8rem;
      color: #a0aec0;
      font-weight: 600;
    }

    /* --- RESPONSIVE MODAL SYSTEM --- */
    #playback-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 12, 0.95);
      padding: 15px;
    }
    
    #playback-modal .modal-card {
      width: 100%;
      max-width: 1000px;
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
    }

    #modal-player {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
    }
    
    #modal-player video, #modal-player iframe { 
      position: absolute; top:0; left:0; width:100%; height:100%; border:0; background:#000; 
    }

    .progress-bar { height: 4px; background: rgba(255,255,255,0.1); width:100%; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--secondary); }

    /* AUTO ALIGNING CONTROLS CONTAINER CONTAINER */
    .modal-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      background: #0f121a;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-wrap: wrap;
    }

    .modal-controls .btn {
      background: rgba(255,255,255,0.06);
      color: var(--light);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
      min-width: 90px;
    }

    .modal-controls .btn:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }
    
    .modal-controls .btn.btn-primary {
      background: var(--secondary);
      color: #000;
      border-color: var(--secondary);
    }
    
    .modal-controls .btn.btn-primary:hover { background: #e6b800; }
    
    .modal-controls .btn.btn-danger {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .modal-controls .btn.btn-danger:hover { background: #cc0f18; }

    .modal-meta { 
      padding: 20px; 
      display: flex; 
      flex-direction: column;
      gap: 12px;
    }
    
    .modal-meta h3 { margin:0; font-size: 1.5rem; font-family: 'Oswald', sans-serif; color: #fff; letter-spacing: 0.5px; }
    .modal-meta p { font-size: 0.9rem; color: #a0aec0; line-height: 1.5; margin-top: 4px; }
    
    .watchlist-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 5px;
    }

    .watchlist-checkbox { position: relative; display: inline-block; width: 22px; height: 22px; }
    .watchlist-checkbox input { opacity:0; width:0; height:0; }
    .watchlist-checkbox .checkmark { position:absolute; top:0; left:0; height:22px; width:22px; background:rgba(255,255,255,0.05); border:2px solid #4a5568; border-radius:6px; transition: all 0.2s; cursor:pointer; }
    .watchlist-checkbox input:checked ~ .checkmark { background: var(--primary); border-color: var(--primary); }
    .watchlist-checkbox .checkmark:after { content:''; position:absolute; display:none; }
    .watchlist-checkbox input:checked ~ .checkmark:after { display:block; left:6px; top:2px; width:6px; height:11px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }

    #loading-spinner {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(5,7,12,0.8); z-index: 10000;
    }
    #loading-spinner .spinner {
      width:50px; height:50px; border-radius:50%; border-top:4px solid var(--secondary); border-left:4px solid transparent; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile Adaptations */
    @media (max-width: 768px) {
      .container { padding: 15px; }
      .controls { flex-direction: column; align-items: stretch; }
      .search-container { max-width: 100%; }
      .stats-counter { text-align: center; }
      .movies { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
      .modal-controls { padding: 8px; gap: 6px; }
      .modal-controls .btn { padding: 8px 12px; font-size: 0.8rem; min-width: calc(33.33% - 6px); flex-grow: 1; }
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--dark-bg); }
    ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--secondary); }

    video:fullscreen, iframe:fullscreen { object-fit: contain !important; background: #000; }
  
    /* X-MEN cinematic refresh: scoped overrides keep the original catalogue/player intact */
    header.x-header{padding:12px 0 10px;text-align:left;background:linear-gradient(180deg,#111722 0%,#0a0c10 100%);border-bottom:1px solid rgba(240,19,30,.35)}
    .x-header .container{padding-top:0;padding-bottom:0}
    .x-header-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px}
    .x-logo{display:flex;align-items:center;gap:8px;margin:0;font-size:1.35rem;letter-spacing:1px}
    .x-mark{display:inline-grid;place-items:center;width:34px;height:34px;background:linear-gradient(145deg,#f0131e,#8f0710);clip-path:polygon(16% 0,84% 0,100% 16%,100% 84%,84% 100%,16% 100%,0 84%,0 16%);font-size:1.35rem;color:#fff;text-shadow:0 2px 8px #000}
    .x-word{color:#fff;font-size:1.1rem;letter-spacing:2px}
    .x-header-actions{display:flex;gap:7px}
    .header-icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);color:#f5f7fa;display:grid;place-items:center;cursor:pointer}
    .header-icon-btn:hover{border-color:var(--primary);background:rgba(240,19,30,.15)}
    .timeline-filters{display:flex;flex-wrap:nowrap;justify-content:flex-start;gap:8px;margin:10px 0 0;padding:2px 1px 6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
    .timeline-filters::-webkit-scrollbar{display:none}
    .filter-tab{flex:0 0 auto;white-space:nowrap;scroll-snap-align:start;padding:8px 13px}
    .x-hero{position:relative;isolation:isolate;min-height:390px;overflow:hidden;background:#080b12;border-bottom:1px solid rgba(240,19,30,.2)}
    .x-hero-backdrop{position:absolute;inset:-18px;background-position:center 28%;background-size:cover;opacity:.58;filter:blur(1px);transform:scale(1.04);transition:background-image .35s ease}
    .x-hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,12,.97) 0%,rgba(5,7,12,.84) 38%,rgba(5,7,12,.40) 72%,rgba(5,7,12,.68) 100%),linear-gradient(0deg,#0a0c10 0%,transparent 48%)}
    .x-hero-inner{position:relative;z-index:1;display:flex;align-items:center;gap:30px;min-height:390px;padding-top:25px;padding-bottom:25px}
    .x-hero-poster-wrap{flex:0 0 clamp(150px,19vw,225px);width:clamp(150px,19vw,225px);aspect-ratio:2/3;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.2);box-shadow:0 18px 45px rgba(0,0,0,.55)}
    .x-hero-poster{display:block;width:100%;height:100%;object-fit:cover}
    .x-hero-copy{max-width:680px;min-width:0}
    .x-hero-kicker{display:flex;align-items:center;gap:9px;color:#ff777d;font-size:.72rem;font-weight:800;letter-spacing:2.5px}
    .x-kicker-line{width:26px;height:2px;background:var(--primary)}
    .x-hero-tag{margin-top:13px;color:#ffcc00;font-size:.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
    .x-hero-copy h1{font-family:'Oswald',sans-serif;font-size:clamp(2rem,4.4vw,3.7rem);line-height:1.05;color:#fff;margin:7px 0 10px}
    .x-hero-copy p{max-width:620px;color:#d0d5df;font-size:.91rem;line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .x-hero-meta{margin-top:11px;color:#aeb7c6;font-size:.8rem;font-weight:700}
    .x-hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .x-hero-actions button{min-height:40px;padding:0 17px;border-radius:8px;font-weight:800;font-size:.82rem;cursor:pointer}
    .x-watch-btn{border:1px solid var(--primary);background:var(--primary);color:#fff}
    .x-shuffle-btn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}
    .x-hero-progress{width:110px;height:3px;margin-top:19px;background:rgba(255,255,255,.2);overflow:hidden;border-radius:4px}
    .x-hero-progress span{display:block;width:0;height:100%;background:var(--primary)}
    .x-hero-arrow{position:absolute;z-index:2;top:50%;transform:translateY(-50%);width:34px;height:48px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.38);color:#fff;border-radius:8px;cursor:pointer}
    .x-hero-prev{left:10px}.x-hero-next{right:10px}
    .controls{margin:12px 0 8px;gap:10px}
    .movies{grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;padding:6px 0}
    body.x-grid-compact .movies{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
    body.x-grid-large .movies{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
    .movie{min-width:0}
    .poster-container{padding-top:145%}
    body.light-theme{--dark-bg:#eef1f6;--card-bg:#fff;--light:#18202d;color:#18202d;background:var(--dark-bg)}
    body.light-theme header.x-header{background:linear-gradient(180deg,#fff,#edf0f5)}
    body.light-theme .x-header .x-word{color:#18202d}
    body.light-theme .header-icon-btn{color:#18202d;background:#fff;border-color:#d7dce5}
    body.light-theme .filter-tab{color:#424b5a;background:#fff;border-color:#d7dce5}
    body.light-theme .filter-tab.active{background:var(--secondary);color:#111}
    body.light-theme .controls .stats-counter{color:#596273}
    @media(max-width:1000px){.movies{grid-template-columns:repeat(4,minmax(0,1fr))}body.x-grid-compact .movies{grid-template-columns:repeat(5,minmax(0,1fr))}body.x-grid-large .movies{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:680px){
      .x-header .container{padding-left:14px;padding-right:14px}
      .x-header-top{min-height:38px}
      .x-logo{font-size:1.1rem}.x-mark{width:30px;height:30px;font-size:1.15rem}
      .header-icon-btn{width:34px;height:34px}
      .timeline-filters{margin-top:8px;gap:7px}
      .filter-tab{font-size:.72rem;padding:7px 11px}
      .x-hero{min-height:260px}
      .x-hero-inner{min-height:260px;gap:13px;padding:17px 14px}
      .x-hero-poster-wrap{flex-basis:112px;width:112px;border-radius:8px}
      .x-hero-shade{background:linear-gradient(90deg,rgba(5,7,12,.93),rgba(5,7,12,.72) 68%,rgba(5,7,12,.58)),linear-gradient(0deg,#0a0c10,transparent 60%)}
      .x-hero-kicker{font-size:.58rem;letter-spacing:1.4px}
      .x-hero-tag{font-size:.6rem;margin-top:7px}
      .x-hero-copy h1{font-size:1.45rem;margin:5px 0 6px}
      .x-hero-copy p{font-size:.68rem;line-height:1.42;-webkit-line-clamp:3}
      .x-hero-meta{font-size:.64rem;margin-top:6px}
      .x-hero-actions{gap:6px;margin-top:10px}
      .x-hero-actions button{min-height:32px;padding:0 9px;font-size:.66rem}
      .x-hero-progress{margin-top:10px;width:76px}
      .x-hero-arrow{width:25px;height:36px;font-size:.7rem}
      .x-hero-prev{left:3px}.x-hero-next{right:3px}
      .container{padding:12px}
      .controls{margin:9px 0 5px;gap:7px}
      #searchBar{padding:11px 12px 11px 39px;font-size:.88rem}
      .stats-counter{text-align:left;font-size:.72rem}
      .movies{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:4px 0}
      body.x-grid-compact .movies{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
      body.x-grid-large .movies{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
      .movie-info{padding:8px}.movie-title{font-size:.78rem}.movie-meta{font-size:.66rem}
      .movie:hover{transform:none}
      #playback-modal{padding:8px}
      #playback-modal .modal-card{border-radius:10px;max-height:94dvh;overflow:auto}
      #modal-player{padding-bottom:56.25%}
      .modal-controls{gap:5px;padding:8px}
      .modal-controls .btn{min-width:0;flex:1 1 calc(33.333% - 5px);padding:8px 5px;font-size:.72rem}
      .modal-meta{padding:12px}
    }
    @media(max-width:360px){.x-hero-poster-wrap{flex-basis:96px;width:96px}.x-hero-copy h1{font-size:1.22rem}.x-hero-copy p{-webkit-line-clamp:2}.x-hero-actions button{font-size:.6rem;padding:0 7px}}

  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js"></script>
</head>
<body>

<header class="x-header">
  <div class="container">
    <div class="x-header-top">
      <div class="x-logo" aria-label="X-Men"><span class="x-mark">X</span><span class="x-word">MEN</span></div>
      <div class="x-header-actions">
        <button class="header-icon-btn" id="themeToggle" type="button" aria-label="Toggle light and dark theme" title="Toggle theme"><i class="fas fa-sun"></i></button>
        <button class="header-icon-btn" id="viewToggle" type="button" aria-label="Change movie grid layout" title="Change grid layout"><i class="fas fa-grip"></i></button>
      </div>
    </div>
    <div class="timeline-filters" id="timelineFilters" aria-label="Filter X-Men timelines">
      <button class="filter-tab active" data-timeline="all" type="button">All Timelines</button>
      <button class="filter-tab" data-timeline="Original Trilogy" type="button">Original Trilogy</button>
      <button class="filter-tab" data-timeline="The Wolverine Trilogy" type="button">Wolverine Arc</button>
      <button class="filter-tab" data-timeline="Prequel & Revised Timeline" type="button">Revised Prequels</button>
      <button class="filter-tab" data-timeline="Deadpool & Spin-Offs" type="button">Deadpool / Spin-offs</button>
    </div>
  </div>
</header>


<section class="x-hero" id="xHero" aria-label="Featured X-Men movie">
  <div class="x-hero-backdrop" id="xHeroBackdrop"></div>
  <div class="x-hero-shade"></div>
  <div class="x-hero-inner container">
    <div class="x-hero-poster-wrap"><img id="xHeroPoster" class="x-hero-poster" src="" alt="Featured X-Men movie poster"></div>
    <div class="x-hero-copy">
      <div class="x-hero-kicker"><span class="x-kicker-line"></span> THE MUTANT SAGA</div>
      <div class="x-hero-tag" id="xHeroTimeline">X-MEN UNIVERSE</div>
      <h1 id="xHeroTitle">X-Men</h1>
      <p id="xHeroDescription"></p>
      <div class="x-hero-meta" id="xHeroMeta"></div>
      <div class="x-hero-actions">
        <button class="x-watch-btn" id="xHeroWatch" type="button"><i class="fas fa-play"></i> Watch now</button>
        <button class="x-shuffle-btn" id="xHeroShuffle" type="button"><i class="fas fa-random"></i> Surprise me</button>
      </div>
      <div class="x-hero-progress"><span id="xHeroProgress"></span></div>
    </div>
  </div>
  <button class="x-hero-arrow x-hero-prev" id="xHeroPrev" type="button" aria-label="Previous featured movie"><i class="fas fa-chevron-left"></i></button>
  <button class="x-hero-arrow x-hero-next" id="xHeroNext" type="button" aria-label="Next featured movie"><i class="fas fa-chevron-right"></i></button>
</section>

<main class="container">
  <div class="controls">
    <div class="search-container">
      <i class="fas fa-search search-icon"></i>
      <input id="searchBar" placeholder="Search X-Men movies..." type="text"/>
    </div>
    <div class="stats-counter" id="movieCounter">Showing all movies</div>
  </div>

  <div class="movies" id="movies-container"></div>
</main>

/* Featured movie hero: uses the existing movies array and original modal player. */
let xHeroIndex = 0;
const xHeroElements = {
  backdrop: document.getElementById('xHeroBackdrop'),
  poster: document.getElementById('xHeroPoster'),
  title: document.getElementById('xHeroTitle'),
  description: document.getElementById('xHeroDescription'),
  timeline: document.getElementById('xHeroTimeline'),
  meta: document.getElementById('xHeroMeta'),
  progress: document.getElementById('xHeroProgress')
};
function renderXHero() {
  const movie = movies[xHeroIndex];
  if (!movie) return;
  xHeroElements.backdrop.style.backgroundImage = 'url("' + movie.image + '")';
  xHeroElements.poster.src = movie.image;
  xHeroElements.poster.alt = movie.title + ' poster';
  xHeroElements.title.textContent = movie.title;
  xHeroElements.description.textContent = movie.description || '';
  xHeroElements.timeline.textContent = movie.timeline || 'X-Men Universe';
  xHeroElements.meta.textContent = movie.year + '  •  ' + movie.timeline;
  xHeroElements.progress.style.width = '0%';
  requestAnimationFrame(() => { xHeroElements.progress.style.transition = 'width 9s linear'; xHeroElements.progress.style.width = '100%'; });
}
function stepXHero(direction) {
  xHeroIndex = (xHeroIndex + direction + movies.length) % movies.length;
  renderXHero();
}
document.getElementById('xHeroWatch').addEventListener('click', () => {
  const movie = movies[xHeroIndex];
  const originalIndex = movies.indexOf(movie);
  playInModal(movie.title, movie.video, movie, originalIndex);
});
document.getElementById('xHeroShuffle').addEventListener('click', () => {
  if (movies.length > 1) {
    let next = xHeroIndex;
    while (next === xHeroIndex) next = Math.floor(Math.random() * movies.length);
    xHeroIndex = next;
  }
  renderXHero();
});
document.getElementById('xHeroPrev').addEventListener('click', () => stepXHero(-1));
document.getElementById('xHeroNext').addEventListener('click', () => stepXHero(1));
renderXHero();
setInterval(() => stepXHero(1), 9000);

/* Compact header actions and three responsive poster-grid densities. */
document.getElementById('themeToggle').addEventListener('click', function() {
  document.body.classList.toggle('light-theme');
  const icon = this.querySelector('i');
  if (icon) { icon.classList.toggle('fa-sun'); icon.classList.toggle('fa-moon'); }
});
const xGridModes = ['', 'x-grid-compact', 'x-grid-large'];
let xGridModeIndex = 0;
document.getElementById('viewToggle').addEventListener('click', function() {
  document.body.classList.remove('x-grid-compact', 'x-grid-large');
  xGridModeIndex = (xGridModeIndex + 1) % xGridModes.length;
  if (xGridModes[xGridModeIndex]) document.body.classList.add(xGridModes[xGridModeIndex]);
  const icon = this.querySelector('i');
  if (icon) {
    icon.className = xGridModeIndex === 1 ? 'fas fa-grip' : xGridModeIndex === 2 ? 'fas fa-table-cells-large' : 'fas fa-th-large';
  }
  this.setAttribute('aria-label', 'Grid layout mode ' + (xGridModeIndex + 1));
});

const moviesContainer = document.getElementById('movies-container');
let selectedTimeline = "all";

/* Master Comprehensive Row Render Engine */
function renderGlanceMatrix() {
  moviesContainer.innerHTML = "";
  
  movies.forEach((movie, index) => {
    const div = document.createElement('div');
    div.className = 'movie';
    div.dataset.timeline = movie.timeline;
    div.dataset.title = movie.title.toLowerCase();
    
    div.innerHTML = `
      <div class="poster-container">
        <img src="${movie.image}" alt="${movie.title}" loading="lazy">
      </div>
      <div class="movie-info">
        <div class="movie-title">${movie.title}</div>
        <div class="movie-meta">${movie.year} — <span style="color:#e6b800; font-size:0.75rem;">${movie.timeline}</span></div>
      </div>
    `;
    
    div.addEventListener('click', () => {
      playInModal(movie.title, movie.video, movie, index);
    });
    moviesContainer.appendChild(div);
  });
  updateCounters();
}

/* Dynamic Live Filter Update Handler */
function runDisplayFilters() {
  const searchTerm = document.getElementById('searchBar').value.toLowerCase();
  let matches = 0;

  document.querySelectorAll('.movie').forEach(div => {
    const titleMatch = div.dataset.title.includes(searchTerm);
    const timelineMatch = (selectedTimeline === "all" || div.dataset.timeline === selectedTimeline);

    if (titleMatch && timelineMatch) {
      div.style.display = 'flex';
      matches++;
    } else {
      div.style.display = 'none';
    }
  });
  updateCounters(matches, searchTerm !== "all" || selectedTimeline !== "all");
}

function updateCounters(overrideCount, activeFilters) {
  const counter = document.getElementById('movieCounter');
  if (overrideCount !== undefined) {
    counter.textContent = `Found ${overrideCount} matching entries`;
  } else {
    counter.textContent = `Showing all ${movies.length} movies at a glance`;
  }
}

/* Event Hooking for Buttons & Inputs */
document.getElementById('timelineFilters').addEventListener('click', (e) => {
  if (!e.target.classList.contains('filter-tab')) return;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  selectedTimeline = e.target.dataset.timeline;
  runDisplayFilters();
});

document.getElementById('searchBar').addEventListener('input', runDisplayFilters);

/* ----------------------------------------------------
   HAWKEYE PLAYER SCRIPT WITH REORDERED ACTION ITEMS
   ---------------------------------------------------- */
const playbackModal = document.getElementById('playback-modal');
const modalTitle = document.getElementById('modal-title');
const modalDesc = document.getElementById('modal-desc');
const watchlistCheckbox = document.getElementById('watchlist-checkbox');
const progressBarFill = document.getElementById('progress-bar-fill');
const loadingSpinner = document.getElementById('loading-spinner');
const modalPlayer = document.getElementById('modal-player');

let currentHls = null;
let currentMovieIndex = null;

function getModalVideo() { return document.getElementById('modal-video'); }

function isHls(u) {
  if (!u) return false;
  return (u.includes('.m3u8') || u.includes('index-') || u.includes('manifest') || u.includes('master.m3u8'));
}
function isMP4(u) { return /\.mp4($|\?)/i.test(u || ''); }
function isYouTube(u) { return !!(u && (u.includes('youtube.com') || u.includes('youtu.be') || u.includes('/embed/'))); }

function resetPlayerContainer() {
  if (currentHls) { try { currentHls.destroy(); } catch (e) {} currentHls = null; }
  modalPlayer.innerHTML = `<video id="modal-video" controls playsinline>Your browser does not support playback.</video>`;
}

function closeModalHandler() {
  const videoEl = getModalVideo();
  if (currentHls) { try { currentHls.destroy(); } catch(e) {} currentHls = null; }
  if (videoEl) { try { videoEl.pause(); } catch(e) {} }
  resetPlayerContainer();
  playbackModal.style.display = 'none';
  document.body.style.overflow = '';
  currentMovieIndex = null;
  progressBarFill.style.width = '0%';
}

function playInModal(title, url, movie = {}, episodeIndex = 0) {
  currentMovieIndex = episodeIndex;
  modalTitle.textContent = movie.title || title;
  modalDesc.textContent = movie.description || "No chronological timeline breakdown provided for this selection.";
  watchlistCheckbox.checked = !!movie.inWatchlist;
  progressBarFill.style.width = '0%';

  resetPlayerContainer();
  loadingSpinner.style.display = 'flex';

  if (!url || url === "00") {
    modalPlayer.innerHTML = `<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;width:90%;">
      <i class="fas fa-exclamation-triangle" style="font-size:2rem;color:var(--secondary);margin-bottom:10px;"></i>
      <p>No streaming mirror configured for this title yet.</p>
    </div>`;
    playbackModal.style.display = 'flex';
    loadingSpinner.style.display = 'none';
    return;
  }

  if (url.includes('mega.nz') || url.includes('streamtape.com') || url.includes('dood')) {
    modalPlayer.innerHTML = `<iframe src="${url}" allowfullscreen allowtransparency allow="autoplay" scrolling="no" frameborder="0"></iframe>`;
    playbackModal.style.display = 'flex';
    loadingSpinner.style.display = 'none';
    return;
  }

  if (isYouTube(url)) {
    let embedUrl = url;
    if (url.includes('watch?v=')) {
      embedUrl = `https://www.youtube.com/embed/${new URLSearchParams(url.split('?')[1]).get('v')}`;
    }
    modalPlayer.innerHTML = `<iframe src="${embedUrl}?autoplay=1" allowfullscreen allow="autoplay" frameborder="0"></iframe>`;
    playbackModal.style.display = 'flex';
    loadingSpinner.style.display = 'none';
    return;
  }

  const videoEl = getModalVideo();
  if (isHls(url)) {
    if (Hls.isSupported()) {
      currentHls = new Hls();
      currentHls.loadSource(url);
      currentHls.attachMedia(videoEl);
      currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
        playbackModal.style.display = 'flex';
        loadingSpinner.style.display = 'none';
        videoEl.play().catch(()=>{});
      });
    } else {
      videoEl.src = url;
      playbackModal.style.display = 'flex';
      loadingSpinner.style.display = 'none';
      videoEl.play().catch(()=>{});
    }
    attachVideoListeners();
    return;
  }

  if (isMP4(url)) {
    videoEl.src = url;
    playbackModal.style.display = 'flex';
    loadingSpinner.style.display = 'none';
    videoEl.play().catch(()=>{});
    attachVideoListeners();
    return;
  }
}

function attachVideoListeners() {
  const videoEl = getModalVideo();
  if (!videoEl) return;
  videoEl.addEventListener('timeupdate', () => {
    if (!videoEl.duration) return;
    progressBarFill.style.width = ((videoEl.currentTime / videoEl.duration) * 100) + '%';
  });
}

/* Event Control Hooks */
document.getElementById('playPauseBtn').addEventListener('click', function() {
  const video = getModalVideo();
  if (!video || !video.play) return;
  if (video.paused) {
    video.play();
    this.innerHTML = '<i class="fas fa-pause"></i> Pause';
  } else {
    video.pause();
    this.innerHTML = '<i class="fas fa-play"></i> Play';
  }
});

document.getElementById('muteBtn').addEventListener('click', function() {
  const video = getModalVideo();
  if (!video) return;
  video.muted = !video.muted;
  this.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i> Unmute' : '<i class="fas fa-volume-up"></i> Mute';
});

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  const video = getModalVideo();
  if (!video) return;
  if (video.requestFullscreen) video.requestFullscreen();
  else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
});

document.getElementById('prevBtn').addEventListener('click', () => {
  if (currentMovieIndex > 0) {
    const prev = movies[currentMovieIndex - 1];
    playInModal(prev.title, prev.video, prev, currentMovieIndex - 1);
  }
});

document.getElementById('nextBtn').addEventListener('click', () => {
  if (currentMovieIndex < movies.length - 1) {
    const next = movies[currentMovieIndex + 1];
    playInModal(next.title, next.video, next, currentMovieIndex + 1);
  }
});

watchlistCheckbox.addEventListener('change', function() {
  if (currentMovieIndex !== null) movies[currentMovieIndex].inWatchlist = this.checked;
});

document.getElementById('closeBtn').addEventListener('click', closeModalHandler);
playbackModal.addEventListener('click', function(e) { if (e.target === this) closeModalHandler(); });

/* Load script lifecycle initiation */
renderGlanceMatrix();
</script>

<script>
/* =========================

const isMobile =
    /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);

   Disable DevTools

DisableDevtool({

    disableCopy: true,
    disableCut: true,
    disablePaste: true,

    /* FIXED */

    interval: 100,

    ondevtoolopen: function () {

            document.body.innerHTML = "";
            window.location.replace("about:blank");
        }
    }
});

/* =========================
   Block View Source Shortcuts
========================= */
document.addEventListener("keydown", function (e) {

    // F12
    if (e.key === "F12") {
        e.preventDefault();
        return false;
    }

    // Ctrl+U
    if (e.ctrlKey && e.key.toLowerCase() === "u") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "i") {
        e.preventDefault();
        return false;
    }

    // Ctrl+Shift+J
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "j") {
        e.preventDefault();
        return false;
    }

    // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "c") {
        e.preventDefault();
        return false;
    }

    // Ctrl+S
    if (e.ctrlKey && e.key.toLowerCase() === "s") {
        e.preventDefault();
        return false;
    }

    // Ctrl+P
    if (e.ctrlKey && e.key.toLowerCase() === "p") {
        e.preventDefault();
        return false;
    }

    // Ctrl+A
    if (e.ctrlKey && e.key.toLowerCase() === "a") {
        e.preventDefault();
        return false;
    }

    // Ctrl+C
    if (e.ctrlKey && e.key.toLowerCase() === "c") {
        e.preventDefault();
        return false;
    }

    // Ctrl+X
    if (e.ctrlKey && e.key.toLowerCase() === "x") {
        e.preventDefault();
        return false;
    }

    // Ctrl+V
    if (e.ctrlKey && e.key.toLowerCase() === "v") {
        e.preventDefault();
        return false;
    }
});

/* =========================
   Disable Right Click
========================= */
document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Dragging
========================= */
document.addEventListener("dragstart", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Selection
========================= */
document.addEventListener("selectstart", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Copy Actions
========================= */
["copy", "cut", "paste"].forEach(function(evt) {

    document.addEventListener(evt, function(e) {
        e.preventDefault();
    });

});

/* =========================
   Detect DevTools Window
   (Desktop ONLY - FIXED)
========================= */
if (!isMobile) {

    setInterval(function () {

        const widthThreshold =
            window.outerWidth - window.innerWidth > 220;

        const heightThreshold =
            window.outerHeight - window.innerHeight > 220;

        if (widthThreshold || heightThreshold) {

            document.body.innerHTML = "";
            window.location.replace("about:blank");
        }

    }, 1500);

}

/* =========================
   Disable Console
========================= */
(function () {

    console.clear();

    function block() {
        return false;
    }

    console.log = block;
    console.warn = block;
    console.error = block;
    console.info = block;
    console.debug = block;
    console.table = block;

})();

/* =========================
   Block "view-source:"
========================= */
if (window.location.href.startsWith("view-source:")) {

    document.body.innerHTML = "";
    window.location.replace("about:blank");

}

/* =========================
   Prevent iframe inspection
========================= */
if (window.top !== window.self) {

    try {
        window.top.location = window.self.location;
    } catch (e) {}

}
</script>

<style>
html, body {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    overflow-x: hidden;
}

/* Disable image dragging */
img {
    pointer-events: none;
    -webkit-user-drag: none;
}

/* Hide selection */
::selection {
    background: transparent;
}
</style>
