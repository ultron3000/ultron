<style>

    :root {
      --primary: #ef4444;
      --primary-glow: rgba(239, 68, 68, 0.4);
      --secondary: #0f172a;
      --accent: #38bdf8;
      --muted: #94a3b8;
      --bg-dark: #070a12;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(239, 68, 68, 0.08) 0%, transparent 65%),
        linear-gradient(to bottom, rgba(7, 10, 18, 0.85), rgba(7, 10, 18, 0.98));
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
    .font-rajdhani { font-family: 'Rajdhani', sans-serif; }
    
    /* Movie Card Styling */
    .movie-card {
      transition: transform 0.2s ease, border-color 0.2s ease;
      transform-origin: center;
      border: 1px solid rgba(239, 68, 68, 0.2);
      background: #0f172a;
      content-visibility: auto;
      contain-intrinsic-size: 320px;
    }
    
    .movie-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.25);
    }

    .crimson-gradient-text {
      background: linear-gradient(135deg, #ffffff 0%, #fca5a5 40%, #ef4444 80%, #b91c1c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .movie-poster {
      aspect-ratio: 2/3;
      transition: transform 0.3s ease;
    }
    
    .movie-card:hover .movie-poster {
      transform: scale(1.03);
    }
    
    /* Category Filter Buttons - Scrollable on mobile */
    .category-scroll-container {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: thin;
      scrollbar-color: #991b1b #070a12;
    }

    .category-scroll-container::-webkit-scrollbar {
      height: 4px;
    }

    .category-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #94a3b8;
      transition: all 0.2s ease;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }
    
    .category-btn:hover {
      border-color: var(--primary);
      color: #ffffff;
    }

    .category-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #000000;
      font-weight: 700;
    }
    
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070a12; }
    ::-webkit-scrollbar-thumb { background: #991b1b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #ef4444; }
    
    /* Responsive Modal Setup */
    .modal-backdrop { 
      position: fixed; 
      inset: 0; 
      background: rgba(7, 10, 18, 0.95); 
      display: none; 
      align-items: center; 
      justify-content: center; 
      z-index: 9999; 
      padding: 0;
    }
    .modal-backdrop.active { display: flex; }
    .modal-card { 
      width: 100%;
      height: 100%;
      max-width: 980px;
      max-height: 90vh;
      border-radius: 0;
      overflow: hidden;
      background: #0f172a;
      border: 1px solid rgba(239, 68, 68, 0.4);
      display: flex;
      flex-direction: column;
    }
    .player-wrapper { 
      position: relative;
      width: 100%;
      height: 350px;
      min-height: 250px;
      background: #000;
      flex-grow: 1;
    }
    #topCloseBtn { 
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 20;
      background: rgba(0,0,0,0.8);
      color: var(--primary);
      border: 1px solid rgba(239, 68, 68, 0.4);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .player-wrapper video, 
    .player-wrapper iframe { 
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .player-meta { 
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      color: #ddd;
      background: #0f172a;
      border-top: 1px solid rgba(239, 68, 68, 0.25);
    }
    .player-meta .meta-left { width: 100%; }
    .player-meta h3 { 
      margin: 0;
      font-size: 1.125rem;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
    }
    .player-meta p { 
      margin: 4px 0 0 0;
      color: var(--muted);
      font-size: 0.85rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .controls-row { 
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: center;
    }

    .btn {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      flex: 1;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      text-decoration: none;
    }
    .btn:hover { 
      background: var(--primary);
      color: #000;
    }

    @media (min-width: 768px) {
      .modal-card {
        width: 92%;
        height: auto;
        border-radius: 8px;
        max-height: 85vh;
      }
      .player-wrapper {
        height: 55vh !important;
        position: relative !important;
      }
      .player-meta {
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
      }
      .player-meta .meta-left { max-width: 55%; }
      .controls-row { flex-wrap: nowrap !important; justify-content: flex-end !important; }
      .btn { flex: unset !important; min-width: 75px !important; }

    function normalizeCategory(cat) {
      if (!cat) return "Action & Ops";

      if (c.includes("sniper")) return "Sniper & Tactical";
      if (c.includes("espionage") || c.includes("intel") || c.includes("covert")) return "Espionage & Intel";
      if (c.includes("thriller") || c.includes("psychological")) return "Psychological & Thriller";
      if (c.includes("sci-fi") || c.includes("fantasy") || c.includes("horror")) return "Sci-Fi & Fantasy";
      if (c.includes("action") || c.includes("mercenary") || c.includes("tactical") || c.includes("vigilante") || c.includes("submarine")) return "Action & Ops";

    ];
 
    // Standardize category labels for all movies
    movies.forEach(m => {
      m.normCategory = normalizeCategory(m.category);
    });

    let activeCategory = "All";
    let searchQuery = "";

    const container = document.getElementById('movies');
    const searchInput = document.getElementById('searchInput');
    const categoryContainer = document.getElementById('categoryContainer');

    function buildCategoryFilters() {
      const categories = ["All", "Action & Ops", "Espionage & Intel", "Sniper & Tactical", "Psychological & Thriller", "Sci-Fi & Fantasy"];
      categoryContainer.innerHTML = '';

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `category-btn text-xs font-rajdhani px-3 py-1.5 rounded-md uppercase tracking-wider ${cat === activeCategory ? 'active' : ''}`;
        btn.textContent = cat;
        btn.addEventListener('click', () => {
          activeCategory = cat;
          document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyFilters();
        });
        categoryContainer.appendChild(btn);
      });
    }

    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    function applyFilters() {
      const filtered = movies.filter(movie => {
        const matchesCat = activeCategory === "All" || movie.normCategory === activeCategory;
        const matchesSearch = !searchQuery || 
                              movie.title.toLowerCase().includes(searchQuery) || 
                              (movie.description && movie.description.toLowerCase().includes(searchQuery));
        return matchesCat && matchesSearch;
      });

      renderMovies(filtered);
    }

    searchInput.addEventListener('input', debounce((e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      applyFilters();
    }, 150));

    /******************************
     * DOM Refs for Modal Controls
     ******************************/
    const playbackModal = document.getElementById('playbackModal');
    const playerWrapper = document.getElementById('playerWrapper');
    const modalVideoId = 'modalVideo';
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const externalBtn = document.getElementById('externalBtn');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const muteBtn = document.getElementById('muteBtn');

    let currentHls = null;
    let currentFiltered = [];
    let currentIndex = null;

    function isMP4(url) { return /\.mp4($|\?)/i.test((url||'')); }
    function isHls(url) {
      if (!url) return false;
      return url.includes('.m3u8') || url.includes('index-') || /index.*\.txt/i.test(url) || url.includes('manifest') || url.includes('master');
    }

    function resetPlayerContainer() {
      if (currentHls) {
        try { currentHls.destroy(); } catch(e) {}
        currentHls = null;
      }
      playerWrapper.innerHTML = `<video id="${modalVideoId}" controls playsinline style="width:100%;height:100%;background:#000"></video>`;
    }

    function showModal() {
      playbackModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function hideModal() {
      playbackModal.classList.remove('active');
      document.body.style.overflow = '';
    }

    function openPlayer(list, index) {
      if (!Array.isArray(list) || list.length === 0 || index == null || index < 0 || index >= list.length) return;
      currentFiltered = list;
      currentIndex = index;
      const movie = list[index];
      if (!movie) return;

      modalTitle.textContent = movie.title || '';
      modalDesc.textContent = movie.description || (movie.title || '');

      resetPlayerContainer();
      showModal();

      let src = typeof movie.video === 'object' && movie.video !== null 
        ? (movie.video.high || movie.video.medium || movie.video.low || Object.values(movie.video)[0]) 
        : movie.video;

      // Update external watch link
      if (src && src !== "00") {
        externalBtn.href = src.replace('/embed/', '/file/').replace('/embed', '');
        externalBtn.style.display = 'inline-flex';
      } else {
        externalBtn.style.display = 'none';
      }

      if (!src || src === "00") {
        playerWrapper.innerHTML = `
          <div class="flex flex-col items-center justify-center h-full text-center p-6 text-gray-400 font-mono-tech">
            <i class="fas fa-user-shield text-3xl text-red-500 mb-2"></i>
            <p class="text-xs">TACTICAL SOURCE UNCONNECTED [ERR: 00]</p>
            <p class="text-[10px] text-gray-500 mt-1">STREAM FILE PURGED OR TEMPORARILY OFFLINE</p>
          </div>`;
        return;
      }

      const lc = (src || '').toLowerCase();

      // Handling Web Embed Sources (Mega.nz, Streamtape, Dood, Drive)
      if (lc.includes('mega.nz') || lc.includes('streamtape.com') || lc.includes('dood') || lc.includes('ok.ru') || lc.includes('drive.google.com')) {
        playerWrapper.innerHTML = `<iframe src="${src}" allow="autoplay; encrypted-media; fullscreen" referrerpolicy="no-referrer" allowfullscreen></iframe>`;
        playPauseBtn.innerHTML = '<i class="fas fa-play mr-1"></i>Play';
        return;
      }

      if (isHls(src)) {
        const v = document.getElementById(modalVideoId);
        if (!v) return;
        if (window.Hls && Hls.isSupported()) {
          currentHls = new Hls();
          try {
            currentHls.loadSource(src);
            currentHls.attachMedia(v);
          } catch (e) { console.warn('HLS attach error', e); }
          currentHls.on(Hls.Events.MANIFEST_PARSED, function() {
            v.play().catch(()=>{});
            playPauseBtn.innerHTML = '<i class="fas fa-pause mr-1"></i>Pause';
          });
        } else if (v.canPlayType && v.canPlayType('application/vnd.apple.mpegurl')) {
          v.src = src;
          v.play().catch(()=>{});
          playPauseBtn.innerHTML = '<i class="fas fa-pause mr-1"></i>Pause';
        }
        return;
      }

      if (isMP4(src)) {
        const v = document.getElementById(modalVideoId);
        if (v) {
          v.src = src;
          v.play().catch(()=>{});
          playPauseBtn.innerHTML = '<i class="fas fa-pause mr-1"></i>Pause';
        }
        return;
      }
    }

    function togglePlayPause() {
      const v = document.getElementById(modalVideoId);
      if (!v) return;
      if (v.paused) {
        v.play().catch(()=>{});
        playPauseBtn.innerHTML = '<i class="fas fa-pause mr-1"></i>Pause';
      } else {
        v.pause();
        playPauseBtn.innerHTML = '<i class="fas fa-play mr-1"></i>Play';
      }
    }
    function playNext() {
      if (!currentFiltered || currentFiltered.length === 0) currentFiltered = movies.slice();
      if (currentIndex != null && currentIndex < currentFiltered.length - 1) openPlayer(currentFiltered, currentIndex + 1);
    }
    function playPrev() {
      if (!currentFiltered || currentFiltered.length === 0) currentFiltered = movies.slice();
      if (currentIndex != null && currentIndex > 0) openPlayer(currentFiltered, currentIndex - 1);
    }
    function toggleFullscreen() {
      const el = document.getElementById(modalVideoId) || playerWrapper.querySelector('iframe');
      if (!el) return;
      if (!document.fullscreenElement) {
        (el.requestFullscreen || playerWrapper.requestFullscreen).call(el).catch(()=>{});
      } else {
        document.exitFullscreen();
      }
    }
    function toggleMute() {
      const v = document.getElementById(modalVideoId);
      if (!v) return;
      v.muted = !v.muted;
      muteBtn.innerHTML = v.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    }

    function closeModalHandler() {
      if (currentHls) {
        try { currentHls.destroy(); } catch(e) {}
        currentHls = null;
      }
      const v = document.getElementById(modalVideoId);
      if (v) {
        try { v.pause(); } catch(e){}
        try { v.removeAttribute('src'); v.load(); } catch(e){}
      }
      resetPlayerContainer();
      hideModal();
      currentIndex = null;
      currentFiltered = [];
      playPauseBtn.innerHTML = '<i class="fas fa-play mr-1"></i>Play';
    }

    playPauseBtn.addEventListener('click', togglePlayPause);
    nextBtn.addEventListener('click', playNext);
    prevBtn.addEventListener('click', playPrev);
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    muteBtn.addEventListener('click', toggleMute);
    document.getElementById('closeBtn').addEventListener('click', closeModalHandler);
    document.getElementById('topCloseBtn').addEventListener('click', closeModalHandler);

    playbackModal.addEventListener('click', function(e){
      if (e.target === playbackModal) closeModalHandler();
    });

    document.addEventListener('keydown', (e) => {
      if (!playbackModal.classList.contains('active')) return;
      switch (e.key.toLowerCase()) {
        case 'escape': closeModalHandler(); break;
        case ' ': e.preventDefault(); togglePlayPause(); break;
        case 'arrowright': playNext(); break;
        case 'arrowleft': playPrev(); break;
        case 'f': toggleFullscreen(); break;
        case 'm': toggleMute(); break;
      }
    });

    /******************************
     * Render Movies Grid
     ******************************/
    function renderMovies(moviesToRender) {
      container.innerHTML = '';
      if (moviesToRender.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-12 text-center font-mono-tech text-gray-500">
            <i class="fas fa-search-minus text-3xl mb-2 text-red-500/50"></i>
            <p class="text-xs">NO CLASSIFIED FILES FOUND MATCHING SPECIFIED CRITERIA.</p>
          </div>`;
        return;
      }

      const fragment = document.createDocumentFragment();

      moviesToRender.forEach((movie, index) => {
        const posterSrc = (movie.image && movie.image !== "00") 
          ? movie.image 
          : `https://via.placeholder.com/500x750/0f172a/ef4444?text=${encodeURIComponent(movie.title)}`;

        const div = document.createElement('div');
        div.className = `movie-card rounded-lg overflow-hidden cursor-pointer relative group flex flex-col justify-between`;
        div.innerHTML = `
          <div class="relative overflow-hidden bg-slate-950">
            <img loading="lazy" src="${posterSrc}" alt="${movie.title}" class="w-full h-full object-cover movie-poster">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex items-center justify-center p-2">
              <button class="bg-red-600 hover:bg-red-500 text-white font-rajdhani font-bold py-1.5 px-3 rounded text-xs flex items-center gap-1.5 tracking-wider">
                <i class="fas fa-play text-[10px]"></i> PLAY
              </button>
            </div>
            ${movie.normCategory ? `<span class="absolute top-1.5 left-1.5 bg-slate-950/90 border border-red-500/30 text-red-400 text-[9px] font-mono-tech px-1.5 py-0.5 rounded">${movie.normCategory}</span>` : ''}
          </div>
          <div class="p-2.5 flex flex-col justify-between flex-1">
            <div>
              <h3 class="font-rajdhani font-bold text-sm text-red-400 truncate tracking-wide">${movie.title}</h3>
              <p class="text-[11px] text-gray-400 mt-0.5 line-clamp-2 leading-tight">${movie.description}</p>
            </div>
            <div class="flex justify-between items-center mt-2 pt-1.5 border-t border-red-500/20 text-[10px] font-mono-tech text-red-400/80">
              <span><i class="far fa-calendar-alt mr-1"></i>${movie.year}</span>
              <span><i class="far fa-clock mr-1"></i>${movie.duration || 'N/A'}</span>
            </div>
          </div>
        `;

        div.addEventListener('click', () => {
          openPlayer(moviesToRender, index);
        });

        fragment.appendChild(div);
      });

      container.appendChild(fragment);
    }

    // Initialize UI
    buildCategoryFilters();
    applyFilters();
</script>

<!-- Disable DevTools + View Source Protection -->
<script src="https://cdn.jsdelivr.net/npm/disable-devtool@latest"></script>

<script>
/* =========================
   Mobile Detection
========================= */
const isMobile =
    /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);

/* =========================
   Disable DevTools
========================= */
DisableDevtool({
    disable: true,
    disableMenu: true,
    clearLog: true,
    disableSelect: true,
    disableCopy: true,
    disableCut: true,
    disablePaste: true,

    /* FIXED */
    disableMobile: false,

    interval: 100,

    ondevtoolopen: function () {

        /* ONLY DESKTOP */
        if (!isMobile) {
            document.body.innerHTML = "";
            window.location.replace("about:blank");
        }
    }
});

/* =========================
   Block View Source Shortcuts
========================= */
document.addEventListener("keydown", function (e) {

    // F12
    if (e.key === "F12") {
        e.preventDefault();
        return false;
    }

    // Ctrl+U
    if (e.ctrlKey && e.key.toLowerCase() === "u") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "i") {
        e.preventDefault();
        return false;
    }

    // Ctrl+Shift+J
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "j") {
        e.preventDefault();
        return false;
    }

    // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "c") {
        e.preventDefault();
        return false;
    }

    // Ctrl+S
    if (e.ctrlKey && e.key.toLowerCase() === "s") {
        e.preventDefault();
        return false;
    }

    // Ctrl+P
    if (e.ctrlKey && e.key.toLowerCase() === "p") {
        e.preventDefault();
        return false;
    }

    // Ctrl+A
    if (e.ctrlKey && e.key.toLowerCase() === "a") {
        e.preventDefault();
        return false;
    }

    // Ctrl+C
    if (e.ctrlKey && e.key.toLowerCase() === "c") {
        e.preventDefault();
        return false;
    }

    // Ctrl+X
    if (e.ctrlKey && e.key.toLowerCase() === "x") {
        e.preventDefault();
        return false;
    }

    // Ctrl+V
    if (e.ctrlKey && e.key.toLowerCase() === "v") {
        e.preventDefault();
        return false;
    }
});

/* =========================
   Disable Right Click
========================= */
document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Dragging
========================= */
document.addEventListener("dragstart", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Selection
========================= */
document.addEventListener("selectstart", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Copy Actions
========================= */
["copy", "cut", "paste"].forEach(function(evt) {

    document.addEventListener(evt, function(e) {
        e.preventDefault();
    });

});

/* =========================
   Detect DevTools Window
   (Desktop ONLY - FIXED)
========================= */
if (!isMobile) {

    setInterval(function () {

        const widthThreshold =
            window.outerWidth - window.innerWidth > 220;

        const heightThreshold =
            window.outerHeight - window.innerHeight > 220;

        if (widthThreshold || heightThreshold) {

            document.body.innerHTML = "";
            window.location.replace("about:blank");
        }

    }, 1500);

}

/* =========================
   Disable Console
========================= */
(function () {

    console.clear();

    function block() {
        return false;
    }

    console.log = block;
    console.warn = block;
    console.error = block;
    console.info = block;
    console.debug = block;
    console.table = block;

})();

/* =========================
   Block "view-source:"
========================= */
if (window.location.href.startsWith("view-source:")) {

    document.body.innerHTML = "";
    window.location.replace("about:blank");

}

/* =========================
   Prevent iframe inspection
========================= */
if (window.top !== window.self) {

    try {
        window.top.location = window.self.location;
    } catch (e) {}

}
</script>
