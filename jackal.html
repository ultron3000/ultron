<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Day of the Jackal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marvel:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- HLS.js (from Tukaram for HLS playback support) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js"></script>

  <style>
    /* PRESERVE original Hawkeye CSS and animations but adjust theme to Loki */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #07060b; }
    ::-webkit-scrollbar-thumb { background: #9ad34d; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #bfe67a; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px);} to { opacity: 1; transform: translateY(0);} }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes arrowBounce { 0%,100% { transform: translateY(0);} 50% { transform: translateY(5px);} }

    .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    .pulse-hover:hover { animation: pulse 1.5s infinite; }
    .arrow-bounce { animation: arrowBounce 2s infinite; }

    .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; } .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; } .delay-5 { animation-delay: 0.5s; }

    .glow-effect { position: relative; transition: transform 0.3s ease; }
    .glow-effect:hover { transform: translateY(-5px); }
    .glow-effect::after{ content:''; position:absolute; top:0; left:0; right:0; bottom:0; border-radius:12px; box-shadow:0 0 15px rgba(154,211,77,0); transition:box-shadow 0.3s; pointer-events:none;}
    .glow-effect:hover::after { box-shadow:0 0 20px rgba(154,211,77,0.25); }

    .gradient-text { background: linear-gradient(90deg, #9ad34d, #7f3cff); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .marvel-font { font-family: 'Marvel', sans-serif; }

    /* Responsive adjustments */
    @media (max-width: 640px) { .movie-card { width: calc(50% - 1rem); } }
    @media (max-width: 400px) { .movie-card { width: 100%; } }

    /* Modal player container (Tukaram-style preserved) */
    #modal-player { position: relative; padding-bottom: 56.25%; height: 0; background: black; }
    #modal-player video, #modal-player iframe { position:absolute; top:0; left:0; width:100%; height:100%; background:black; }

    /* small Loki tint changes to Hawkeye theme */
    header { background: linear-gradient(90deg,#081018,#04040a); }
    .bg-loki { background: linear-gradient(135deg,#7f3cff,#9ad34d); }
    .loki-accent { color: #9ad34d; }
    .btn-loki { background: #9ad34d; color: #061217; }
    .btn-loki:hover { filter: brightness(0.95); }
    .watchlist-checkbox .checkmark { border: 2px solid #9ad34d; }
    .progress-bar-fill { background: #9ad34d; }

    /* keep other original Hawkeye styles intact */
    body { background: #07060b; color: #e6f3e9; font-family: Roboto, system-ui, -apple-system, 'Segoe UI', Arial; }

    /* Illumination modal styles (keeps modal look consistent) */
    .modal-backdrop { position:fixed; inset:0; background: rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; z-index:9999; }
    .modal-backdrop.active { display:flex; }
    .modal-card { width:92%; max-width:980px; border-radius:12px; overflow:hidden; background:#0b1220; box-shadow:0 30px 80px rgba(0,0,0,0.7); }
    .player-wrapper { position:relative; padding-bottom:56.25%; height:0; background:#000; }
    .player-wrapper video, .player-wrapper iframe { position:absolute; inset:0; width:100%; height:100%; }

    .player-meta { display:flex; justify-content:space-between; gap:12px; padding:14px; color:#ddd; align-items:flex-start; }
    .player-meta .meta-left { max-width:65%; }
    .player-meta h3 { margin:0; font-size:1.125rem; }
    .player-meta p { margin:6px 0 0 0; color:#9CA3AF; font-size:0.92rem; }

    .controls-row { display:flex; gap:8px; align-items:center; }

    .btn {
      background:transparent; border:1px solid #9ad34d; color:#9ad34d;
      padding:8px 12px; border-radius:8px; cursor:pointer;
    }
    .btn:hover { background: rgba(154,211,77,0.06); }

    .hidden { display:none; }

    @media(max-width:640px){
      .player-meta .meta-left { max-width:55%; }
      .btn { padding:6px 8px; font-size:0.9rem; }
    }
    /* ============================
   MOBILE FIX — DOES NOT TOUCH DESKTOP
   ============================ */

@media (max-width: 767px) {

  /* Proper mobile player layout (matches your working version) */
  .player-wrapper {
    padding-bottom: 56.25% !important;   /* keep 16:9 on mobile */
    height: 0 !important;
    position: relative !important;
  }

  .player-wrapper video,
  .player-wrapper iframe {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
  }

  /* Proper stacked mobile controls */
  .player-meta {
    display: flex !important;
    flex-direction: column !important;
    gap: 12px !important;
    padding: 12px !important;
    background: #0b1220 !important;
    z-index: 20 !important;
  }

  /* Mobile control row wraps properly */
  .controls-row {
    display: flex !important;
    flex-wrap: wrap !important;
    justify-content: center !important;
    gap: 10px !important;
  }

  /* Mobile buttons use icon-only layout */
  .btn {
    padding: 8px !important;
    font-size: 0 !important;      /* hides text on mobile */
    min-width: 48px !important;
    height: 44px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }

  .btn i {
    font-size: 1.1rem !important;
    margin: 0 !important;
  }

  /* Close button always visible on mobile */
  #topCloseBtn {
    opacity: 1 !important;
  }
}

  /* === SMART FULLSCREEN VIDEO FIX (NO CROPPING, NO GAPS WHEN POSSIBLE) === */
video:fullscreen,
video:-webkit-full-screen,
iframe:fullscreen,
iframe:-webkit-full-screen {
  width: 100vw !important;
  height: 100vh !important;
  max-width: 100vw !important;
  max-height: 100vh !important;

  object-fit: contain !important;
  background-color: black;
}

/* Only cover when video aspect is cinematic */
@media (min-aspect-ratio: 16/9) {
  video:fullscreen,
  video:-webkit-full-screen,
  iframe:fullscreen,
  iframe:-webkit-full-screen {
    object-fit: cover !important;
  }
}

  /* Responsive hero, episode catalogue and player adapted from body.html */
  .series-hero-shell{width:100%;max-width:1320px;margin:18px auto 28px;padding:0 18px;box-sizing:border-box}
  .series-hero{position:relative;isolation:isolate;overflow:hidden;min-height:clamp(330px,34vw,455px);border:1px solid rgba(148,163,184,.28);border-radius:26px;background:#020617;box-shadow:0 26px 80px rgba(0,0,0,.42);touch-action:pan-y}
  .series-hero-bg{position:absolute;inset:0;z-index:-2;overflow:hidden;background-position:center;background-size:cover}
  .series-hero-bg iframe{position:absolute;top:50%;left:50%;width:177.78vh;height:56.25vw;min-width:100%;min-height:100%;transform:translate(-50%,-50%);border:0;pointer-events:none;opacity:.62}
  .series-hero-bg:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(2,6,23,.68),rgba(2,6,23,.82) 48%,rgba(2,6,23,.92)),linear-gradient(0deg,rgba(2,6,23,.6),rgba(2,6,23,.12))}
  .series-hero-inner{position:relative;z-index:1;min-height:inherit;display:grid;grid-template-columns:minmax(170px,245px) minmax(0,1fr);align-items:center;gap:clamp(24px,4vw,58px);padding:clamp(22px,4vw,48px);box-sizing:border-box}
  .series-hero-art{display:block;width:100%;max-width:245px;aspect-ratio:2/2.85;justify-self:center;transform:perspective(1100px) rotateY(-7deg);filter:drop-shadow(0 24px 30px rgba(0,0,0,.62));transition:transform .4s}
  .series-hero-art img{display:block;width:100%;height:100%;object-fit:cover;border-radius:15px;border:1px solid rgba(255,255,255,.4);box-shadow:0 18px 45px #0008}
  .series-hero:hover .series-hero-art{transform:perspective(1100px) rotateY(-3deg) translateY(-4px)}
  .series-hero-copy{max-width:760px;min-width:0;color:#fff;text-align:left}
  .series-hero-kicker{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid rgba(154,211,77,.4);border-radius:999px;background:rgba(15,35,22,.7);color:#c9f59b;font-size:10px;font-weight:900;letter-spacing:.14em}
  .series-hero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;color:#d4e9c3;font-size:10px;font-weight:850;letter-spacing:.07em;text-transform:uppercase}
  .series-hero-title{margin:12px 0 10px;color:#fff;font-size:clamp(2rem,4.6vw,4.2rem);font-weight:950;line-height:1.02;letter-spacing:-.045em;text-shadow:0 5px 25px #0009}
  .series-hero-description{max-width:62ch;margin:0 0 20px;color:#e2e8f0;font-size:clamp(13px,1.2vw,15px);line-height:1.65;text-shadow:0 2px 12px #000}
  .series-hero-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .series-hero-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:43px;padding:0 17px;border-radius:11px;font-size:11px;font-weight:900;cursor:pointer;transition:transform .2s,filter .2s}
  .series-hero-btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
  .series-hero-primary{background:linear-gradient(110deg,#9ad34d,#6eaa2d);color:#081007;box-shadow:0 9px 24px #9ad34d33}
  .series-hero-secondary{background:rgba(15,23,42,.76);border:1px solid rgba(255,255,255,.28);color:#fff;backdrop-filter:blur(10px)}
  @media(max-width:700px){
    .series-hero-shell{padding:0 12px;margin:13px auto 20px}
    .series-hero{min-height:310px;border-radius:19px}
    .series-hero-bg iframe{opacity:.5}
    .series-hero-bg:after{background:linear-gradient(90deg,rgba(2,6,23,.77),rgba(2,6,23,.84)),linear-gradient(0deg,rgba(2,6,23,.72),rgba(2,6,23,.2))}
    .series-hero-inner{grid-template-columns:minmax(88px,27%) minmax(0,1fr);gap:clamp(12px,3vw,20px);padding:18px 14px;min-height:310px}
    .series-hero-art{max-width:150px;transform:perspective(800px) rotateY(-4deg)}
    .series-hero-art img{border-radius:10px}
    .series-hero-title{font-size:clamp(1.35rem,5.5vw,2.2rem);line-height:1.04;margin:9px 0 8px}
    .series-hero-kicker{font-size:8px;padding:6px 9px;letter-spacing:.09em}
    .series-hero-meta{font-size:8px;gap:6px;margin-top:9px}
    .series-hero-description{font-size:10px;line-height:1.48;margin-bottom:11px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
    .series-hero-btn{min-height:36px;padding:0 10px;font-size:9px;gap:6px}
  }
  @media(max-width:390px){
    .series-hero{min-height:292px}
    .series-hero-inner{grid-template-columns:78px minmax(0,1fr);gap:10px;padding:15px 11px;min-height:292px}
    .series-hero-title{font-size:1.22rem}
    .series-hero-meta{font-size:7px;gap:5px}
    .series-hero-description{-webkit-line-clamp:3;font-size:9px}
    .series-hero-btn{min-height:33px;padding:0 8px;font-size:8px}
  }
  .episode-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;width:100%}
  .episode-card{min-width:0;border:1px solid rgba(154,211,77,.18);border-radius:15px;overflow:hidden;background:linear-gradient(155deg,#171d18,#0d120e);transition:transform .22s,border-color .22s,box-shadow .22s;cursor:pointer}
  .episode-card:hover{transform:translateY(-4px);border-color:rgba(154,211,77,.55);box-shadow:0 14px 34px rgba(0,0,0,.3)}
  .episode-image-wrap{position:relative;aspect-ratio:16/9;overflow:hidden;background:#17191c}
  .episode-image{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .episode-card:hover .episode-image{transform:scale(1.04)}
  .episode-number{position:absolute;top:9px;left:9px;background:rgba(8,9,10,.82);border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:5px 8px;font-size:9px;font-weight:800;letter-spacing:.1em;color:#fff}
  .episode-play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,9,10,.12);opacity:0;transition:opacity .2s}
  .episode-play span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#9ad34d;color:#10170b;box-shadow:0 7px 24px rgba(0,0,0,.4)}
  .episode-card:hover .episode-play{opacity:1}
  .episode-info{padding:12px 13px 14px;color:#f8fafc}
  .episode-kicker{font-size:9px;color:#a9df70;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  .episode-title{font:700 14px/1.25 Roboto,system-ui,sans-serif;margin:7px 0 6px;min-height:35px}
  .episode-description{font-size:10px;line-height:1.55;color:#b9c0c8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:46px}
  .episode-runtime{font-size:9px;color:#9299a3;margin-top:9px}
  @media(max-width:900px){.episode-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:620px){
    .episode-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .episode-card{border-radius:12px}.episode-info{padding:9px}
    .episode-title{font-size:12px;min-height:31px}.episode-description{font-size:9px;min-height:42px}
    .episode-runtime{font-size:8px;margin-top:7px}.episode-play{opacity:1}
    .episode-play span{width:34px;height:34px;font-size:11px}
  }
  @media(max-width:360px){.episode-grid{gap:8px}.episode-info{padding:8px}.episode-title{font-size:11px}}
  .modal-backdrop{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(12px)}
  .modal-backdrop.active{display:flex}
  .modal-card{position:relative;width:min(100%,1020px);max-height:95vh;overflow:auto;background:#0d1014;border:1px solid rgba(154,211,77,.25);border-radius:17px;box-shadow:0 30px 90px rgba(0,0,0,.7)}
  .player-wrapper{position:relative;width:100%;height:auto!important;padding:0!important;aspect-ratio:16/9;background:#000}
  .player-wrapper video,.player-wrapper iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  .player-meta{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 17px;background:#13171b;border-top:1px solid rgba(255,255,255,.1);color:#ddd}
  .meta-left{min-width:0}.player-meta h3{font-weight:700;font-size:16px;margin:0;color:#fff}.player-meta p{font-size:10px;color:#aeb7c1;margin:5px 0 0}
  .controls-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
  .player-btn{min-width:40px;height:39px;padding:0 11px;border:1px solid rgba(154,211,77,.35);border-radius:9px;background:#20272a;color:#c5ef88;font-size:11px;cursor:pointer}
  .player-btn:hover{background:#344329}.player-btn.close{color:#fff;background:#692d2d;border-color:#a34b4b}
  #topCloseBtn{position:absolute;top:12px;right:12px;z-index:5;width:39px;height:39px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(0,0,0,.75);color:#fff;font-size:16px}
  @media(max-width:620px){
    .modal-backdrop{padding:0;align-items:stretch}
    .modal-card{width:100%;max-height:100dvh;height:auto;align-self:center;border-radius:0;border-left:0;border-right:0}
    .player-wrapper{aspect-ratio:16/9;flex:none}
    .player-meta{flex-direction:column;align-items:stretch;padding:13px;gap:12px}
    .controls-row{justify-content:center;gap:8px}
    .player-btn{height:43px;min-width:45px;padding:0 10px}
    .meta-left{padding-right:45px}.player-meta h3{font-size:14px}
  }
  @media(prefers-reduced-motion:reduce){.series-hero-art,.episode-card,.episode-image{transition:none}}


</head>
<body class="bg-black text-gray-100 min-h-screen font-roboto">

    <section class="container mx-auto px-4" id="episodes" style="max-width:1320px">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-5 pb-4 border-b border-gray-800">
        <div>
          <div class="text-[9px] font-extrabold tracking-[.2em] uppercase text-[#9ad34d]">Season one · 2024</div>
          <h2 class="text-2xl sm:text-3xl font-bold mt-1">Every mission has a consequence.</h2>
          <p class="text-xs text-gray-400 mt-1">All 10 episodes · The Day of the Jackal</p>
        </div>
        <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
          <input id="episode-search" type="search" placeholder="Search episodes..." aria-label="Search episodes" class="w-full sm:w-52 h-10 rounded-lg border border-gray-700 bg-[#101510] px-3 text-xs text-white outline-none focus:border-[#9ad34d]">
          <button class="season-btn active bg-[#9ad34d] text-black px-3 py-2 rounded-lg text-xs font-bold" data-season="all">Season 1</button>

      <video id="modalVideo" controls playsinline preload="metadata"></video>
      <button id="topCloseBtn" type="button" aria-label="Close player"><i class="fas fa-times"></i></button>

  </div>

  <script>
// ========================
// SEASON SELECTOR + DATA
// ========================

// Quantum Leap (2022) – Season 1 & 2
const movies = [
{ title: "Episode 1: The Ghost Appears", year: 2024, video: "https://mega.nz/embed/IMNDzJra#-WIj3nFw44G-gtuoVIVzG4yfKMzjCzIHCMANAsStalc", image: "https://img10.hotstar.com/image/upload/f_auto/sources/r1/cms/prod/4749/1738838544749-h", runtime: "45 min", rating: "7.8/10", description: "A flawless assassination across Europe exposes the existence of the elusive hitman known only as the Jackal, drawing sharp MI6 officer Bianca Pullman into a dangerous global manhunt." },

{ title: "Episode 2: Broken Contracts", year: 2024, video: "https://mega.nz/embed/gVMAhBaL#TFWTsy-Jwncf27Z4iflg9rqa6-utGzYRbbOzCo2QBSU", image: "https://img10.hotstar.com/image/upload/f_auto/sources/r1/cms/prod/4955/1738838544955-h", runtime: "45 min", rating: "8.1/10", description: "When a powerful client refuses to pay, the Jackal’s code is broken. As his reputation hangs in the balance, he begins a calculated and ruthless path toward revenge." },

{ title: "Episode 3: Munich Reckoning", year: 2024, video: "https://mega.nz/embed/NVNQ2DYb#M69vjGq1LRpkz4puzQqx0IaWWLNPWt1L6NrjYmrRqN0", image: "https://img10.hotstar.com/image/upload/f_auto/sources/r1/cms/prod/5166/1738838545166-h", runtime: "45 min", rating: "8.3/10", description: "Tracking his betrayer to Munich, the Jackal executes a precise and chilling retaliation, while Bianca edges closer, uncovering the assassin’s patterns." },

{ title: "Episode 4: Shadows and Lies", year: 2024, video: "https://mega.nz/embed/EQEhVJIJ#3ZOEZ2qOj5WKWZdPGjt63grgXv4lwmqjZgU0dD3ON_0", image: "https://img10.hotstar.com/image/upload/f_auto/sources/r1/cms/prod/7180/1738838547180-h", runtime: "45 min", rating: "8.4/10", description: "After settling the score, the Jackal disappears into the shadows, but tensions rise as Nuria begins to question his secrets and Bianca uncovers a critical new lead." },

{ title: "Episode 5: Closing In", year: 2024, video: "https://mega.nz/embed/tJky0ShA#Sgnaqnluf0ShtMm6UzJSLfSAjpXiBNIu6UkoXeEHgeY", image: "https://img10.hotstar.com/image/upload/f_auto/sources/r1/cms/prod/6205/1738838546205-h", runtime: "45 min", rating: "8.7/10", description: "A high-stakes commission leads the Jackal to a key contact, but Bianca’s relentless pursuit brings her dangerously close to exposing his identity." },

{ title: "Episode 6: Collision Course", year: 2024, video: "https://mega.nz/embed/kAEWkKbQ#sQHRx6mbWyeU_x3PsL9jlQof0lRgJUBWa32nUj-2rzY", image: "https://img10.hotstar.com/image/upload/f_auto/sources/r1/cms/prod/3306/1738838543306-h", runtime: "45 min", rating: "9.0/10", description: "Following a violent encounter, the Jackal must evade capture and prepare for his most ambitious target yet, while Bianca tracks his destructive trail across Europe." },

{ title: "Episode 7: Locked Target", year: 2024, video: "https://mega.nz/embed/0MFVCLxT#N7-eJ4-Wu3bbP_opP3mzUIoduR2_aPO99JxVP-GZQ_s", image: "https://img10.hotstar.com/image/upload/f_auto/sources/r1/cms/prod/1604/1738838541604-h", runtime: "45 min", rating: "8.5/10", description: "In a heavily secured Tallinn venue, both hunter and hunted converge. With time running out, the Jackal prepares for the perfect shot as Bianca closes in." },

{ title: "Episode 8: Buried Past", year: 2024, video: "https://mega.nz/embed/sclVWZII#saRNxOHl2mHp_nUthXwHPjOoyhAydJcxuFUCL_6z-MM", image: "https://img10.hotstar.com/image/upload/f_auto/sources/r1/cms/prod/8679/1738838538679-h", runtime: "45 min", rating: "8.2/10", description: "As the aftermath unfolds, Bianca dives deep into the Jackal’s hidden identity, uncovering a past shaped by war, secrets, and survival." },

{ title: "Episode 9: Final Approach", year: 2024, video: "https://mega.nz/embed/YM9jGYTD#wXEb4NQlBBRGn6PqXhkBhKBKdV5TbFOAHDGjmjuln1c", image: "https://img10.hotstar.com/image/upload/f_auto/sources/r1/cms/prod/4846/1738838534846-h", runtime: "45 min", rating: "8.2/10", description: "With his ultimate target within reach, the Jackal executes a high-risk plan, while Bianca races against time to prevent a catastrophic assassination." },

{ title: "Episode 10: The Last Hunt", year: 2024, video: "https://mega.nz/embed/5Zci2DSD#tAtMw5l2BSjSWWVuabE2uvUXgCzWgFW6T78xH0OwFfg", image: "https://img10.hotstar.com/image/upload/f_auto/sources/r1/cms/prod/4435/1738838534435-h", runtime: "45 min", rating: "8.2/10", description: "Now the most wanted man in Europe, the Jackal fights to escape and reunite with Nuria, as Bianca is given one final chance to stop him once and for all." }

];

    /* Responsive body.html-style player engine. Original Jackal source URLs remain untouched. */
    const playerWrapper=document.getElementById('playerWrapper');
    const playbackModal=document.getElementById('playbackModal');
    const modalTitle=document.getElementById('modalTitle');
    const modalDesc=document.getElementById('modalDesc');
    const prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
    const playPauseBtn=document.getElementById('playPauseBtn'),fullscreenBtn=document.getElementById('fullscreenBtn'),muteBtn=document.getElementById('muteBtn');
    let currentHls=null,currentFiltered=[],currentIndex=null;
    function isMP4(url){return String(url||'').toLowerCase().includes('.mp4')}
    function isHls(url){const u=String(url||'').toLowerCase();return u.includes('.m3u8')||u.includes('index-')||u.includes('index')&&u.includes('.txt')||u.includes('manifest')||u.includes('master')}
    function isYouTube(url){const u=String(url||'').toLowerCase();return u.includes('youtube.com')||u.includes('youtu.be')||u.includes('youtube-nocookie.com')}
    function resetPlayerContainer(){
      if(currentHls){try{currentHls.destroy()}catch(e){}currentHls=null}
      playerWrapper.innerHTML='<video id="modalVideo" controls playsinline preload="metadata"></video><button id="topCloseBtn" type="button" aria-label="Close player"><i class="fas fa-times"></i></button>';
      document.getElementById('topCloseBtn').addEventListener('click',closeModalHandler);
    }
    function showModal(){playbackModal.classList.add('active');playbackModal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
    function hideModal(){playbackModal.classList.remove('active');playbackModal.setAttribute('aria-hidden','true');document.body.style.overflow=''}
    function openPlayer(list,index){
      if(!Array.isArray(list)||!list.length||index==null||index<0||index>=list.length)return;
      currentFiltered=list;currentIndex=index;const item=list[index];
      modalTitle.textContent=item.title||'The Day of the Jackal';
      const originalIndex=movies.indexOf(item);
      modalDesc.textContent='The Day of the Jackal · Season 1 · Episode '+(originalIndex>=0?originalIndex+1:index+1);
      resetPlayerContainer();showModal();
      const src=typeof item.video==='object'&&item.video!==null?(item.video.high||item.video.medium||item.video.low||item.video.mpd||Object.values(item.video)[0]):item.video;
      if(!src){modalDesc.textContent+=' · Video source not supplied';return}
      const lower=String(src).toLowerCase(),video=document.getElementById('modalVideo');
      if(isYouTube(src)){
        let id='';try{const u=new URL(src);id=u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop()}catch(e){}
        const embed=id&&id!=='embed'?'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0&modestbranding=1':src;
        playerWrapper.innerHTML='<iframe src="'+embed.replace(/&/g,'&amp;')+'" title="The Day of the Jackal trailer" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe><button id="topCloseBtn" type="button" aria-label="Close player"><i class="fas fa-times"></i></button>';
        document.getElementById('topCloseBtn').addEventListener('click',closeModalHandler);playPauseBtn.innerHTML='<i class="fas fa-pause"></i>';return;
      }
      const iframeHosts=['mega.nz','turboembed.com','streamtape.com','dood','vidcdn','ok.ru','drive.google.com','voe.sx','filemoon','mixdrop','dailymotion.com','openload'];
      if(iframeHosts.some(host=>lower.includes(host))&&!isHls(src)&&!isMP4(src)){
        playerWrapper.innerHTML='<iframe src="'+String(src).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" title="The Day of the Jackal episode player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe><button id="topCloseBtn" type="button" aria-label="Close player"><i class="fas fa-times"></i></button>';
        document.getElementById('topCloseBtn').addEventListener('click',closeModalHandler);playPauseBtn.innerHTML='<i class="fas fa-pause"></i>';return;
      }
      if(isHls(src)){
        if(window.Hls&&Hls.isSupported()){
          currentHls=new Hls({enableWorker:true,maxBufferLength:30,maxMaxBufferLength:60,backBufferLength:30});
          currentHls.loadSource(src);currentHls.attachMedia(video);
          currentHls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
          currentHls.on(Hls.Events.ERROR,(event,data)=>{if(data.fatal){if(data.type===Hls.ErrorTypes.NETWORK_ERROR)currentHls.startLoad();else if(data.type===Hls.ErrorTypes.MEDIA_ERROR)currentHls.recoverMediaError();else modalDesc.textContent+=' · Playback error'}});
        }else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=src;video.play().catch(()=>{})}
        else modalDesc.textContent+=' · HLS is not supported by this browser';
        playPauseBtn.innerHTML='<i class="fas fa-pause"></i>';return;
      }
      if(isMP4(src)||lower.includes('.webm')){video.src=src;video.play().catch(()=>{});playPauseBtn.innerHTML='<i class="fas fa-pause"></i>';return}
      if(lower.startsWith('http://')||lower.startsWith('https://')){
        playerWrapper.innerHTML='<iframe src="'+String(src).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" title="The Day of the Jackal episode player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe><button id="topCloseBtn" type="button" aria-label="Close player"><i class="fas fa-times"></i></button>';
        document.getElementById('topCloseBtn').addEventListener('click',closeModalHandler);playPauseBtn.innerHTML='<i class="fas fa-pause"></i>';return;
      }
      modalDesc.textContent+=' · Unsupported video source';
    }
    function togglePlayPause(){const v=document.getElementById('modalVideo');if(!v)return;if(v.paused){v.play().catch(()=>{});playPauseBtn.innerHTML='<i class="fas fa-pause"></i>'}else{v.pause();playPauseBtn.innerHTML='<i class="fas fa-play"></i>'}}
    function playNext(){if(currentFiltered.length&&currentIndex<currentFiltered.length-1)openPlayer(currentFiltered,currentIndex+1)}
    function playPrev(){if(currentFiltered.length&&currentIndex>0)openPlayer(currentFiltered,currentIndex-1)}
    function toggleFullscreen(){const el=document.getElementById('modalVideo')||playerWrapper.querySelector('iframe');if(!el)return;const fn=el.requestFullscreen||playerWrapper.requestFullscreen;if(!document.fullscreenElement&&fn)Promise.resolve(fn.call(el)).catch(()=>{});else if(document.exitFullscreen)document.exitFullscreen()}
    function toggleMute(){const v=document.getElementById('modalVideo');if(!v)return;v.muted=!v.muted;muteBtn.innerHTML=v.muted?'<i class="fas fa-volume-mute"></i>':'<i class="fas fa-volume-high"></i>'}
    function closeModalHandler(){
      if(currentHls){try{currentHls.destroy()}catch(e){}currentHls=null}
      const v=document.getElementById('modalVideo');if(v){try{v.pause();v.removeAttribute('src');v.load()}catch(e){}}
      resetPlayerContainer();hideModal();currentIndex=null;currentFiltered=[];playPauseBtn.innerHTML='<i class="fas fa-play"></i>';
    }
    prevBtn.addEventListener('click',playPrev);nextBtn.addEventListener('click',playNext);
    playPauseBtn.addEventListener('click',togglePlayPause);fullscreenBtn.addEventListener('click',toggleFullscreen);muteBtn.addEventListener('click',toggleMute);
    document.getElementById('closeBtn').addEventListener('click',closeModalHandler);
    playbackModal.addEventListener('click',e=>{if(e.target===playbackModal)closeModalHandler()});
    document.addEventListener('keydown',e=>{if(!playbackModal.classList.contains('active'))return;if(e.key==='Escape')closeModalHandler();if(e.key==='ArrowRight')playNext();if(e.key==='ArrowLeft')playPrev()});
    document.getElementById('trailerBtn').addEventListener('click',()=>openPlayer([{title:'The Day of the Jackal — Official Trailer',video:'https://www.youtube.com/watch?v=shsIx-ZVL0E'}],0));
    document.getElementById('scroll-down')?.addEventListener('click',()=>document.getElementById('episodes')?.scrollIntoView({behavior:'smooth'}));

    /* Attach video timeupdate/ended listeners */
    function attachVideoListeners() {
      const v = document.getElementById('modalVideo');
      if (!v) return;
      v.removeEventListener('timeupdate', onTimeUpdate);
      v.addEventListener('timeupdate', onTimeUpdate);
      v.removeEventListener('ended', onEnded);
      v.addEventListener('ended', onEnded);
    }
    function onTimeUpdate() {
      // If the original progress bar exists, update it (preserved element)
      const progressBarFill = document.getElementById('progress-bar-fill');
      const videoEl = document.getElementById('modalVideo');
      if (!progressBarFill || !videoEl || !videoEl.duration) return;
      const p = (videoEl.currentTime / videoEl.duration) * 100;
      progressBarFill.style.width = p + '%';
    }
    function onEnded() {
      const playBtn = document.getElementById('play-btn') || playPauseBtn;
      if (playBtn) playBtn.innerHTML = '<i class="fas fa-redo mr-2"></i> Replay';
    }

    /* Render episodes grid (wired to openPlayer) */
    const container = document.getElementById('movies');
    function renderMovies(list) {
      container.innerHTML='';
      if(!list.length){container.innerHTML='<div style="grid-column:1/-1;padding:25px;border:1px dashed rgba(154,211,77,.3);border-radius:12px;color:#aeb7c1">No episodes match your search.</div>';return}
      list.forEach((movie,index)=>{
        const card=document.createElement('article');card.className='episode-card';card.tabIndex=0;card.setAttribute('role','button');
        const episodeNo=movies.indexOf(movie)+1;
        const safeTitle=String(movie.title||('Episode '+episodeNo)).replace(/"/g,'&quot;');
        const safeDescription=String(movie.description||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        card.setAttribute('aria-label','Play episode '+episodeNo+': '+safeTitle);
        card.innerHTML='<div class="episode-image-wrap"><img class="episode-image" loading="lazy" src="'+movie.image+'" alt="'+safeTitle+'"><span class="episode-number">EP '+String(episodeNo).padStart(2,'0')+'</span><span class="episode-play"><span><i class="fas fa-play"></i></span></span></div><div class="episode-info"><div class="episode-kicker">Season 1 · Episode '+episodeNo+'</div><h3 class="episode-title">'+safeTitle+'</h3><p class="episode-description">'+safeDescription+'</p><div class="episode-runtime"><i class="far fa-clock"></i> '+(movie.runtime||'Episode')+' · ★ '+(movie.rating||'')+'</div></div>';
        const play=()=>{openPlayer(list,index);setTimeout(()=>attachVideoListeners(),150)};
        card.addEventListener('click',play);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play()}});
        container.appendChild(card);
      });
    }

    /* Init page (season filtering wired up) */
    function initPage() {
      renderMovies(movies);
      const episodeSearch=document.getElementById('episode-search');
      if(episodeSearch)episodeSearch.addEventListener('input',function(){
        const q=this.value.trim().toLowerCase();
        const active=document.querySelector('.season-btn.active');
        const season=active?active.dataset.season:'all';
        let list=season==='all'?movies:movies.filter(m=>String(m.season||1)===String(season));
        if(q)list=list.filter(m=>m.title.toLowerCase().includes(q)||(m.description||'').toLowerCase().includes(q));
        renderMovies(list);
      });

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelector('.filter-btn.active').classList.remove('active', 'bg-[#9ad34d]', 'text-black');
          this.classList.add('active', 'bg-[#9ad34d]', 'text-black');
        });
      });

      // Season buttons: filter content
      const seasonBtns = document.querySelectorAll('.season-btn');
      seasonBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          seasonBtns.forEach(b => b.classList.remove('active', 'bg-[#9ad34d]', 'text-black'));
          this.classList.add('active', 'bg-[#9ad34d]', 'text-black');
          const season = this.dataset.season;
          let filtered = (!season || season === 'all') ? movies : movies.filter(m => String(m.season || 1) === String(season));
          const q=(document.getElementById('episode-search')?.value||'').trim().toLowerCase();
          if(q)filtered=filtered.filter(m=>m.title.toLowerCase().includes(q)||(m.description||'').toLowerCase().includes(q));
          renderMovies(filtered);
        });
      });

      // Play All behavior (starts at first)
      const playAllBtn = document.getElementById('play-all');
      if (playAllBtn) {
        playAllBtn.addEventListener('click', () => {
          openPlayer(movies, 0);
          setTimeout(()=> attachVideoListeners(), 200);
        });
      }

      // Global search wiring
      const globalSearch = document.getElementById('global-search');
      if (globalSearch) {
        globalSearch.addEventListener('input', (e) => {
          const q = e.target.value.trim().toLowerCase();
          const activeSeasonBtn = document.querySelector('.season-btn.active');
          const season = activeSeasonBtn ? activeSeasonBtn.dataset.season : 'all';
          let list = season === 'all' ? movies : movies.filter(m => String(m.season) === String(season));
          if (q) list = list.filter(m => m.title.toLowerCase().includes(q) || (m.description && m.description.toLowerCase().includes(q)));
          renderMovies(list);
        });
      }

      // Watchlist UI wiring preserved
      updateWatchlist();
    }

    /* Watchlist functions (preserved) */
    const watchlistItems = document.getElementById('watchlist-items');
    function updateWatchlist() {
      if (!watchlistItems) return;
      watchlistItems.innerHTML = '';
      const watchlistMovies = movies.filter(m => m.inWatchlist);
      if (watchlistMovies.length === 0) {
        watchlistItems.innerHTML = '<div class="px-4 py-3 text-center text-gray-400">Your watchlist is empty</div>';
        return;
      }
      watchlistMovies.forEach((movie, idx) => {
        const index = movies.indexOf(movie);
        const item = document.createElement('div');
        item.className = 'px-4 py-3 hover:bg-gray-800 transition cursor-pointer flex items-center justify-between';
        item.innerHTML = `
          <div class="flex items-center">
            <span class="text-[#9ad34d] text-sm mr-2">${idx + 1}.</span>
            <span class="text-white text-sm truncate">${movie.title}</span>
          </div>
          <button class="remove-from-watchlist text-gray-400 hover:text-red-500" data-index="${index}">
            <i class="fas fa-times"></i>
          </button>
        `;
        item.querySelector('.remove-from-watchlist').addEventListener('click', (e) => {
          e.stopPropagation();
          removeFromWatchlist(index);
        });
        item.addEventListener('click', () => {
          openPlayer(movies, index);
          document.getElementById('watchlist-dropdown').classList.add('hidden');
        });
        watchlistItems.appendChild(item);
      });
    }
    function addToWatchlist(index) { movies[index].inWatchlist = true; updateWatchlist(); }
    function removeFromWatchlist(index) { movies[index].inWatchlist = false; updateWatchlist(); }

    /* preserved UI event wiring (search, theme, watchlist, modal controls) */
    const containerEl = document.getElementById('movies');
    const searchBtn = document.getElementById('search-btn');
    const searchBar = document.getElementById('search-bar');
    const themeToggle = document.getElementById('theme-toggle');
    const watchlistBtn = document.getElementById('watchlist-btn');
    const watchlistDropdown = document.getElementById('watchlist-dropdown');
    const closeModal = document.getElementById('close-modal');

    searchBtn.addEventListener('click', () => {
      searchBar.classList.toggle('hidden');
      watchlistDropdown.classList.add('hidden');
    });

    watchlistBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      watchlistDropdown.classList.toggle('hidden');
      searchBar.classList.add('hidden');
    });

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('bg-gray-100');
      document.body.classList.toggle('text-gray-900');
      document.body.classList.toggle('bg-black');
      document.body.classList.toggle('text-gray-100');
      const icon = themeToggle.querySelector('i');
      if (document.body.classList.contains('bg-black')) {
        icon.classList.remove('fa-sun'); icon.classList.add('fa-moon');
      } else { icon.classList.remove('fa-moon'); icon.classList.add('fa-sun'); }
    });

    // close modal by clicking background already wired above via playbackModal click

    // watchlist close on outside click & search close
    document.addEventListener('click', (e) => {
      if (!watchlistBtn.contains(e.target) && !watchlistDropdown.contains(e.target)) watchlistDropdown.classList.add('hidden');
      if (!searchBtn.contains(e.target) && !searchBar.contains(e.target)) searchBar.classList.add('hidden');
    });

    // attach video listeners placeholder (modal video element created on demand)
    function safeAttach() { setTimeout(()=> attachVideoListeners(), 200); }

    // init on DOMContentLoaded
    window.addEventListener('DOMContentLoaded', () => {
      initPage();
      // Player close controls are wired by the body.html-style player engine.
    });
  </script>
