<!--
ULTRON SERIES PAGE TEMPLATE
USAGE:
1. Duplicate this file and rename it to the new series slug.
2. Edit only SERIES_CONFIG and EPISODES in the first script block.
3. Add one episode object per episode. Season numbers generate the selector.
4. Upcoming episode: video:"00", releaseAt:"2026-12-20T21:00:00+05:30".
5. Use full HTTPS image and video URLs. Put the full YouTube watch URL in trailer.
6. Adjust the theme hex colors and logoIcon for each series.
7. Do not change the shared rendering/player code or the advertisement block.
8. Test desktop, mobile, every season, trailer and one episode before publishing.
This template is a starting file: duplicate it; do not use it as a live series page.
-->

.series-hero-inner{position:relative;z-index:1;min-height:inherit;display:grid;grid-template-columns:minmax(170px,245px) minmax(0,1fr);align-items:center;gap:clamp(24px,4vw,58px);padding:clamp(22px,4vw,48px)}

}

.footer{border-top:1px solid var(--line);padding:25px 0 35px;color:#8f858c;font-size:10px}.footer-inner{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media(max-width:900px){.episode-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{min-height:clamp(520px,calc(100svh - 68px),760px)}.hero-inner{grid-template-columns:minmax(175px,28%) minmax(0,1fr);gap:clamp(20px,4vw,38px);padding:28px clamp(22px,5vw,52px)}.about{grid-template-columns:1fr}}

-wrapper{aspect-ratio:16/9;flex:none}.player-meta{flex-direction:column;align-items:stretch;padding:13px;gap:12px}.controls-row{justify-content:center;gap:8px}.player-btn{height:43px;min-width:45px;padding:0 10px}.meta-left{padding-right:45px}.player-meta h3{font-size:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* Advertisement layout safety: keep fixed-size ad creatives inside the page */
.ad-slot{display:flex;justify-content:center;align-items:flex-start;width:100%;max-width:100%;min-width:0;overflow:hidden;box-sizing:border-box;margin:20px auto!important;padding:0 12px}

 html,body{max-width:100%;overflow-x:clip}

<div class="ambient"></div>
<nav class="topbar"><div class="shell topbar-inner"><a class="brand" href="#top"><span class="brand-mark"><i id="brandIcon" class="fa-solid fa-clapperboard"></i></span><span id="brandName">SERIES TITLE</span></a><a class="top-link" href="series.html"><i class="fa-solid fa-arrow-left"></i> Back to series</a></div></nav>
<main class="shell" id="top">
<section class="series-hero-shell" aria-label="Featured series">
  <div class="series-hero" id="seriesHero">
    <div class="series-hero-bg" id="seriesHeroVideo" aria-hidden="true" style="background-image:url('https://image.tmdb.org/t/p/w500/4MwXkOAMd9ObxdacasPFM32n9dZ.jpg')">

<div id="playbackModal" class="modal-backdrop" aria-hidden="true">
 <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="player-wrapper" id="playerWrapper"><video id="modalVideo" controls playsinline preload="metadata"></video><button id="topCloseBtn" aria-label="Close player"><i class="fa-solid fa-xmark"></i></button></div>
  <div class="player-meta"><div class="meta-left"><h3 id="modalTitle">Series Title</h3><p id="modalDesc">Season 1</p></div>
   <div class="controls-row"><button class="player-btn" id="prevBtn" aria-label="Previous episode"><i class="fa-solid fa-backward-step"></i> <span>Prev</span></button><button class="player-btn" id="playPauseBtn" aria-label="Play or pause"><i class="fa-solid fa-play"></i></button><button class="player-btn" id="nextBtn" aria-label="Next episode"><span>Next</span> <i class="fa-solid fa-forward-step"></i></button><button class="player-btn" id="fullscreenBtn" aria-label="Fullscreen"><i class="fa-solid fa-expand"></i></button><button class="player-btn" id="muteBtn" aria-label="Mute"><i class="fa-solid fa-volume-high"></i></button><button class="player-btn close" id="closeBtn" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
  </div>
 </div>
</div>

<script>
/*
ULTRON SERIES TEMPLATE — EDIT ONLY SERIES_CONFIG AND EPISODES.
Duplicate this file for each new series. Do not edit the renderer/player below.
*/
const SERIES_CONFIG = {
 title:"ADD SERIES TITLE", year:"2026", status:"2026–", network:"ADD NETWORK",
 language:"English", rating:"TV-MA", genre:"Drama · Thriller",
 poster:"ADD POSTER IMAGE URL", trailer:"ADD FULL YOUTUBE URL",
 trailerBackground:true, logoIcon:"fa-clapperboard", tagline:"ORIGINAL SERIES",
 description:"ADD SHORT HERO SYNOPSIS.", overview:"ADD FULL SERIES OVERVIEW.",
 creator:"", basedOn:"", premiere:"", production:"", imdb:"",
 theme:{bg:"#09080d",panel:"#14121a",accent:"#a8d8ff",accent2:"#315b91",gold:"#d5c9ff"},
 cast:["Add cast member"]
};
/*
EPISODES: one entry per episode, all seasons.
For upcoming episodes set video:"00" and releaseAt to an ISO date/time
including timezone, e.g. "2026-12-20T21:00:00+05:30".
*/
const EPISODES = [
 {season:1,episode:1,title:"ADD EPISODE TITLE",description:"ADD EPISODE DESCRIPTION",runtime:"",video:"ADD VIDEO URL",image:"ADD EPISODE IMAGE URL",releaseAt:""}
];

// ================ SHARED TEMPLATE ENGINE — LEAVE UNCHANGED ================
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const validUrl=v=>/^https?:\/\//i.test(String(v||""));
const seasons=[...new Set(EPISODES.map(e=>Number(e.season)).filter(n=>Number.isInteger(n)&&n>0))].sort((a,b)=>a-b);
function youtubeId(url){try{const u=new URL(url);return u.searchParams.get("v")||(u.hostname.includes("youtu.be")?u.pathname.split("/").filter(Boolean)[0]:"")}catch(e){return ""}}
function applyConfig(){
 const c=SERIES_CONFIG;
 document.title=(c.title||"Series")+" | Series Guide";
 const m=document.querySelector('meta[name="description"]');if(m)m.content="Explore "+c.title+": series information, episodes and trailer.";
 document.querySelector('meta[name="theme-color"]').content=c.theme.bg;
 Object.entries({bg:c.theme.bg,panel:c.theme.panel,rose:c.theme.accent,red:c.theme.accent2,gold:c.theme.gold}).forEach(([k,v])=>document.documentElement.style.setProperty("--"+k,v));
 $("brandName").innerHTML=esc(c.title)+" <span style=\"color:var(--rose)\">/ "+esc(c.network)+"</span>";
 $("brandIcon").className="fa-solid "+(c.logoIcon||"fa-clapperboard");
 $("seriesKicker").textContent=c.tagline||"ORIGINAL SERIES";
 $("seriesTitle").textContent=c.title;$("seriesDescription").textContent=c.description;
 $("seriesOverview").textContent=c.overview||c.description;
 $("seriesPoster").src=validUrl(c.poster)?c.poster:"";$("seriesPoster").alt=c.title+" poster";
 $("seriesHeroVideo").style.backgroundImage=validUrl(c.poster)?"url('"+c.poster.replace(/'/g,"%27")+"')":"none";
 const id=youtubeId(c.trailer),frame=$("seriesHeroTrailer");
 if(c.trailerBackground&&id){frame.src="https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1&mute=1&controls=0&loop=1&playlist="+id+"&playsinline=1&rel=0&modestbranding=1"}else{frame.removeAttribute("src");frame.style.display="none"}
 $("seriesMeta").innerHTML=[c.status||c.year,c.genre,c.language,c.rating].filter(Boolean).map(x=>"<span>"+esc(x)+"</span>").join("");
 $("productionDetails").innerHTML=[c.creator?"<strong>Created by:</strong> "+esc(c.creator):"",c.basedOn?"<strong>Based on:</strong> "+esc(c.basedOn):"",c.network?"<strong>Network:</strong> "+esc(c.network):"",c.premiere?"<strong>Premiere:</strong> "+esc(c.premiere):"",c.production?"<strong>Production:</strong> "+esc(c.production):"", "<strong>Seasons:</strong> "+seasons.length+" · <strong>Episodes:</strong> "+EPISODES.length].filter(Boolean).join("<br>");
 $("castList").innerHTML=(c.cast||[]).map(x=>'<span class="cast-chip">'+esc(x)+'</span>').join("");
 $("footerBrand").textContent=(c.title||"SERIES")+" · "+(c.year||"");
 if(validUrl(c.imdb))$("imdbLink").href=c.imdb;else $("imdbLink").style.display="none";
}
function episodeAvailable(ep){
 if(!ep.releaseAt)return ep.video!=="00"&&validUrl(ep.video);
 const t=new Date(ep.releaseAt).getTime();
 return Number.isFinite(t)&&Date.now()>=t&&ep.video!=="00"&&validUrl(ep.video);
}
function releaseDate(ep){
 if(!ep.releaseAt)return "Release date to be announced";
 const d=new Date(ep.releaseAt);
 return Number.isFinite(d.getTime())?new Intl.DateTimeFormat(undefined,{day:"numeric",month:"long",year:"numeric"}).format(d):"Release date to be announced";
}
function renderSeasonOptions(){
 $("seasonSelect").innerHTML=seasons.map(n=>'<option value="'+n+'">Season '+n+'</option>').join("");
 if(seasons.length)$("seasonSelect").value=String(seasons[0]);
 $("episodeOverline").textContent="EPISODE ARCHIVE · "+seasons.length+" SEASON"+(seasons.length===1?"":"S");
}
const grid=$("episodeGrid"),search=$("episodeSearch"),seasonSelect=$("seasonSelect");
let currentList=[],currentIndex=0,currentHls=null,currentShaka=null;
function renderEpisodes(){
 const season=Number(seasonSelect.value),q=search.value.trim().toLowerCase();
 currentList=EPISODES.filter(e=>Number(e.season)===season&&(String(e.title).toLowerCase().includes(q)||String(e.description||"").toLowerCase().includes(q)));
 $("seasonDescription").textContent="Season "+season+" · "+EPISODES.filter(e=>Number(e.season)===season).length+" episodes";
 grid.innerHTML="";
 if(!currentList.length){grid.innerHTML='<div style="grid-column:1/-1;padding:25px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)">No episodes match your search.</div>';return}
 currentList.forEach(ep=>{
  const ready=episodeAvailable(ep),date=releaseDate(ep),poster=validUrl(SERIES_CONFIG.poster)?SERIES_CONFIG.poster:"";
  const img=ready&&validUrl(ep.image)?ep.image:poster;
  const card=document.createElement("article");card.className="episode-card";card.tabIndex=ready?0:-1;card.setAttribute("role",ready?"button":"group");
  card.setAttribute("aria-label",ready?"Play "+ep.title:"Episode "+ep.episode+" releases "+date);
  card.innerHTML='<div class="episode-image-wrap"><img class="episode-image" loading="lazy" src="'+esc(img)+'" alt="'+esc(ep.title)+'"><span class="episode-number">S'+ep.season+' · EP '+String(ep.episode).padStart(2,"0")+'</span>'+
   (ready?'<span class="episode-play"><span><i class="fa-solid fa-play"></i></span></span>':'<span style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:12px;text-align:center;background:linear-gradient(180deg,rgba(5,12,25,.32),rgba(5,12,25,.88));color:#fff"><strong style="font-size:11px;letter-spacing:3px;color:var(--rose)">COMING SOON</strong><span style="font-size:clamp(16px,3vw,24px);font-weight:800">'+esc(date)+'</span><small style="font-size:10px;letter-spacing:2px;color:#d7e8fa">SEASON '+ep.season+' · EPISODE '+String(ep.episode).padStart(2,"0")+'</small></span>')+
   '</div><div class="episode-info"><div class="episode-kicker">SEASON '+ep.season+' · '+(ready?"AVAILABLE":"UPCOMING")+'</div><h3 class="episode-title">'+esc(ep.title)+'</h3><p class="episode-description">'+esc(ep.description||"")+'</p><div class="episode-runtime"><i class="fa-regular fa-clock"></i> '+esc(ep.runtime||(ready?"Episode guide":"Release date · "+date))+'</div></div>';
  if(ready){const play=()=>openPlayer(currentList,currentList.indexOf(ep));card.addEventListener("click",play);card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();play()}})}
  grid.appendChild(card);
 });
}
search.addEventListener("input",renderEpisodes);seasonSelect.addEventListener("change",renderEpisodes);
const modal=$("playbackModal"),playerWrapper=$("playerWrapper"),modalTitle=$("modalTitle"),modalDesc=$("modalDesc"),playPauseBtn=$("playPauseBtn"),muteBtn=$("muteBtn");
function destroyEngines(){if(currentHls){try{currentHls.destroy()}catch(e){}currentHls=null}if(currentShaka){try{currentShaka.destroy()}catch(e){}currentShaka=null}}
function resetPlayer(){destroyEngines();playerWrapper.innerHTML='<video id="modalVideo" controls playsinline preload="metadata"></video><button id="topCloseBtn" aria-label="Close player"><i class="fa-solid fa-xmark"></i></button>';$("topCloseBtn").addEventListener("click",closePlayer)}
function closePlayer(){const v=$("modalVideo");if(v){try{v.pause();v.removeAttribute("src");v.load()}catch(e){}}resetPlayer();modal.classList.remove("active");modal.setAttribute("aria-hidden","true");document.body.style.overflow="";playPauseBtn.innerHTML='<i class="fa-solid fa-play"></i>'}
function isHls(u){return /\.m3u8($|\?)/i.test(u)||/index.*\.txt/i.test(u)||/manifest|master/i.test(u)}
function isMp4(u){return /\.(mp4|webm|mp3)($|\?)/i.test(u)}
function isYouTube(u){return /youtube\.com|youtu\.be|youtube-nocookie\.com/i.test(u)}
async function openPlayer(list,index){
 if(!Array.isArray(list)||index<0||index>=list.length)return;
 currentList=list;currentIndex=index;const item=list[index];modalTitle.textContent=item.title||SERIES_CONFIG.title;
 modalDesc.textContent=SERIES_CONFIG.title+" · "+(item.season?"Season "+item.season+" · ":"")+("Episode "+item.episode);
 resetPlayer();modal.classList.add("active");modal.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";
 const src=typeof item.video==="object"&&item.video!==null?(item.video.high||item.video.medium||item.video.low||item.video.mpd||Object.values(item.video)[0]):item.video;
 if(!src||src==="00"){modalDesc.textContent+=" · Video source not supplied";return}
 const v=$("modalVideo"),lower=String(src).toLowerCase();
 if(typeof item.video==="object"&&item.video!==null&&item.video.mpd&&window.shaka){try{currentShaka=new shaka.Player(v);if(item.video.key){const p=item.video.key.split(":");currentShaka.configure({drm:{clearKeys:{[p[0]]:p[1]}}})}await currentShaka.load(item.video.mpd);v.play().catch(()=>{});return}catch(e){modalDesc.textContent+=" · Stream could not be loaded";return}}
 if(isYouTube(src)){const id=youtubeId(src),url=id?"https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1&rel=0&modestbranding=1":src;playerWrapper.innerHTML='<iframe src="'+esc(url)+'" title="Series video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe><button id="topCloseBtn" aria-label="Close player"><i class="fa-solid fa-xmark"></i></button>';$("topCloseBtn").addEventListener("click",closePlayer);return}
 const hosts=["turboembed.com","streamtape.com","dood","vidcdn","ok.ru","mega.nz","drive.google.com","voe.sx","filemoon","mixdrop","dailymotion.com"];
 if(hosts.some(h=>lower.includes(h))&&!isHls(src)&&!isMp4(src)){playerWrapper.innerHTML='<iframe src="'+esc(src)+'" title="Series episode player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe><button id="topCloseBtn" aria-label="Close player"><i class="fa-solid fa-xmark"></i></button>';$("topCloseBtn").addEventListener("click",closePlayer);return}
 if(isHls(src)){if(window.Hls&&Hls.isSupported()){currentHls=new Hls({enableWorker:true,maxBufferLength:30,maxMaxBufferLength:60,backBufferLength:30});currentHls.loadSource(src);currentHls.attachMedia(v);currentHls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));currentHls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){if(d.type===Hls.ErrorTypes.NETWORK_ERROR)currentHls.startLoad();else if(d.type===Hls.ErrorTypes.MEDIA_ERROR)currentHls.recoverMediaError();else modalDesc.textContent+=" · Playback error"}})}else if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=src;v.play().catch(()=>{})}return}
 if(isMp4(src)){v.src=src;v.play().catch(()=>{});return}
 if(validUrl(src)){playerWrapper.innerHTML='<iframe src="'+esc(src)+'" title="Series episode player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe><button id="topCloseBtn" aria-label="Close player"><i class="fa-solid fa-xmark"></i></button>';$("topCloseBtn").addEventListener("click",closePlayer);return}
 modalDesc.textContent+=" · Unsupported video source";
}
function playNext(){if(currentIndex<currentList.length-1)openPlayer(currentList,currentIndex+1)}
function playPrev(){if(currentIndex>0)openPlayer(currentList,currentIndex-1)}
function togglePlayPause(){const v=$("modalVideo");if(!v)return;if(v.paused){v.play().catch(()=>{});playPauseBtn.innerHTML='<i class="fa-solid fa-pause"></i>'}else{v.pause();playPauseBtn.innerHTML='<i class="fa-solid fa-play"></i>'}}
function toggleFullscreen(){const el=$("modalVideo")||playerWrapper.querySelector("iframe");if(!el)return;const fn=el.requestFullscreen||playerWrapper.requestFullscreen;if(!document.fullscreenElement&&fn)Promise.resolve(fn.call(el)).catch(()=>{});else if(document.exitFullscreen)document.exitFullscreen()}
function toggleMute(){const v=$("modalVideo");if(!v)return;v.muted=!v.muted;muteBtn.innerHTML=v.muted?'<i class="fa-solid fa-volume-xmark"></i>':'<i class="fa-solid fa-volume-high"></i>'}
$("prevBtn").addEventListener("click",playPrev);$("nextBtn").addEventListener("click",playNext);playPauseBtn.addEventListener("click",togglePlayPause);$("fullscreenBtn").addEventListener("click",toggleFullscreen);muteBtn.addEventListener("click",toggleMute);$("closeBtn").addEventListener("click",closePlayer);$("topCloseBtn").addEventListener("click",closePlayer);
modal.addEventListener("click",e=>{if(e.target===modal)closePlayer()});document.addEventListener("keydown",e=>{if(!modal.classList.contains("active"))return;if(e.key==="Escape")closePlayer();if(e.key==="ArrowRight")playNext();if(e.key==="ArrowLeft")playPrev()});
$("trailerBtn").addEventListener("click",()=>{if(validUrl(SERIES_CONFIG.trailer))openPlayer([{title:SERIES_CONFIG.title+" — Official Trailer",season:0,episode:0,video:SERIES_CONFIG.trailer}],0)});
applyConfig();renderSeasonOptions();renderEpisodes();
</script>
