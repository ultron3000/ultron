<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>स्वराज्य – Movies & TV Serials</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Hind:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap');

    :root {
      --bg-dark: #07050a;
      --saffron-main: #f97316;
      --gold-main: #eab308;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg-dark);
    }

    body {
      margin: 0;
      font-family: 'Hind', 'Poppins', sans-serif;
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(234, 179, 8, 0.06) 0px, transparent 50%);
      background-attachment: fixed;
      color: #f8fafc;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* Logo animation - lightweight */
    @keyframes pulseGlow {
      0%, 100% {
        filter: drop-shadow(0 0 7px rgba(249, 115, 22, 0.55));
        transform: scale(1);
      }

      50% {
        filter: drop-shadow(0 0 13px rgba(249, 115, 22, 0.8));
        transform: scale(1.02);
      }
    }

    .logo-pulse {
      animation: pulseGlow 3.5s infinite ease-in-out;
      will-change: filter, transform;
    }

    .royal-gradient-text {
      background: linear-gradient(
        135deg,
        #FFF099 0%,
        #F97316 50%,
        #EAB308 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Movie cards */
    .movie-card {
      background: rgba(18, 14, 24, 0.88);
      border: 1px solid rgba(249, 115, 22, 0.18);
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
      contain: layout paint;
    }

    .movie-card:hover {
      transform: translateY(-4px);
      border-color: rgba(234, 179, 8, 0.6);
      box-shadow: 0 10px 22px -8px rgba(249, 115, 22, 0.3);
    }

    .glass-nav {
      background: rgba(10, 7, 14, 0.94);
      border-bottom: 1px solid rgba(249, 115, 22, 0.2);
    }

    /* =========================================================
       MODAL
       ========================================================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 12px;

      background: rgba(3, 2, 5, 0.96);

      /* Removed expensive backdrop-filter blur.
         This makes opening/closing the player much smoother. */
    }

    .modal-backdrop.active {
      display: flex;
    }

    /* Main player modal */
    .player-modal {
      width: 100%;
      max-width: 1180px;

      background: #080808;
      border: 1px solid rgba(249, 115, 22, 0.42);
      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.75),
        0 0 35px rgba(249, 115, 22, 0.08);

      display: flex;
      flex-direction: column;

      max-height: calc(100vh - 24px);
    }

    /* =========================================================
       PLAYER VIEWPORT

       IMPORTANT:
       Do not use flex:1 + h-full for Google Drive.
       Google Drive's iframe works much better when it gets
       an explicit aspect-ratio viewport.
       ========================================================= */

    .player-wrapper {
      position: relative;
      width: 100%;

      background: #000;

      /* Stable cinematic player size */
      aspect-ratio: 16 / 9;

      min-height: 0;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 1;
    }

    /* Native video */
    .player-wrapper video {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;

      background: #000;

      border: 0;
    }

    /* Google Drive iframe */
    .drive-player {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      border: 0;

      background: #000;

      /*
       * Prevent iframe from creating strange inline spacing.
       */
      vertical-align: middle;
    }

    /* Small loading overlay */
    .player-loading {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;

      z-index: 5;

      pointer-events: none;

      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .player-loading.active {
      opacity: 1;
    }

    .loading-spinner {
      width: 34px;
      height: 34px;

      border-radius: 50%;

      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #f97316;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       MODAL BOTTOM BAR
       ========================================================= */

    .player-info-bar {
      flex: 0 0 auto;

      background: #101010;

      border-top: 1px solid rgba(249, 115, 22, 0.18);

      padding: 10px 12px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .player-title-area {
      min-width: 0;
      flex: 1;
    }

    .player-buttons {
      flex: 0 0 auto;

      display: flex;
      align-items: center;
      justify-content: flex-end;

      gap: 6px;

      flex-wrap: wrap;
    }

    /* Fullscreen state */
    .player-wrapper:fullscreen {
      width: 100vw;
      height: 100vh;

      max-width: none;
      max-height: none;

      aspect-ratio: auto;

      background: #000;
    }

    .player-wrapper:-webkit-full-screen {
      width: 100vw;
      height: 100vh;

      max-width: none;
      max-height: none;

      aspect-ratio: auto;

      background: #000;
    }

    .player-wrapper:fullscreen .drive-player,
    .player-wrapper:-webkit-full-screen .drive-player {
      width: 100%;
      height: 100%;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 640px) {

      .modal-backdrop {
        padding: 0;
        align-items: center;
      }

      .player-modal {
        width: 100%;
        max-width: none;

        border-radius: 0;

        border-left: 0;
        border-right: 0;

        max-height: 100vh;
      }

      .player-wrapper {
        /*
         * 16:9 keeps Google Drive controls from being squeezed.
         */
        aspect-ratio: 16 / 9;

        width: 100%;
      }

      .player-info-bar {
        padding: 9px;

        flex-direction: column;
        align-items: stretch;

        gap: 8px;
      }

      .player-title-area {
        width: 100%;

        display: flex;
        justify-content: center;
      }

      .player-buttons {
        width: 100%;

        justify-content: center;
      }

      .player-buttons button,
      .player-buttons a {
        min-height: 32px;
      }
    }

    /* Very short landscape phones */
    @media (max-height: 500px) and (orientation: landscape) {

      .modal-backdrop {
        padding: 0;
      }

      .player-modal {
        max-height: 100vh;
        border-radius: 0;
      }

      .player-wrapper {
        aspect-ratio: 16 / 9;
      }

      .player-info-bar {
        padding: 5px 8px;
      }
    }

    /* =========================================================
       PERFORMANCE
       ========================================================= */

    img {
      content-visibility: auto;
    }

    #movies,
    #tvShows {
      contain: layout;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #07050a;
    }

    ::-webkit-scrollbar-thumb {
      background: #c2410c;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #ea580c;
    }
  </style>
</head>

    /* =========================================================

    const movieCount = document.getElementById('movieCount');

    const moviesContainer = document.getElementById('movies');

    const closeBtn = document.getElementById('closeBtn');

    const externalDriveBtn =
      document.getElementById('externalDriveBtn');

    const playerLoading =
      document.getElementById('playerLoading');


    /* =========================================================
       STATE
       ========================================================= */

    let currentList = [];
    let currentIndex = 0;
    let currentHls = null;

    let openRequestId = 0;


    /* =========================================================
       COUNTERS
       ========================================================= */

    movieCount.textContent = movies.length + ' चित्रपट';
    tvCount.textContent = tvShows.length + ' मालिका';


    /* =========================================================
       HELPERS
       ========================================================= */

    function isYouTube(item) {
      return (
        item.isExternal ||
        item.video.includes('youtube.com') ||
        item.video.includes('youtu.be')
      );
    }


    function isGoogleDrive(item) {
      return item.video.includes('drive.google.com');
    }


    function showLoading() {
      playerLoading.classList.add('active');
    }


    function hideLoading() {
      playerLoading.classList.remove('active');
    }


    /* =========================================================
       RENDER CARDS
       ========================================================= */

    function render(list, targetElement) {

      const fragment = document.createDocumentFragment();

      list.forEach((item, index) => {

        const card = document.createElement('div');

        card.className =
          'movie-card group rounded-xl overflow-hidden cursor-pointer flex flex-col justify-between';


        const youtube = isYouTube(item);


        card.innerHTML = `
          <div class="relative w-full aspect-[2/3] overflow-hidden bg-black/40">

            <img
              src="${item.image}"
              alt="${item.title}"
              class="w-full h-full object-cover group-hover:scale-105 transition duration-200"
              loading="lazy"
              decoding="async"
            >

            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent opacity-70"></div>

            <div class="absolute top-2 right-2">

              <span
                class="px-2 py-0.5 rounded text-[10px] font-bold
                ${youtube
                  ? 'bg-red-600/90 text-white'
                  : 'bg-orange-600/90 text-white'}
                backdrop-blur-sm shadow"
              >
                ${youtube ? 'YouTube' : 'Movie'}
              </span>

            </div>

            <div
              class="absolute inset-0 flex items-center justify-center
              opacity-0 group-hover:opacity-100 transition duration-150"
            >

              <span
                class="w-12 h-12 rounded-full
                ${youtube ? 'bg-red-600' : 'bg-orange-600'}
                text-white flex items-center justify-center shadow-lg"
              >
                <i
                  class="${youtube
                    ? 'fa-brands fa-youtube'
                    : 'fas fa-play'} text-lg"
                ></i>
              </span>

            </div>

          </div>

          <div class="p-3">

            <h3
              class="text-xs sm:text-sm font-semibold text-gray-200
              line-clamp-1 group-hover:text-amber-400 transition"
            >
              ${item.title}
            </h3>

          </div>
        `;


        card.addEventListener('click', () => {

          if (youtube) {

            window.open(
              item.video,
              '_blank',
              'noopener,noreferrer'
            );

          } else {

            openPlayer(list, index);

          }

        }, { passive: true });


        fragment.appendChild(card);

      });


      targetElement.appendChild(fragment);
    }


    render(movies, moviesContainer);
    render(tvShows, tvContainer);


    /* =========================================================
       DESTROY CURRENT PLAYER
       ========================================================= */

    function destroyCurrentPlayer() {

      if (currentHls) {

        try {
          currentHls.destroy();
        } catch (e) {}

        currentHls = null;
      }


      const oldVideo =
        document.getElementById('modalVideo');

      if (oldVideo) {

        try {
          oldVideo.pause();
          oldVideo.removeAttribute('src');
          oldVideo.load();
        } catch (e) {}

      }


      /*
       * Clear the player viewport completely.
       */
      wrapper.innerHTML = '';


      /*
       * Re-create native video element.
       */
      const video = document.createElement('video');

      video.id = 'modalVideo';

      video.className =
        'w-full h-full object-contain';

      video.controls = true;
      video.playsInline = true;
      video.preload = 'metadata';

      wrapper.appendChild(video);


      /*
       * Re-add loading overlay.
       */
      const loading = document.createElement('div');

      loading.id = 'playerLoading';

      loading.className = 'player-loading';

      loading.innerHTML =
        '<div class="loading-spinner"></div>';

      wrapper.appendChild(loading);

      playerLoadingRef = loading;
    }


    let playerLoadingRef = playerLoading;


    /* =========================================================
       OPEN PLAYER
       ========================================================= */

    function openPlayer(list, index) {

      const requestId = ++openRequestId;

      currentList = list;
      currentIndex = index;

      const item = list[index];


      /*
       * Update title immediately.
       */
      titleBox.textContent = item.title;


      /*
       * Stop existing player.
       */
      if (currentHls) {

        try {
          currentHls.destroy();
        } catch (e) {}

        currentHls = null;
      }


      wrapper.innerHTML = '';


      /*
       * Open modal before loading.
       */
      modal.classList.add('active');

      modal.setAttribute('aria-hidden', 'false');

      document.body.style.overflow = 'hidden';


      /*
       * Drive external button.
       */
      if (isGoogleDrive(item)) {

        const driveUrl =
          convertDriveToPreview(item.video);

        externalDriveBtn.href = driveUrl;

        externalDriveBtn.classList.remove('hidden');
        externalDriveBtn.classList.add('flex');

      } else {

        externalDriveBtn.classList.add('hidden');
        externalDriveBtn.classList.remove('flex');

        externalDriveBtn.href = '#';
      }


      /*
       * Disable previous / next appropriately.
       */
      prevBtn.disabled = currentIndex <= 0;
      nextBtn.disabled =
        currentIndex >= currentList.length - 1;


      prevBtn.style.opacity =
        currentIndex <= 0 ? '0.45' : '1';

      nextBtn.style.opacity =
        currentIndex >= currentList.length - 1 ? '0.45' : '1';


      /* =======================================================
         GOOGLE DRIVE
         ======================================================= */

      if (isGoogleDrive(item)) {

        showLoading();


        const embedUrl =
          convertDriveToPreview(item.video);


        const iframe =
          document.createElement('iframe');


        iframe.className = 'drive-player';

        iframe.src = embedUrl;

        iframe.title = item.title;

        /*
         * These permissions are important for the Google Drive
         * embedded player, especially fullscreen/autoplay.
         */
        iframe.setAttribute(
          'allow',
          'autoplay; encrypted-media; fullscreen; picture-in-picture'
        );

        iframe.setAttribute(
          'allowfullscreen',
          ''
        );

        iframe.setAttribute(
          'webkitallowfullscreen',
          ''
        );

        iframe.setAttribute(
          'mozallowfullscreen',
          ''
        );

        iframe.setAttribute(
          'referrerpolicy',
          'strict-origin-when-cross-origin'
        );


        /*
         * Hide loading once iframe has loaded.
         *
         * Note: "load" means the iframe document loaded,
         * not necessarily that the actual movie has buffered.
         */
        iframe.addEventListener('load', () => {

          if (requestId !== openRequestId) return;

          hideLoading();

        }, { once: true });


        wrapper.appendChild(iframe);


        /*
         * Safety timeout so spinner cannot remain forever.
         */
        setTimeout(() => {

          if (requestId === openRequestId) {
            hideLoading();
          }

        }, 5000);


        return;
      }


      /* =======================================================
         HLS
         ======================================================= */

      if (item.video.includes('.m3u8')) {

        const video =
          document.createElement('video');

        video.id = 'modalVideo';

        video.className =
          'w-full h-full object-contain';

        video.controls = true;
        video.playsInline = true;
        video.preload = 'metadata';

        wrapper.appendChild(video);


        const loading =
          document.createElement('div');

        loading.className = 'player-loading active';

        loading.innerHTML =
          '<div class="loading-spinner"></div>';

        wrapper.appendChild(loading);


        if (Hls.isSupported()) {

          currentHls = new Hls({
            enableWorker: true,

            /*
             * Keep buffering reasonable instead of allowing
             * huge background buffers that can increase memory use.
             */
            maxBufferLength: 30,
            maxMaxBufferLength: 60,

            lowLatencyMode: false
          });


          currentHls.loadSource(item.video);

          currentHls.attachMedia(video);


          currentHls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

              loading.classList.remove('active');

              if (requestId !== openRequestId) return;

              video.play().catch(() => {});

            }
          );


          currentHls.on(
            Hls.Events.ERROR,
            (event, data) => {

              if (data && data.fatal) {

                loading.classList.remove('active');

                console.warn(
                  'HLS playback error:',
                  data
                );
              }

            }
          );

        } else if (
          video.canPlayType(
            'application/vnd.apple.mpegurl'
          )
        ) {

          video.src = item.video;

          video.addEventListener(
            'loadedmetadata',
            () => {

              loading.classList.remove('active');

              video.play().catch(() => {});

            },
            { once: true }
          );

        }


        return;
      }


      /* =======================================================
         NORMAL VIDEO
         ======================================================= */

      const video =
        document.createElement('video');

      video.id = 'modalVideo';

      video.className =
        'w-full h-full object-contain';

      video.controls = true;
      video.playsInline = true;
      video.preload = 'metadata';

      video.src = item.video;


      wrapper.appendChild(video);


      const loading =
        document.createElement('div');

      loading.className =
        'player-loading active';

      loading.innerHTML =
        '<div class="loading-spinner"></div>';

      wrapper.appendChild(loading);


      video.addEventListener(
        'loadedmetadata',
        () => {

          loading.classList.remove('active');

        },
        { once: true }
      );


      video.addEventListener(
        'canplay',
        () => {

          loading.classList.remove('active');

          video.play().catch(() => {});

        },
        { once: true }
      );

    }


    /* =========================================================
       GOOGLE DRIVE URL CONVERTER
       ========================================================= */

    function convertDriveToPreview(url) {

      if (!url) return '';

      /*
       * Already a preview URL.
       */
      if (url.includes('/preview')) {

        return url;
      }


      /*
       * /view URL
       */
      const viewMatch =
        url.match(/\/file\/d\/([^/]+)/);


      if (viewMatch && viewMatch[1]) {

        return (
          'https://drive.google.com/file/d/' +
          viewMatch[1] +
          '/preview'
        );

      }


      /*
       * Fallback.
       */
      return url
        .replace('/view', '/preview')
        .replace('/edit', '/preview');

    }


    /* =========================================================
       CLOSE PLAYER
       ========================================================= */

    function closeModal() {

      openRequestId++;


      /*
       * Exit fullscreen first.
       */
      try {

        if (document.fullscreenElement) {
          document.exitFullscreen();
        }

      } catch (e) {}


      /*
       * Destroy HLS.
       */
      if (currentHls) {

        try {
          currentHls.destroy();
        } catch (e) {}

        currentHls = null;
      }


      /*
       * Stop native video.
       */
      const video =
        document.getElementById('modalVideo');

      if (video) {

        try {
          video.pause();
          video.removeAttribute('src');
          video.load();
        } catch (e) {}

      }


      /*
       * Remove iframe/video.
       */
      wrapper.innerHTML = '';


      /*
       * Close modal.
       */
      modal.classList.remove('active');

      modal.setAttribute('aria-hidden', 'true');

      document.body.style.overflow = '';


      currentList = [];
      currentIndex = 0;

    }


    /* =========================================================
       PREVIOUS
       ========================================================= */

    prevBtn.addEventListener('click', () => {

      if (currentIndex > 0) {

        openPlayer(
          currentList,
          currentIndex - 1
        );

      }

    });


    /* =========================================================
       NEXT
       ========================================================= */

    nextBtn.addEventListener('click', () => {

      if (
        currentIndex <
        currentList.length - 1
      ) {

        openPlayer(
          currentList,
          currentIndex + 1
        );

      }

    });


    /* =========================================================
       CLOSE BUTTON
       ========================================================= */

    closeBtn.addEventListener(
      'click',
      closeModal
    );


    /* =========================================================
       FULLSCREEN
       ========================================================= */

    fullscreenBtn.addEventListener(
      'click',
      async () => {

        try {

          if (
            !document.fullscreenElement &&
            !document.webkitFullscreenElement
          ) {

            if (wrapper.requestFullscreen) {

              await wrapper.requestFullscreen();

            } else if (
              wrapper.webkitRequestFullscreen
            ) {

              wrapper.webkitRequestFullscreen();

            }

          } else {

            if (document.exitFullscreen) {

              await document.exitFullscreen();

            } else if (
              document.webkitExitFullscreen
            ) {

              document.webkitExitFullscreen();

            }

          }

        } catch (error) {

          console.warn(
            'Fullscreen unavailable:',
            error
          );

        }

      }
    );


    /* =========================================================
       CLICK OUTSIDE MODAL
       ========================================================= */

    modal.addEventListener('click', (event) => {

      if (event.target === modal) {
        closeModal();
      }

    });


    /* =========================================================
       ESCAPE KEY
       ========================================================= */

    document.addEventListener('keydown', (event) => {

      if (
        event.key === 'Escape' &&
        modal.classList.contains('active')
      ) {

        closeModal();

      }

    });


    /* =========================================================
       KEYBOARD NEXT / PREVIOUS
       ========================================================= */

    document.addEventListener('keydown', (event) => {

      if (!modal.classList.contains('active')) {
        return;
      }


      /*
       * Don't interfere while typing.
       */
      if (
        event.target.tagName === 'INPUT' ||
        event.target.tagName === 'TEXTAREA'
      ) {
        return;
      }


      if (event.key === 'ArrowLeft') {

        if (currentIndex > 0) {

          openPlayer(
            currentList,
            currentIndex - 1
          );

        }

      }


      if (event.key === 'ArrowRight') {

        if (
          currentIndex <
          currentList.length - 1
        ) {

          openPlayer(
            currentList,
            currentIndex + 1
          );

        }

      }

    });


    /* =========================================================
       PREVENT BODY SCROLL WHEN MODAL IS OPEN
       ========================================================= */

    window.addEventListener(
      'resize',
      () => {

        if (
          modal.classList.contains('active')
        ) {

          /*
           * The iframe itself uses width/height:100%,
           * so browser resize automatically recalculates it.
           */

        }

      },
      { passive: true }
    );

  </script>
