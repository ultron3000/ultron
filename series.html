<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudTV Store | Ultimate Multiverse Series Hub</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#030712',
            lightbg: '#f1f5f9',
          }
        }
      }
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    /* 3D Depth Perspective Setup */
    .grid-container {
      perspective: 1400px;
    }

    /* Hardware Accelerated Smooth 3D Cards */
    .series-card {
      will-change: transform, box-shadow;
      transform: translateZ(0);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                  box-shadow 0.4s ease, 
                  border-color 0.3s ease;
      transform-style: preserve-3d;
    }

    .series-card img {
      will-change: transform, filter;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.5s ease;
    }

    .series-card:hover, .series-card:active, .series-card:focus {
      transform: translateY(-12px) rotateX(4deg) scale(1.04);
      border-color: rgba(6, 182, 212, 0.8);
      box-shadow: 0 30px 40px -15px rgba(0, 0, 0, 0.9), 
                  0 0 30px rgba(6, 182, 212, 0.35);
    }

    .series-card:hover img, .series-card:active img {
      transform: scale(1.12) translateZ(15px);
      filter: saturate(1.2) brightness(1.08);
    }

    /* Futuristic Backgrounds */
    .cyber-bg-dark {
      background: radial-gradient(circle at 15% 15%, rgba(6, 182, 212, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 85% 85%, rgba(236, 72, 153, 0.12) 0%, transparent 40%),
                  #030712;
    }

    .cyber-bg-light {
      background: radial-gradient(circle at 15% 15%, rgba(14, 165, 233, 0.1) 0%, transparent 40%),
                  radial-gradient(circle at 85% 85%, rgba(219, 39, 119, 0.08) 0%, transparent 40%),
                  #f1f5f9;
    }
  </style>
</head>

<body class="min-h-screen cyber-bg-dark text-slate-100 antialiased selection:bg-cyan-500 selection:text-black transition-colors duration-300" id="bodyTag">

            Cloud TV

      </div>

      <div class="flex items-center gap-2.5">
        <!-- Grid Density Toggle Button -->
        <button id="gridToggleBtn" title="Toggle Grid View" class="w-10 h-10 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 flex items-center justify-center transition-all shadow-lg hover:border-cyan-500 group">
          <i class="fas fa-th-large text-cyan-400 group-hover:scale-110 transition-transform" id="gridIcon"></i>

        <!-- Dark / Light Mode Toggle Button -->
        <button id="themeToggleBtn" title="Toggle Theme" class="w-10 h-10 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 flex items-center justify-center transition-all shadow-lg hover:border-amber-400 group">
          <i class="fas fa-sun text-amber-400 group-hover:rotate-90 transition-transform duration-500" id="themeIcon"></i>
        </button>
      </div>

    </div>

    <!-- Category Tabs (Short, Visible in Front, No Sliding Needed) -->
    <div class="max-w-7xl mx-auto mt-5 flex flex-wrap items-center justify-center gap-2 md:gap-3">
      <button onclick="filterCategory('all')" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/30 flex items-center gap-2" data-category="all">
        <i class="fas fa-globe"></i> All (<span id="countAll">0</span>)
      </button>
      <button onclick="filterCategory('animation')" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all bg-slate-900/90 hover:bg-slate-800 text-slate-300 border border-slate-800 flex items-center gap-2" data-category="animation">
        <i class="fas fa-wand-magic-sparkles text-pink-400"></i> Animation (<span id="countAnim">0</span>)
      </button>
      <button onclick="filterCategory('english')" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all bg-slate-900/90 hover:bg-slate-800 text-slate-300 border border-slate-800 flex items-center gap-2" data-category="english">
        <i class="fas fa-film text-blue-400"></i> English (<span id="countEng">0</span>)
      </button>
      <button onclick="filterCategory('hindi')" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all bg-slate-900/90 hover:bg-slate-800 text-slate-300 border border-slate-800 flex items-center gap-2" data-category="hindi">
        <i class="fas fa-video text-amber-400"></i> Hindi (<span id="countHin">0</span>)
      </button>
      <button onclick="filterCategory('marathi')" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all bg-slate-900/90 hover:bg-slate-800 text-slate-300 border border-slate-800 flex items-center gap-2" data-category="marathi">

    </div>
  </header>

    <div class="relative group">
      <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-cyan-400 group-focus-within:text-yellow-300 transition-colors"></i>
      <input
        type="text"
        id="searchInput"
        placeholder="Search series titles, platforms, or keywords..."
        class="w-full pl-11 pr-24 py-3.5 rounded-2xl bg-slate-900/90 border border-cyan-500/30 text-slate-100 placeholder-slate-400 text-sm focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/50 shadow-2xl transition-all"
      />

        LIVE ENGINE
      </div>
    </div>
  </div>

    <div id="seriesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5 md:gap-7">

    </div>

    </div>
  </main>

    let currentCategory = 'all';
    let isCompactGrid = false;

    function updateCounts() {
      document.getElementById('countAll').innerText = seriesData.length;
      document.getElementById('countAnim').innerText = seriesData.filter(s => s.category === 'animation').length;
      document.getElementById('countEng').innerText = seriesData.filter(s => s.category === 'english').length;
      document.getElementById('countHin').innerText = seriesData.filter(s => s.category === 'hindi').length;
      document.getElementById('countMar').innerText = seriesData.filter(s => s.category === 'marathi').length;
    }

    function renderSeries(filter = '', category = 'all') {
      const grid = document.getElementById('seriesGrid');
      const noResults = document.getElementById('noResults');
      grid.innerHTML = '';

      const filtered = seriesData.filter(item => {
        const matchesCategory = category === 'all' || item.category === category;
        const matchesSearch = item.title.toLowerCase().includes(filter) || item.badge.toLowerCase().includes(filter);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        noResults.classList.remove('hidden');
      } else {
        noResults.classList.add('hidden');
        filtered.forEach(item => {
          const card = document.createElement('a');
          card.href = item.url;
          card.className = "series-card rounded-2xl overflow-hidden bg-slate-900/90 dark:bg-slate-900/90 border border-slate-800 block group shadow-xl";
          card.innerHTML = `
            <div class="aspect-[2/3] overflow-hidden relative">
              <img src="${item.img}" loading="lazy" alt="${item.title}" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent"></div>
              <span class="absolute top-2.5 right-2.5 text-[10px] font-extrabold ${item.badgeColor} text-white px-2 py-0.5 rounded-full border border-white/20 shadow-sm">
                ${item.badge}
              </span>
            </div>
            <div class="p-3.5">
              <h3 class="font-bold text-sm text-slate-100 group-hover:text-cyan-400 transition-colors truncate">${item.title}</h3>
              <p class="text-xs text-slate-400 mt-0.5">${item.subtitle}</p>
              <div class="mt-3 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-cyan-500 via-indigo-500 to-pink-500 w-[${item.progress}%] rounded-full"></div>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      }
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.getAttribute('data-category') === cat) {
          btn.className = "cat-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/30 flex items-center gap-2";
        } else {
          btn.className = "cat-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all bg-slate-900/90 hover:bg-slate-800 text-slate-300 border border-slate-800 flex items-center gap-2";
        }
      });
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      renderSeries(query, currentCategory);
    }

    document.getElementById('searchInput').addEventListener('input', function() {
      const query = this.value.toLowerCase().trim();
      renderSeries(query, currentCategory);
    });

    // Grid Density Toggle
    const gridToggleBtn = document.getElementById('gridToggleBtn');
    const seriesGrid = document.getElementById('seriesGrid');
    const gridIcon = document.getElementById('gridIcon');

    gridToggleBtn.addEventListener('click', () => {
      isCompactGrid = !isCompactGrid;
      if (isCompactGrid) {
        seriesGrid.className = "grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-3 md:gap-4";
        gridIcon.className = "fas fa-th text-pink-400";
      } else {
        seriesGrid.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5 md:gap-7";
        gridIcon.className = "fas fa-th-large text-cyan-400";
      }
    });

    // Dark / Light Mode Toggle
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const bodyTag = document.getElementById('bodyTag');
    const themeIcon = document.getElementById('themeIcon');
    let isDarkMode = true;

    themeToggleBtn.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      if (isDarkMode) {
        bodyTag.className = "min-h-screen cyber-bg-dark text-slate-100 antialiased selection:bg-cyan-500 selection:text-black transition-colors duration-300";
        themeIcon.className = "fas fa-sun text-amber-400 group-hover:rotate-90 transition-transform duration-500";
      } else {
        bodyTag.className = "min-h-screen cyber-bg-light text-slate-900 antialiased selection:bg-cyan-500 selection:text-white transition-colors duration-300";
        themeIcon.className = "fas fa-moon text-indigo-600 group-hover:rotate-90 transition-transform duration-500";
      }
    });

    updateCounts();
    renderSeries('', 'all');
  </script>

        return false;
    }

    // Ctrl+V
    if (e.ctrlKey && e.key.toLowerCase() === "v") {
        e.preventDefault();
        return false;
    }
});

/* =========================
   Disable Right Click
========================= */
document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Dragging
========================= */
document.addEventListener("dragstart", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Selection
========================= */
document.addEventListener("selectstart", function (e) {
    e.preventDefault();
});

/* =========================
   Disable Copy Actions
========================= */
["copy", "cut", "paste"].forEach(function(evt) {

    document.addEventListener(evt, function(e) {
        e.preventDefault();
    });

});

/* =========================
   Detect DevTools Window
   (Desktop ONLY - FIXED)
========================= */
if (!isMobile) {

    setInterval(function () {

        const widthThreshold =
            window.outerWidth - window.innerWidth > 220;

        const heightThreshold =
            window.outerHeight - window.innerHeight > 220;

        if (widthThreshold || heightThreshold) {

            document.body.innerHTML = "";
            window.location.replace("about:blank");
        }

    }, 1500);

}

/* =========================
   Disable Console
========================= */
(function () {

    console.clear();

    function block() {
        return false;
    }

    console.log = block;
    console.warn = block;
    console.error = block;
    console.info = block;
    console.debug = block;
    console.table = block;

})();

/* =========================
   Block "view-source:"
========================= */
if (window.location.href.startsWith("view-source:")) {

    document.body.innerHTML = "";
    window.location.replace("about:blank");

}

/* =========================
   Prevent iframe inspection
========================= */
if (window.top !== window.self) {

    try {
        window.top.location = window.self.location;
    } catch (e) {}

}
</script>

<style>
html, body {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    overflow-x: hidden;
}

/* Disable image dragging */
img {
    pointer-events: none;
    -webkit-user-drag: none;
}

/* Hide selection */
::selection {
    background: transparent;
}
</style>
