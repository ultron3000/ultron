<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Venom — The Symbiote Archives</title>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<!-- HLS.js for HLS playback -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1/dist/hls.min.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap');
    
    :root {
      --primary: #ffffff;
      --primary-glow: rgba(255, 255, 255, 0.5);
      --accent-red: #dc2626;
      --accent-red-glow: rgba(220, 38, 38, 0.4);
      --secondary: #030712;
      --muted: #9ca3af;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--secondary);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(220, 38, 38, 0.15) 0%, transparent 70%),
        radial-gradient(circle at 100% 100%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
        linear-gradient(to bottom, rgba(3, 7, 18, 0.9), rgba(3, 7, 18, 0.98));
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .title-font { font-family: 'Cinzel', serif; }
    .font-rajdhani { font-family: 'Rajdhani', sans-serif; }
    
    .movie-card {
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.9);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
    }
    
    .movie-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--accent-red);
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.4);
    }
    
    .movie-poster {
      aspect-ratio: 2/3;
      transition: transform 0.5s ease;
    }
    
    .movie-card:hover .movie-poster {
      transform: scale(1.05);
    }
    
    /* Symbiote Glowing Text */
    .venom-glow-text {
      background: linear-gradient(135deg, #ffffff 0%, #f8fafc 40%, #ef4444 80%, #7f1d1d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #991b1b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #dc2626; }
    
    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-fade-in { animation: fadeIn 0.6s ease forwards; }
    
    /* Illumination / Hawkeye modal styles (responsive) */
    .modal-backdrop { 
      position: fixed; 
      inset: 0; 
      background: rgba(3, 7, 18, 0.95); 
      display: none; 
      align-items: center; 
      justify-content: center; 
      z-index: 9999; 
      padding: 0;
      backdrop-filter: blur(12px);
    }
    .modal-backdrop.active { display: flex; }
    .modal-card { 
      width: 100%;
      height: 100%;
      max-width: 980px;
      max-height: 90vh;
      border-radius: 0;
      overflow: hidden;
      background: #030712;
      border: 1px solid rgba(220, 38, 38, 0.35);
      box-shadow: 0 0 50px rgba(220, 38, 38, 0.25);
      display: flex;
      flex-direction: column;
    }
    .player-wrapper { 
      position: relative;
      flex: 1;
      min-height: 0;
      background: #000;
    }
    #topCloseBtn { 
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      background: rgba(0,0,0,0.8);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: all 0.2s ease;
    }
    #topCloseBtn:hover {
      background: var(--accent-red);
      color: #fff;
      transform: scale(1.1);
    }
    .player-wrapper video, 
    .player-wrapper iframe { 
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .player-meta { 
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      color: #ddd;
      background: #030712;
      border-top: 1px solid rgba(220, 38, 38, 0.25);
    }
    .player-meta .meta-left { 
      width: 100%;
    }
    .player-meta h3 { 
      margin: 0;
      font-size: 1.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .player-meta p { 
      margin: 4px 0 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .controls-row { 
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    .btn {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid var(--accent-red);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      min-width: 60px;
      flex: 1;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
    }
    .btn:hover { 
      background: var(--accent-red);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
    }

    /* Responsive Desktop Tweaks */
    @media (min-width: 768px) {
      .modal-card {
        width: 92%;
        height: auto;
        border-radius: 8px;
        max-height: 80vh;
      }
      .player-wrapper {
        padding-bottom: 0 !important;
        height: auto !important;
        max-height: 60vh !important;
        position: relative !important;
      }

      .player-wrapper video,
      .player-wrapper iframe {
        height: 100% !important;
        max-height: 60vh !important;
        position: relative !important;
      }

      .player-meta {
        position: relative !important;
        z-index: 100 !important;
        background: #030712 !important;
        padding-top: 10px !important;
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
      }
      .player-meta .meta-left {
        max-width: 65%;
      }

      .controls-row {
        display: flex !important;
        flex-wrap: nowrap !important;
        justify-content: flex-end !important;
        gap: 12px !important;
      }

      .btn {
        min-width: 95px !important;
        padding: 10px 16px !important;
        flex: unset !important;
      }

      .modal-card {
        max-height: 85vh !important;
        overflow: visible !important;
      }

      #topCloseBtn { opacity: 0; }
      .player-wrapper:hover #topCloseBtn { opacity: 1; }
    }

    @media (max-width: 480px) {
      .btn { padding: 8px; font-size: 0; }
      .btn i { font-size: 1rem; margin: 0 !important; }
    }
</style>
</head>
<body class="relative">

<!-- Interactive Symbiote Canvas -->
<canvas id="symbioteCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

<div class="container mx-auto px-4 py-8 max-w-7xl relative z-10">

  <!-- Header Banner Section -->
  <div class="relative w-full h-[260px] sm:h-[320px] md:h-[420px] rounded-2xl overflow-hidden border border-red-900/40 shadow-[0_0_40px_rgba(220,38,38,0.2)] mb-8">
    <!-- YouTube Video Background -->
    <iframe 
      src="https://www.youtube.com/embed/8MO_dtnpiHc?autoplay=1&mute=1&loop=1&playlist=8MO_dtnpiHc&controls=0&modestbranding=1"
      frameborder="0" 
      allow="autoplay; fullscreen" 
      class="absolute top-0 left-0 w-full h-full pointer-events-none scale-125">
    </iframe>

    <div class="absolute inset-0 bg-gradient-to-t from-[#030712] via-black/40 to-transparent"></div>

    <!-- Animated Venom Logo at Top-Left -->
    <div class="absolute top-4 left-4 sm:top-6 sm:left-6 flex items-center gap-3">
      <img 
        src="https://pngimg.com/d/venom_PNG5.png" 
        alt="Venom Symbiote Logo" 
        class="h-14 sm:h-16 md:h-24 animate-logo filter drop-shadow-[0_0_12px_rgba(255,255,255,0.8)]"
      />
      <div>
        <h1 class="title-font text-xl sm:text-2xl md:text-4xl font-black uppercase venom-glow-text tracking-widest">VENOM</h1>
        <p class="font-rajdhani text-[10px] sm:text-xs md:text-sm text-red-500 font-bold tracking-wider uppercase">THE SYMBIOTE CHRONICLES</p>
      </div>
    </div>
  </div>

  <style>
    .animate-logo {
      animation: float-pulse 3s ease-in-out infinite, glow-logo 2.5s ease-in-out infinite alternate;
    }

    @keyframes float-pulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.03); }
    }

    @keyframes glow-logo {
      0% { filter: drop-shadow(0 0 4px #ffffff) drop-shadow(0 0 8px #dc2626); }
      100% { filter: drop-shadow(0 0 12px #ffffff) drop-shadow(0 0 20px #dc2626); }
    }
  </style>

  <!-- Movies Grid Container (2 Columns on Mobile) -->
  <div class="mb-12">
    <div class="flex items-center justify-between border-b border-red-900/30 pb-4 mb-6">
      <h2 class="font-rajdhani text-lg sm:text-2xl font-bold uppercase tracking-wider text-white">
        <i class="fas fa-spider text-red-600 mr-2"></i>AVAILABLE ARCHIVES
      </h2>
      <span class="text-[10px] sm:text-xs font-mono text-red-400 bg-red-950/50 px-2.5 py-1 rounded border border-red-900/40">3 ENTRIES</span>
    </div>

    <!-- Updated to grid-cols-2 for mobile side-by-side view -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3 sm:gap-6" id="movies"></div>
  </div>

  <!-- Footer / Social -->
  <footer class="border-t border-red-900/30 mt-12 pt-6 text-center text-gray-400">
    <div class="flex justify-center gap-6 mb-3">
      <a href="#" class="hover:text-red-500 transition"><i class="fab fa-facebook-f text-lg"></i></a>
      <a href="#" class="hover:text-red-500 transition"><i class="fab fa-twitter text-lg"></i></a>
      <a href="https://www.instagram.com/stark_4152/reels" class="hover:text-red-500 transition"><i class="fab fa-instagram text-lg"></i></a>
      <a href="https://www.youtube.com/channel/UCD9dGWVkAjrdm3D_7gkbi2g" class="hover:text-red-500 transition"><i class="fab fa-youtube text-lg"></i></a>
    </div>
    <p class="font-rajdhani text-xs tracking-wider text-gray-500 uppercase">© VENOM SYMBIOTE UNIVERSE ARCHIVE</p>
  </footer>
</div>

<!-- Illumination-style Modal Player -->
<div id="playbackModal" class="modal-backdrop" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="player-wrapper" id="playerWrapper">
      <video id="modalVideo" controls playsinline style="width:100%;height:100%;background:#000"></video>
      <button id="topCloseBtn" title="Close Player">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>

    <div class="player-meta">
      <div class="meta-left">
        <h3 id="modalTitle">Title</h3>
        <p id="modalDesc" class="text-sm"></p>
      </div>
      <div class="controls-row">
        <button id="prevBtn" class="btn"><i class="fas fa-step-backward mr-2"></i>Prev</button>
        <button id="playPauseBtn" class="btn"><i class="fas fa-play mr-2"></i>Play</button>
        <button id="nextBtn" class="btn">Next<i class="fas fa-step-forward ml-2"></i></button>
        <button id="fullscreenBtn" class="btn"><i class="fas fa-expand"></i></button>
        <button id="muteBtn" class="btn"><i class="fas fa-volume-up"></i></button>
        <button id="closeBtn" class="btn"><i class="fas fa-times"></i></button>
      </div>
    </div>
  </div>
</div>

<script>
    /******************************
     * Movies Array
     ******************************/
    const movies = [
      { 
        title: "Venom", 
        video: "https://mega.nz/embed/BBR2yASZ#pvuTJqLsofXwcz_MMr91pVEp3MdfHBrT7QMDFd_ibJQ", 
        image: "https://i.ebayimg.com/images/g/UyYAAOSwsB9boW0z/s-l1200.jpg", 
        category: "Sci-Fi Action", 
        year: 2018,
        duration: "1h 52m",
        rating: "6.6/10",
        description: "Investigative journalist Eddie Brock attempts a comeback after a scandal, but accidentally bonds with an alien symbiote named Venom that imparts extraordinary superpowers."
      },
      { 
        title: "Venom: Let There Be Carnage", 
        video: "https://mega.nz/embed/EBYQyDKR#lFJDegA_AikwBazmC6sFf__MnZNSUlkkjcQEMJvujZ8", 
        image: "https://m.media-amazon.com/images/I/91Aoh6wnnJL._AC_UF894,1000_QL80_.jpg", 
        category: "Sci-Fi Action", 
        year: 2021,
        duration: "1h 37m",
        rating: "5.9/10",
        description: "Eddie Brock struggles to adjust to life as the host of the alien symbiote Venom, while serial killer Cletus Kasady becomes the host of a terrifying new symbiote offspring, Carnage."
      },
      { 
        title: "Venom: The Last Dance", 
        video: "https://mega.nz/embed/pVRCAQxS#D-scq0wNS1XvfbDApqYH17sX2rAHPGMD2n-wcLF8ZQI", 
        image: "https://posterspy.com/wp-content/uploads/2024/10/Venom-The-Last-Dance-Poster.jpg", 
        category: "Sci-Fi Action", 
        year: 2024,
        duration: "1h 49m",
        rating: "6.2/10",
        description: "Eddie and Venom are on the run. Hunted by both of their worlds and with the net closing in, the duo are forced into a devastating decision that will bring the curtain down on their last dance."
      }
    ];

    const playbackModal = document.getElementById('playbackModal');
    const playerWrapper = document.getElementById('playerWrapper');
    const modalVideoId = 'modalVideo';
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const muteBtn = document.getElementById('muteBtn');

    let currentHls = null;
    let currentFiltered = [];
    let currentIndex = null;

    function isMP4(url) { return /\.mp4($|\?)/i.test((url||'')); }
    function isHls(url) {
      if (!url) return false;
      return url.includes('.m3u8') || url.includes('index-') || /index.*\.txt/i.test(url) || url.includes('manifest') || url.includes('master');
    }
    function isYouTube(url) {
      if (!url) return false;
      return url.includes('youtube.com') || url.includes('youtu.be') || url.includes('youtube-nocookie.com') || url.includes('/embed/');
    }

    function resetPlayerContainer() {
      if (currentHls) {
        try { currentHls.destroy(); } catch(e) {}
        currentHls = null;
      }
      playerWrapper.innerHTML = `<video id="${modalVideoId}" controls playsinline style="width:100%;height:100%;background:#000"></video>`;
    }

    function showModal() {
      playbackModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function hideModal() {
      playbackModal.classList.remove('active');
      document.body.style.overflow = '';
    }

    function openPlayer(list, index) {
      if (!Array.isArray(list) || list.length === 0 || index == null || index < 0 || index >= list.length) return;
      currentFiltered = list;
      currentIndex = index;
      const movie = list[index];
      if (!movie) return;

      modalTitle.textContent = movie.title || '';
      modalDesc.textContent = movie.description || (movie.title || '');

      resetPlayerContainer();
      showModal();

      let src = typeof movie.video === 'object' && movie.video !== null 
        ? (movie.video.high || movie.video.medium || movie.video.low || Object.values(movie.video)[0]) 
        : movie.video;

      if (!src || src === "00") {
        playerWrapper.innerHTML = `
          <div class="flex flex-col items-center justify-center h-full text-center p-6 text-gray-400 font-rajdhani">
            <i class="fas fa-exclamation-triangle text-4xl text-red-600 mb-3"></i>
            <p class="text-base font-bold text-white uppercase">SYMBIOTE FEED OFFLINE</p>
            <p class="text-xs text-gray-500 mt-1">STREAM URL NOT PROVISIONED YET [ERR: 00]</p>
          </div>`;
        return;
      }

      const lc = (src || '').toLowerCase();

      if (lc.includes('streamtape.com') || lc.includes('dood') || lc.includes('vidcdn') || lc.includes('ok.ru') || lc.includes('mega.nz') || lc.includes('openload') || lc.includes('drive.google.com')) {
        playerWrapper.innerHTML = `<iframe src="${src}" width="100%" height="100%" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
        playPauseBtn.innerHTML = '<i class="fas fa-pause mr-2"></i>Pause';
        return;
      }

      if (isYouTube(src)) {
        let embed = src;
        try {
          if (src.includes('watch') && src.includes('v=')) {
            const v = new URLSearchParams(src.split('?')[1]).get('v');
            if (v) embed = `https://www.youtube.com/embed/${v}`;
          } else if (src.includes('youtu.be/')) {
            const p = src.split('youtu.be/')[1].split(/[?&]/)[0];
            if (p) embed = `https://www.youtube.com/embed/${p}`;
          }
        } catch (e) {}
        playerWrapper.innerHTML = `<iframe src="${embed}?autoplay=1&modestbranding=1&rel=0" width="100%" height="100%" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
        playPauseBtn.innerHTML = '<i class="fas fa-pause mr-2"></i>Pause';
        return;
      }

      if (isHls(src)) {
        const v = document.getElementById(modalVideoId);
        if (!v) return;
        if (window.Hls && Hls.isSupported()) {
          currentHls = new Hls();
          try {
            currentHls.loadSource(src);
            currentHls.attachMedia(v);
          } catch (e) { console.warn('HLS attach error', e); }
          currentHls.on(Hls.Events.MANIFEST_PARSED, function() {
            v.play().catch(()=>{});
            playPauseBtn.innerHTML = '<i class="fas fa-pause mr-2"></i>Pause';
          });
        } else if (v.canPlayType && v.canPlayType('application/vnd.apple.mpegurl')) {
          v.src = src;
          v.play().catch(()=>{});
          playPauseBtn.innerHTML = '<i class="fas fa-pause mr-2"></i>Pause';
        }
        return;
      }

      if (isMP4(src)) {
        const v = document.getElementById(modalVideoId);
        if (v) {
          v.src = src;
          v.play().catch(()=>{});
          playPauseBtn.innerHTML = '<i class="fas fa-pause mr-2"></i>Pause';
        }
        return;
      }

      window.location.href = `player.html?title=${encodeURIComponent(movie.title||'')}&video=${encodeURIComponent(src||'')}`;
    }

    function togglePlayPause() {
      const v = document.getElementById(modalVideoId);
      if (!v) return;
      if (v.paused) {
        v.play().catch(()=>{});
        playPauseBtn.innerHTML = '<i class="fas fa-pause mr-2"></i>Pause';
      } else {
        v.pause();
        playPauseBtn.innerHTML = '<i class="fas fa-play mr-2"></i>Play';
      }
    }
    function playNext() {
      if (!currentFiltered || currentFiltered.length === 0) currentFiltered = movies.slice();
      if (currentIndex != null && currentIndex < currentFiltered.length - 1) openPlayer(currentFiltered, currentIndex + 1);
    }
    function playPrev() {
      if (!currentFiltered || currentFiltered.length === 0) currentFiltered = movies.slice();
      if (currentIndex != null && currentIndex > 0) openPlayer(currentFiltered, currentIndex - 1);
    }
    function toggleFullscreen() {
      const el = document.getElementById(modalVideoId) || playerWrapper.querySelector('iframe');
      if (!el) return;
      if (!document.fullscreenElement) {
        (el.requestFullscreen || playerWrapper.requestFullscreen).call(el).catch(()=>{});
      } else {
        document.exitFullscreen();
      }
    }
    function toggleMute() {
      const v = document.getElementById(modalVideoId);
      if (!v) return;
      v.muted = !v.muted;
      muteBtn.innerHTML = v.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    }

    function closeModalHandler() {
      if (currentHls) {
        try { currentHls.destroy(); } catch(e) {}
        currentHls = null;
      }
      const v = document.getElementById(modalVideoId);
      if (v) {
        try { v.pause(); } catch(e){}
        try { v.removeAttribute('src'); v.load(); } catch(e){}
      }
      resetPlayerContainer();
      hideModal();
      currentIndex = null;
      currentFiltered = [];
      playPauseBtn.innerHTML = '<i class="fas fa-play mr-2"></i>Play';
    }

    playPauseBtn.addEventListener('click', togglePlayPause);
    nextBtn.addEventListener('click', playNext);
    prevBtn.addEventListener('click', playPrev);
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    muteBtn.addEventListener('click', toggleMute);
    document.getElementById('closeBtn').addEventListener('click', closeModalHandler);
    document.getElementById('topCloseBtn').addEventListener('click', closeModalHandler);

    playbackModal.addEventListener('click', function(e){
      if (e.target === playbackModal) closeModalHandler();
    });

    document.addEventListener('keydown', (e) => {
      if (!playbackModal.classList.contains('active')) return;
      switch (e.key.toLowerCase()) {
        case 'escape': closeModalHandler(); break;
        case ' ': e.preventDefault(); togglePlayPause(); break;
        case 'arrowright': playNext(); break;
        case 'arrowleft': playPrev(); break;
        case 'f': toggleFullscreen(); break;
        case 'm': toggleMute(); break;
      }
    });

    /******************************
     * Render Movies Grid (Responsive Mobile Setup)
     ******************************/
    const container = document.getElementById('movies');

    function renderMovies(moviesToRender) {
      container.innerHTML = '';
      moviesToRender.forEach((movie, index) => {
        const div = document.createElement('div');
        div.className = `movie-card animate-fade-in rounded-xl overflow-hidden cursor-pointer relative group flex flex-col justify-between`;
        div.innerHTML = `
          <div class="relative overflow-hidden">
            <img src="${movie.image}" alt="${movie.title}" class="w-full h-full object-cover movie-poster">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center p-2 sm:p-4">
              <button class="bg-red-600 hover:bg-red-700 text-white font-rajdhani font-bold py-1.5 px-3 sm:py-2.5 sm:px-5 rounded transition transform hover:scale-105 shadow-[0_0_15px_rgba(220,38,38,0.8)] text-xs sm:text-sm flex items-center gap-1.5 uppercase tracking-wider">
                <i class="fas fa-play"></i> Watch Stream
              </button>
            </div>
            <span class="absolute top-1.5 left-1.5 sm:top-2 sm:left-2 bg-black/80 border border-red-600/40 text-red-400 text-[9px] sm:text-[10px] font-rajdhani px-1.5 py-0.5 rounded uppercase">${movie.rating || 'N/A'}</span>
          </div>
          <div class="p-2.5 sm:p-4 flex flex-col justify-between flex-1">
            <div>
              <h3 class="font-rajdhani font-bold text-sm sm:text-lg text-white truncate tracking-wide">${movie.title}</h3>
              <p class="text-[11px] sm:text-xs text-gray-400 mt-1 line-clamp-2">${movie.description}</p>

        });

        container.appendChild(div);
      });
    }

    renderMovies(movies);

    /******************************
     * Dynamic Symbiote Particles
     ******************************/
    const canvas = document.getElementById('symbioteCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = (Math.random() - 0.5) * 0.5;
        this.color = Math.random() > 0.3 ? '#ffffff' : '#dc2626';
        this.alpha = Math.random() * 0.4 + 0.1;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 60; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
</script>

========================= */

    disableCut: true,
    disablePaste: true,

    /* FIXED */

            document.body.innerHTML = "";
            window.location.replace("about:blank");
        }
    }
});

    }

    if (e.ctrlKey && e.key.toLowerCase() === "u") {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

    // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "i") {
        e.preventDefault();
