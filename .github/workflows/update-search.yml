name: Update CloudTV Search Index

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.html'
      - '**.json'

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Search Index
        run: python scripts/build-search-index.py

      - name: Commit and Push Index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add search-index.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update search index [skip ci]"
          git push
