
name: Deploy Ultron to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh Cloud TV catalogue"]
    types: [completed]
    branches: [main]

jobs:
  deploy-siteje:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Deploy to cloudtv.site.je
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to cloudtv.site.je
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME_SITEJE }}
          password: ${{ secrets.FTP_PASSWORD_SITEJE }}
          server-dir: /htdocs/
          protocol: ftp
          port: 21

  deploy-infinityfree:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Deploy to ultron3000.infinityfree.me
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to ultron3000.infinityfree.me
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME_INFINITY }}
          password: ${{ secrets.FTP_PASSWORD_INFINITY }}
          server-dir: /htdocs/
          protocol: ftp
          port: 21

  deploy-cloudtv-free:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Deploy to cloudtv.free.je
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to cloudtv.free.je
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME_FREE }}
          password: ${{ secrets.FTP_PASSWORD_FREE }}
          server-dir: /htdocs/
          protocol: ftp
          port: 21
