name: Refresh Cloud TV catalogue
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "**/*.html"
      - "*.json"
      - "**/*.json"
      - "*.js"
      - "**/*.js"
      - "scripts/**"
      - ".github/workflows/catalogue-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: cloudtv-catalogue-sync
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild the shared catalogue
        run: node scripts/build-catalogue.js
      - name: Validate generated catalogue
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync("universal-search-index.json", "utf8"));
          if (!Array.isArray(data.records) || !data.records.length || data.count !== data.records.length) {
            throw new Error("Empty or inconsistent catalogue");
          }
          const ids = new Set();
          for (const record of data.records) {
            if (!record.title || !record.url) throw new Error("Missing title or URL: " + JSON.stringify(record));
            if (ids.has(record.id)) throw new Error("Duplicate record ID: " + record.id);
            ids.add(record.id);
          }
          const normalize = value => String(value || "").normalize("NFKD").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
          const disneyPage = fs.readFileSync("disney-animation.html", "utf8");
          if (disneyPage.includes("Atlantis: The Lost Empire") &&
              !data.records.some(record => normalize(record.title) === normalize("Atlantis: The Lost Empire"))) {
            throw new Error("Atlantis regression: title exists on disney-animation.html but is missing from the index");
          }
          console.log("Validated " + data.count + " records; unique IDs; Atlantis regression passed");
          NODE
      - name: Commit catalogue when changed
        run: |
          if git diff --quiet -- universal-search-index.json; then
            echo "Catalogue is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal-search-index.json
          git commit -m "chore: refresh searchable catalogue"
          git push
