name: Refresh Cloud TV catalogue
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "**/*.html"
      - "*.json"
      - "**/*.json"
      - "*.js"
      - "**/*.js"
      - "scripts/**"
      - ".github/workflows/catalogue-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: cloudtv-catalogue-sync
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild the shared catalogue
        run: node scripts/build-catalogue.js
      - name: Validate generated catalogue
        run: node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('universal-search-index.json','utf8')); if(!d.records?.length || d.count!==d.records.length) throw Error('Empty or inconsistent catalogue'); const ids=new Set(); for(const r of d.records){if(!r.title||!r.url) throw Error('Missing title/url: '+JSON.stringify(r)); if(ids.has(r.id)) throw Error('Duplicate ID: '+r.id); ids.add(r.id)} const norm=s=>String(s||'').normalize('NFKD').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); if(fs.readFileSync('disney-animation.html','utf8').includes('Atlantis: The Lost Empire')&&!d.records.some(r=>norm(r.title)===norm('Atlantis: The Lost Empire'))) throw Error('Atlantis regression: missing from index'); console.log('Validated '+d.count+' records; Atlantis present; IDs unique')"
      - name: Commit catalogue when changed
        run: |
          if git diff --quiet -- universal-search-index.json; then
            echo "Catalogue is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal-search-index.json
          git commit -m "chore: refresh searchable catalogue"
          git push
