<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JioTV DASH Streamer</title>
    <!-- Shaka Player UI CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --item-hover: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar / Channel List */
        .sidebar {
            width: 380px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            font-size: 1.25rem;
            margin-bottom: 12px;
        }

        .search-box {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 8px;
        }

        .search-box:focus {
            border-color: var(--accent-color);
        }

        .category-filter {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.9rem;
            outline: none;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 4px;
        }

        .channel-item:hover {
            background-color: var(--item-hover);
        }

        .channel-item.active {
            background-color: var(--accent-color);
        }

        .channel-logo {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: contain;
            background-color: #000;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .channel-info {
            overflow: hidden;
        }

        .channel-name {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-category {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .channel-item.active .channel-category {
            color: #e2e8f0;
        }

        /* Main Player Section */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: center;
            align-items: center;
            background-color: #000;
            position: relative;
        }

        .player-container {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
        }

        .no-channel-selected {
            text-align: center;
            color: #64748b;
        }

        .no-channel-selected h3 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 50%;
            }
            .main-content {
                height: 50%;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar with Channels -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Live Channels</h2>
            <input type="text" id="searchInput" class="search-box" placeholder="Search channels...">
            <select id="categoryFilter" class="category-filter">
                <option value="">All Categories</option>
            </select>
        </div>
        <div class="channel-list" id="channelList">
            <!-- Channels dynamically loaded here -->
        </div>
    </div>

    <!-- Video Player View -->
    <div class="main-content">
        <div class="player-container" id="playerContainer">
            <div class="no-channel-selected" id="placeholder">
                <h3>Select a Channel</h3>
                <p>Choose a channel from the sidebar to start streaming.</p>
            </div>
            <!-- Shaka Player UI container element -->
            <div data-shaka-player-container style="width:100%; height:100%; display:none;" id="shakaContainer">
                <video data-shaka-player id="videoPlayer" autoplay></video>
            </div>
        </div>
    </div>

    <!-- Shaka Player & UI Library JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.js"></script>

    <script>
        let channelsData = [];
        let player = null;
        let ui = null;

        document.addEventListener('DOMContentLoaded', async () => {
            initShakaPlayer();
            await fetchChannels();
            
            document.getElementById('searchInput').addEventListener('input', filterChannels);
            document.getElementById('categoryFilter').addEventListener('change', filterChannels);
        });

        function initShakaPlayer() {
            // Install polyfills
            shaka.polyfill.installAll();

            if (!shaka.Player.isBrowserSupported()) {
                alert('Browser not supported for streaming!');
                return;
            }

            const video = document.getElementById('videoPlayer');
            const container = document.getElementById('playerContainer');
            
            player = new shaka.Player(video);
            ui = new shaka.ui.Overlay(player, container, video);

            // Listen for error events
            player.addEventListener('error', (event) => {
                console.error('Error code', event.detail.code, 'object', event.detail);
            });
        }

        async function fetchChannels() {
            try {
                const response = awaitこう('channels3.json'); // Fetches from your channels3.json file
                if (!response.ok) throw new Error('Failed to load channels3.json');
                channelsData = await response.json();
                
                populateCategories();
                renderChannels(channelsData);
            } catch (error) {
                console.error('Error loading channel list:', error);
                document.getElementById('channelList').innerHTML = '<div style="padding: 16px; color: #ef4444;">Failed to load channels3.json. Make sure the file is hosted in the same directory.</div>';
            }
        }

        function populateCategories() {
            const categories = [...new Set(channelsData.map(c => c.category).filter(Boolean))];
            const categorySelect = document.getElementById('categoryFilter');
            
            categories.sort().forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categorySelect.appendChild(option);
            });
        }

        function renderChannels(channels) {
            const listContainer = document.getElementById('channelList');
            listContainer.innerHTML = '';

            if (channels.length === 0) {
                listContainer.innerHTML = '<div style="padding: 16px; color: #94a3b8; text-align: center;">No channels found</div>';
                return;
            }

            channels.forEach((channel, index) => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.dataset.index = channelsData.indexOf(channel); // Keep reference to original array index

                const logoSrc = channel.logo && channel.logo.trim() !== "" ? channel.logo : 'https://via.placeholder.com/40?text=TV';

                item.innerHTML = `
                    <img class="channel-logo" src="${logoSrc}" alt="${channel.name}" onerror="this.src='https://via.placeholder.com/40?text=TV'">
                    <div class="channel-info">
                        <div class="channel-name">${channel.name}</div>
                        <div class="channel-category">${channel.category || 'General'}</div>
                    </div>
                `;

                item.addEventListener('click', () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    playChannel(channel);
                });

                listContainer.appendChild(item);
            });
        }

        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const selectedCategory = document.getElementById('categoryFilter').value;

            const filtered = channelsData.filter(channel => {
                const matchesQuery = channel.name.toLowerCase().includes(query);
                const matchesCategory = selectedCategory === "" || channel.category === selectedCategory;
                return matchesQuery && matchesCategory;
            });

            renderChannels(filtered);
        }

        async function playChannel(channel) {
            const placeholder = document.getElementById('placeholder');
            const shakaContainer = document.getElementById('shakaContainer');

            placeholder.style.display = 'none';
            shakaContainer.style.display = 'block';

            // Configure DRM Widevine ClearKeys if keys are provided
            if (channel.keys && channel.keys.length > 0) {
                const clearKeys = {};
                channel.keys.forEach(keyPair => {
                    const [keyId, key] = keyPair.split(':');
                    if (keyId && key) {
                        clearKeys[keyId.trim()] = key.trim();
                    }
                });

                player.configure({
                    drm: {
                        clearKeys: clearKeys
                    }
                });
            } else if (channel.keyId && channel.key && channel.keyId !== "null" && channel.key !== "null") {
                player.configure({
                    drm: {
                        clearKeys: {
                            [channel.keyId]: channel.key
                        }
                    }
                });
            } else {
                player.configure({ drm: { clearKeys: {} } });
            }

            try {
                // Load the DASH stream (.mpd)
                await player.load(channel.url);
                console.log('Stream loaded successfully:', channel.name);
            } catch (error) {
                console.error('Error loading video stream:', error);
            }
        }
    </script>
</body>
</html>
